name: Rebuild verified delivery
on:
  push:
    branches: [main]
    paths:
      - production/build-provenance.json
      - production/qa/visual-review.json
      - .github/workflows/rebuild-delivery.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verified-delivery-main
  cancel-in-progress: false
jobs:
  rebuild:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install locked publishing dependencies
        run: python -m pip install -r requirements.lock
      - name: Rebuild and verify against the committed review ledger
        run: make test clean all verify package
      - name: Preserve downloadable build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: verified-delivery
          path: dist/
          retention-days: 30
          if-no-files-found: error
      - name: Commit generated delivery to main
        shell: bash
        run: |
          git fetch origin main
          if [ "$(git rev-parse origin/main)" != "${{ github.sha }}" ]; then
            echo 'Main advanced during this build; artifacts retained, no stale commit pushed.'
            exit 1
          fi
          git add dist/ production/inventory/ production/preflight.json production/build-provenance.json production/qa/
          if git diff --cached --quiet; then
            echo 'Verified delivery already matches main.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          VERSION=$(python tools/manuscript.py --version)
          git commit -m "Rebuild verified $VERSION delivery"
          git push origin HEAD:main
