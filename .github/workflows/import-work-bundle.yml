name: Import Work review bundle
# ChatGPT Work (and this cloud container) cannot upload Git LFS objects. A Work review bundle committed to
# production/art/work/inbox/ as an ordinary file is verified here, its native images are committed through
# Git LFS, its receipts appended, and the intake runs. The imported ZIP is then removed from the inbox (its images
# live in Git LFS; IMPORTED.json records its hash). Nothing is approved: that stays with the orchestrator.
on:
  push:
    branches: [main]
    paths:
      - 'production/art/work/inbox/*.zip'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: art-import
  cancel-in-progress: false
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: blob:none
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image library
        run: python -m pip install pillow==12.3.0
      - name: Write the bundle importer
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/import_bundles.py" <<'PY'
          import hashlib, json, subprocess, sys
          from pathlib import Path
          log = Path('production/art/work/IMPORTED.json')
          done = json.loads(log.read_text()) if log.is_file() else {}
          for z in sorted(Path('production/art/work/inbox').glob('*.zip')):
              h = hashlib.sha256(z.read_bytes()).hexdigest()
              if h in done:
                  z.unlink()
                  continue
              r = subprocess.run([sys.executable, 'tools/art_work_package.py', 'import-bundle', str(z)], capture_output=True, text=True)
              print(r.stdout, r.stderr)
              if r.returncode:
                  sys.exit(f'{z}: bundle failed verification; nothing imported')
              out = json.loads(r.stdout)
              done[h] = {'bundle': z.as_posix(), 'items': out['items'], 'receipts_added': out['receipts_added'],
                         'source': out['source'], 'imported': 'pending intake; not approved'}
              z.unlink()          # its images are now in assets/art/incoming (LFS); the ZIP stays in history only
          log.write_text(json.dumps(done, indent=1) + '\n')
          PY
      - name: Import, ink-prepare, record and commit
        # Each attempt starts from the newest main (the intake bot and Codex also push), then redoes the work.
        shell: bash
        run: |
          export GIT_LFS_SKIP_SMUDGE=1   # resets must not download every LFS file; lfs pull fetches only new ones
          git lfs install --local
          git config user.name "heraldry-art-bot"
          git config user.email "heraldry-art-bot@users.noreply.github.com"
          for i in 1 2 3 4 5; do
            git fetch -q origin main
            git reset -q --hard origin/main
            NEW="$(python tools/art_intake.py needs-pull)"
            if [ -n "$NEW" ]; then git lfs pull --include="$NEW" --exclude=""; fi
            python "$RUNNER_TEMP/import_bundles.py"
            python tools/art_intake.py scan
            git add -A assets/art/incoming assets/art/ink production/art/gpt/RECEIPTS.jsonl production/art/SELECTIONS.json production/art/work/IMPORTED.json production/art/work/inbox   # the inbox README keeps this path present
            if git diff --cached --quiet; then echo "nothing new"; exit 0; fi
            git commit -q -m "art: import ChatGPT Work review bundle and intake"
            if git push -q origin HEAD:main; then exit 0; fi
            echo "main moved during import; retrying from the new head"
            sleep $((i * 3))
          done
          exit 1
