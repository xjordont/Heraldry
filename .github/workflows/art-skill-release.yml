name: Build v7 illustration skill release
on:
  push:
    branches: [main]
    paths:
      - 'production/art/skill/heraldry-classic-ink-art/**'
      - 'tools/art_skill_build.py'
      - '.github/workflows/art-skill-release.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: heraldry-art-skill-release
  cancel-in-progress: false
jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image validation dependency
        run: python -m pip install pillow==12.3.0
      - name: Check source consistency and build deterministic v7 ZIP
        run: |
          python tools/art_skill_build.py --check
          python tools/art_skill_build.py
          python production/art/skill/heraldry-classic-ink-art/scripts/validate_skill.py --zip production/art/skill/Heraldry_Classic_Ink_Art_Skill_v7_0.zip --repo .
      - name: Run v7 safety tests
        run: python -m unittest discover -s production/art/skill/heraldry-classic-ink-art/tests -p 'test_*.py' -v
      - name: Commit release ZIP only if checkout is current
        run: |
          git add production/art/skill/Heraldry_Classic_Ink_Art_Skill_v7_0.zip
          if git diff --cached --quiet; then
            echo 'v7 ZIP already matches committed source.'
            exit 0
          fi
          git fetch origin main
          if [ "$(git rev-parse origin/main)" != "${{ github.sha }}" ]; then
            echo 'Main advanced during the release build; no stale ZIP pushed. Rerun after updating.'
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "build(art): publish v7 classic ink skill ZIP"
          git push origin HEAD:main
