name: Repository checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  manuscript-and-workflow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install locked dependencies
        run: python -m pip install -r requirements.lock
      - name: Build v6 artwork skill release for verification
        run: |
          python tools/art_skill_build.py --check
          python tools/art_skill_build.py
          python production/art/skill/heraldry-classic-ink-art/scripts/validate_skill.py --zip production/art/skill/Heraldry_Classic_Ink_Art_Skill_v6_0.zip --repo .
      - name: Test v6 artwork skill guards
        run: python -m unittest discover -s production/art/skill/heraldry-classic-ink-art/tests -p 'test_*.py' -v
      - name: Check immutable manuscript chain and production contracts
        run: python tools/preflight.py --baseline
      - name: Check revision and failure gates
        run: python -m unittest discover -s tests -v
      - name: Protect prior snapshots and revision records
        env:
          BASE_REF: ${{ github.event.before || github.event.pull_request.base.sha }}
        run: |
          if [ -n "$BASE_REF" ] && [ "$BASE_REF" != "0000000000000000000000000000000000000000" ]; then
            python tools/check_history.py --base "$BASE_REF"
          fi
