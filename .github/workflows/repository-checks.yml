name: Repository checks
on:
  push:
    branches: [main]
    paths-ignore:
      # a Codex delivery (one image and its receipt) changes no code: the intake workflow handles it
      - 'assets/art/incoming/**'
      - 'production/art/gpt/RECEIPTS.jsonl'
      # log, status, and proposal-only pushes need no test run (AGENTS.md, Checks)
      - 'production/STATE.md'
      - 'production/RELEASE_STATUS.md'
      - 'editorial/proposals/**'
      - 'reports/**'
      - 'research_notes/**'
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: repository-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
env:
  PYTHONUTF8: '1'
jobs:
  manuscript-and-workflow:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0       # check_history compares against the previous head
          filter: blob:none    # commits and trees only: old PDFs and ZIPs in history are never downloaded
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install locked dependencies
        run: python -m pip install -r requirements.lock
      - name: Check locked dependencies and native imports
        run: python tools/check_dependencies.py --ci
      - name: Test the artwork skill
        # the skill ZIP and the offline package are build outputs: the repository tests build and validate fresh copies
        run: python -m unittest discover -s production/art/skill/heraldry-classic-ink-art/tests -p 'test_*.py'
      - name: Check immutable manuscript chain and production contracts
        run: python tools/preflight.py --baseline
      - name: List the Hero portraits the Hero card tests compile
        # only the 24 portraits named in basic-heroes.json (about 8 MB), not the full art library
        id: portraits
        shell: bash
        run: |
          INC=$(python -c "import json; d=json.load(open('typst/heroes/basic-heroes.json')); h=d if isinstance(d, list) else d.get('heroes', d); print(','.join(sorted({'assets/art/ink/' + x['art'] + '.png' for x in h if x.get('art')})))")
          echo "include=$INC" >> "$GITHUB_OUTPUT"
          mkdir -p build
          git lfs ls-files -l -I "$INC" | cut -d' ' -f1 | sort > build/lfs-portraits.txt
      - name: Restore cached portraits (saves LFS bandwidth on every push)
        uses: actions/cache@v4
        with:
          path: .git/lfs/objects
          key: lfs-portraits-${{ runner.os }}-${{ hashFiles('build/lfs-portraits.txt') }}
      - name: Fetch the portraits (only objects not already cached)
        shell: bash
        run: git lfs pull --include="${{ steps.portraits.outputs.include }}" --exclude=""
      - name: Check revision and failure gates
        run: python -m unittest discover -s tests
      - name: Protect prior snapshots and revision records
        shell: bash
        env:
          BASE_REF: ${{ github.event.before || github.event.pull_request.base.sha }}
        run: |
          if [ -n "$BASE_REF" ] && [ "$BASE_REF" != "0000000000000000000000000000000000000000" ]; then
            python tools/check_history.py --base "$BASE_REF"
          fi
