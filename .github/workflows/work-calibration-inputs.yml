name: Export Work calibration inputs
# Builds the self-contained ChatGPT Work input package with tools/art_work_package.py (the same builder Claude Code
# uses for the committed copy), verifies it offline with Git credentials stripped, and uploads it as an artifact.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/work-calibration-inputs.yml'
      - 'tools/art_work_package.py'
      - 'production/art/gpt/QUEUE.json'
      - 'production/art/gpt/prompts/**'
      - 'production/art/skill/**'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: work-calibration-inputs
  cancel-in-progress: false
jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch only queue reference LFS objects
        shell: bash
        run: |
          python - <<'PY'
          import json, subprocess
          from pathlib import Path
          queue = json.loads(Path('production/art/gpt/QUEUE.json').read_text())
          refs = sorted({r for i in queue['items'] for r in i['references']})
          pointers = [r for r in refs if Path(r).read_bytes().startswith(b'version https://git-lfs')]
          if pointers:
              subprocess.run(['git', 'lfs', 'install', '--local', '--skip-smudge'], check=True)
              subprocess.run(['git', 'lfs', 'pull', '--include=' + ','.join(pointers), '--exclude='], check=True)
          PY
      - name: Install image decoding dependency
        run: python -m pip install pillow==12.3.0
      - name: Build and verify the exact input package
        shell: bash
        run: |
          mkdir work-export
          python tools/art_work_package.py build --out work-export/Heraldry_Work_Calibration_Inputs.zip
          status=0
          python tools/art_work_package.py verify work-export/Heraldry_Work_Calibration_Inputs.zip > work-export/VERIFY_REPORT.json || status=$?
          cat work-export/VERIFY_REPORT.json
          exit $status
      - uses: actions/upload-artifact@v4
        with:
          name: Heraldry-Work-Calibration-Inputs
          path: |
            work-export/Heraldry_Work_Calibration_Inputs.zip
            work-export/WORK_PACKAGE.json
            work-export/VERIFY_REPORT.json
          if-no-files-found: error
          retention-days: 14
