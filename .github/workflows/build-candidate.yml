name: Build candidate
# Unattended candidate build (owner request 2026-10-14). Starts when the orchestrator (Codex, via tools/build_request.py)
# pushes production/build-request.json to main, or by hand. It runs the tests, a clean reproducible build and every automated
# check, and publishes the PDFs as a GitHub *pre-release* named "<RC>-candidate-<n>". It cannot make the final release: the
# mandatory all-page visual review is bound to the exact PDF and is done by Codex. Result: production/BUILD_STATUS.json.
# docs/BUILD_AUTOMATION.md describes the whole chain.
on:
  push:
    branches: [main]
    paths: ['production/build-request.json']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: publication-main
  cancel-in-progress: false
  queue: max
env:
  PYTHONUTF8: '1'
jobs:
  candidate:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: blob:none
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Reuse verified unit measurements
        # Measurement entries self-validate their complete input identity and PDF.
        # Keep them outside build/ so the required clean build can reuse them.
        uses: actions/cache@v4
        with:
          path: .cache/layout-measurements
          key: layout-measurements-v1-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: layout-measurements-v1-${{ runner.os }}-
      - name: List the artwork the build places
        run: |
          mkdir -p build
          L='assets/art/incoming/ART-CH*-001.png,assets/art/incoming/ART-COVER-001.png,assets/art/ink/*.png,assets/art/cover/front.png,assets/art/cover/front-owner.jpg'
          echo "LFS_ART=$L" >> "$GITHUB_ENV"
          git lfs ls-files -l -I "$L" | cut -d' ' -f1 | sort > build/lfs-art.txt
      - name: Reuse artwork fetched by earlier builds
        uses: actions/cache@v4
        with:
          path: .git/lfs/objects
          key: lfs-art-${{ hashFiles('build/lfs-art.txt') }}
          restore-keys: lfs-art-
      - name: Fetch that artwork
        id: lfs
        run: git lfs pull --include="$LFS_ART" --exclude=""
      - name: Check reviewed artwork masters
        id: art
        run: python tools/check_art.py
      - name: Install locked publishing dependencies
        id: deps
        run: |
          python -m pip install -r requirements.lock
          python tools/check_dependencies.py --publish
      - name: Tests and clean build
        id: build
        run: make PY=python test clean all
      - name: Verify (the visual review is expected to be pending)
        id: verify
        continue-on-error: true
        run: |
          # Never let a committed report from an earlier build satisfy this run.
          rm -f production/qa/STATUS.json
          python tools/verify.py
      - name: Require every automated candidate gate
        id: gate
        if: steps.build.outcome == 'success'
        run: python tools/build_status.py --check-candidate
      - name: Page-review aids (contact sheets, detail pages, covers)
        id: aids
        if: steps.gate.outcome == 'success'
        run: |
          V=$(python tools/manuscript.py --version)
          python tools/review_aids.py build --pdf dist/Heraldry_"$V"_digital.pdf
      - name: Publish a pre-release
        id: release
        if: steps.gate.outcome == 'success' && steps.aids.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(python tools/manuscript.py --version)
          TAG="$VERSION-candidate-$GITHUB_RUN_NUMBER"
          if [ "${GITHUB_RUN_ATTEMPT:-1}" != "1" ]; then TAG="$TAG-attempt-$GITHUB_RUN_ATTEMPT"; fi
          shopt -s nullglob
          (cd dist && sha256sum Heraldry_"$VERSION"_*.pdf > SHA256SUMS-candidate.txt)
          gh release create "$TAG" dist/Heraldry_"$VERSION"_*.pdf dist/SHA256SUMS-candidate.txt --prerelease --target "$GITHUB_SHA" \
            --title "Heraldry $VERSION candidate (build $GITHUB_RUN_NUMBER, visual review pending)" \
            --notes "Unattended candidate of $VERSION from $GITHUB_SHA. NOT a release: the all-page visual review is pending."
          echo "url=https://github.com/$GITHUB_REPOSITORY/releases/tag/$TAG" >> "$GITHUB_OUTPUT"
      - name: Record the result on main
        if: always()
        env:
          FAILED_STEP: ${{ steps.lfs.outcome == 'failure' && 'fetch artwork' || steps.art.outcome == 'failure' && 'check artwork' || steps.deps.outcome == 'failure' && 'install dependencies' || steps.build.outcome == 'failure' && 'tests and clean build' || steps.gate.outcome != 'success' && 'candidate verification gate' || steps.aids.outcome != 'success' && 'review aids' || steps.release.outcome != 'success' && 'publish pre-release' || '' }}
        run: |
          RID=$(python -c "import json;print(json.load(open('production/build-request.json'))['request_id'])" 2>/dev/null || echo "manual-$GITHUB_RUN_ID")
          python tools/build_status.py --request-id "$RID" --failed-step "$FAILED_STEP" --source-commit "$GITHUB_SHA" \
            --run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --release-url "${{ steps.release.outputs.url }}"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add production/BUILD_STATUS.json
          git add -A production/qa/review
          git commit -m "Build candidate status ($RID)" || exit 0
          for i in 1 2 3 4; do git push origin HEAD:main && exit 0; git pull --rebase --autostash origin main; sleep $((i * 5)); done
          exit 1
      - name: Preserve compact candidate diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: candidate-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 14
          if-no-files-found: warn
          # Explicit ledger snapshots only; a failed early step can leave a previous committed ledger.
          # The job outcome and BUILD_STATUS identify this run. Never upload private references or PDF/image bytes.
          path: |
            production/BUILD_STATUS.json
            production/preflight.json
            production/build-provenance.json
            production/qa/STATUS.json
            production/qa/keep-audit.json
            production/qa/layout.json
            production/qa/figure-review-gate.json
