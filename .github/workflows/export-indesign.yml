name: Export editable InDesign project
on:
  workflow_dispatch:
permissions:
  contents: read
env:
  PYTHONUTF8: '1'
jobs:
  editable-project:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install locked dependencies
        run: python -m pip install -r requirements.lock
      - name: Fetch only the publication assets required by InDesign
        run: git lfs pull --include="assets/art/ink/**,assets/art/cover/**"
      - name: Validate repository
        run: python tools/dev.py check --base HEAD
      - name: Export source-based IDML and linked project
        run: python tools/dev.py indesign export --output build/indesign/project
      - name: Verify packaged text, links and immutable input bytes
        run: python tools/dev.py indesign verify --project build/indesign/project
      - uses: actions/upload-artifact@v4
        with:
          name: Heraldry-editable-InDesign-project
          path: build/indesign/project/
          if-no-files-found: error
          retention-days: 14
