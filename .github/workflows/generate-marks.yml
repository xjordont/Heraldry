name: Generate heraldic marks
# Owner instruction 2026-10-12: generate the logo and chapter arms with the Gemini image API ("nano banana").
# Manual only. Requires the repository secret GEMINI_API_KEY; spend shares the cap in config/art_style.json.
# Candidates are committed to assets/art/marks/candidates/ (Git LFS) for review; nothing is placed until approved.
on:
  workflow_dispatch:
    inputs:
      ids:
        description: 'Optional space-separated mark IDs (e.g. "MARK-LOGO"); empty = all in production/art/marks/PROMPTS.json'
        required: false
        default: ''
permissions:
  contents: write
concurrency:
  group: generate-marks
  cancel-in-progress: false
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image library
        run: python -m pip install pillow==12.3.0
      - name: Generate
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          IDS: ${{ inputs.ids }}
        run: python tools/mark_generate.py run ${IDS:+--ids $IDS}
      - name: Commit candidates
        run: |
          git lfs install --local
          git config user.name "heraldry-art-bot"
          git config user.email "heraldry-art-bot@users.noreply.github.com"
          git add assets/art/marks production/art/GENERATION_LEDGER.jsonl
          git diff --cached --quiet && { echo "nothing generated"; exit 0; }
          git commit -qm "art: heraldic mark candidates (Gemini)"
          for k in 1 2 3 4 5; do git pull --rebase -q origin main && git push -q origin HEAD:main && exit 0; sleep $((k*3)); done
          exit 1
