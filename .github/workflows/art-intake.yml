name: Intake ChatGPT artwork
# Runs when an art worker (Codex or ChatGPT Work) or the owner commits images to assets/art/incoming/.
# Converts each new <catalog id> image to transparent black ink, records it as 'received' in
# production/art/SELECTIONS.json. The reviewer makes contact sheets locally (`art_intake.py pending --sheet`), so none are
# committed per run. Approval is a separate, explicit `art_intake.py approve` by whoever reviews the images.
on:
  push:
    branches: [main]
    paths:
      - 'assets/art/incoming/**'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: art-intake
  cancel-in-progress: false
jobs:
  intake:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: blob:none   # commits and trees only; the intake reads the current files
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image library
        run: python -m pip install "$(grep '^pillow==' requirements.lock)"
      - name: Ink-prepare, record and commit new images
        # Each attempt starts from the newest main, so runs that queue behind each other (one Codex push per
        # image) never re-process or conflict over an image an earlier run already recorded.
        run: |
          export GIT_LFS_SKIP_SMUDGE=1   # resets must not download every LFS file; lfs pull fetches only new ones
          git lfs install --local
          git config user.name "heraldry-art-bot"
          git config user.email "heraldry-art-bot@users.noreply.github.com"
          for i in 1 2 3 4 5; do
            git fetch -q origin main
            git reset -q --hard origin/main
            # Only new images: a pointer's oid is the image's SHA-256, so recorded ones need no download.
            NEW="$(python tools/art_intake.py needs-pull)"
            if [ -n "$NEW" ]; then git lfs pull --include="$NEW" --exclude=""; fi
            python tools/art_intake.py scan
            git add assets/art/ink production/art/SELECTIONS.json
            if git diff --cached --quiet; then echo "nothing new"; exit 0; fi
            git commit -q -m "art: intake of delivered images"
            if git push -q origin HEAD:main; then exit 0; fi
            echo "main moved during intake; retrying from the new head"
            sleep $((i * 3))
          done
          exit 1
