name: Intake ChatGPT artwork
# Runs when ChatGPT Work (or the owner) commits images to assets/art/incoming/.
# Converts each new <catalog id> image to transparent black ink, records it as 'received' in
# production/art/SELECTIONS.json and commits a review contact sheet. Approval stays with the orchestrator.
on:
  push:
    branches: [main]
    paths:
      - 'assets/art/incoming/**'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: art-intake
  cancel-in-progress: false
jobs:
  intake:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image library
        run: python -m pip install pillow==12.3.0
      - name: Fetch incoming images
        run: |
          git lfs install --local
          git lfs pull --include="assets/art/incoming/*.png" --exclude=""
      - name: Ink-prepare and record new images
        run: python tools/art_intake.py scan
      - name: Commit intake results
        run: |
          git config user.name "heraldry-art-bot"
          git config user.email "heraldry-art-bot@users.noreply.github.com"
          git add assets/art/ink production/art/SELECTIONS.json production/art/review
          if git diff --cached --quiet; then echo "nothing new"; exit 0; fi
          git commit -m "art: intake of ChatGPT Work images"
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep $((i * 3))
          done
          exit 1
