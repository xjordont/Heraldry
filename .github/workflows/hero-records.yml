name: Build Hero records
# On request: the illustrated blank Hero record and the 24 populated Basic Mode Heroes as PDFs.
# They are build outputs and are never committed (docs/LARGE_FILES.md); they are published as a
# pre-release tagged RC###-hero-records-N (a Release, not an Actions artifact, so the account's
# artifact storage quota cannot block delivery). The build fails if the committed blank differs from the generator, or if any Hero's text
# overflows, falls below 9 pt, or misses B.4 rules, items or coins (assets/hero-record/sheet.py).
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install locked dependencies and the renderer
        run: |
          python -m pip install -r requirements.lock playwright==1.63.0
          python -m playwright install --with-deps chromium
      - name: Fetch the Hero portraits
        # only the 24 portraits named in basic-heroes.json, not the full art library
        run: |
          INC=$(python -c "import json; d=json.load(open('typst/heroes/basic-heroes.json')); print(','.join(sorted('assets/art/ink/' + h['art'] + '.png' for h in d['heroes'])))")
          git lfs pull --include="$INC" --exclude=""
      - name: Blank sides are current
        run: |
          python assets/hero-record/sheet.py blank --pdf build/hero-records/hero-record-blank.pdf
          git diff --exit-code -- assets/hero-record/hero-record-front.html assets/hero-record/hero-record-reverse.html
      - name: Populated Basic Mode Heroes
        run: python assets/hero-record/sheet.py heroes --no-png --pdf build/hero-records/basic-heroes.pdf
      - name: Publish the PDFs as a pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(python tools/manuscript.py --version)
          TAG="$VERSION-hero-records-$GITHUB_RUN_NUMBER"
          if [ "${GITHUB_RUN_ATTEMPT:-1}" != "1" ]; then TAG="$TAG-attempt-$GITHUB_RUN_ATTEMPT"; fi
          (cd build/hero-records && sha256sum basic-heroes.pdf hero-record-blank.pdf > SHA256SUMS.txt)
          gh release create "$TAG" build/hero-records/basic-heroes.pdf build/hero-records/hero-record-blank.pdf \
            build/hero-records/SHA256SUMS.txt --prerelease --target "$GITHUB_SHA" \
            --title "Hero records from $VERSION (run $GITHUB_RUN_NUMBER)" \
            --notes "Illustrated blank Hero record and the 24 populated Basic Mode Heroes from $VERSION at $GITHUB_SHA. Not a book release; not yet approved by the owner."
          echo "Published https://github.com/$GITHUB_REPOSITORY/releases/tag/$TAG" >> "$GITHUB_STEP_SUMMARY"
