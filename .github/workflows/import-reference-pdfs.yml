name: Import original visual reference PDFs
on:
  push:
    branches: [main]
    paths:
      - references/sample_pdfs.json
      - .github/workflows/import-reference-pdfs.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: original-reference-import
  cancel-in-progress: false
jobs:
  import:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare scoped LFS upload actions
        env:
          GH_TOKEN: ${{ github.token }}
        run: python references/import_lfs.py prepare --output "$RUNNER_TEMP/reference-upload"
      - name: Transfer instructions for the authorized upload
        uses: actions/upload-artifact@v4
        with:
          name: reference-upload-actions
          path: ${{ runner.temp }}/reference-upload/upload-actions.json
          retention-days: 1
          if-no-files-found: error
      - name: Verify stored originals and commit PDF pointers to main
        env:
          GH_TOKEN: ${{ github.token }}
        run: python references/import_lfs.py finish --timeout 900
