name: Update GitHub README
on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_run:
    workflows:
      - Repository checks
      - Build candidate
      - Rebuild verified delivery
      - Intake ChatGPT artwork
      - Import Work review bundle
      - Generate pen-and-ink artwork (retired Gemini fallback)
      - Generate heraldic marks
      - Generate art variants
      - Build art packages
      - Export editable InDesign project
    types: [completed]
    branches: [main]
permissions:
  contents: write
  actions: read
# Share the publication lock; max queues preserve pending publication requests.
concurrency:
  group: publication-main
  cancel-in-progress: false
  queue: max
env:
  PYTHONUTF8: '1'
jobs:
  refresh:
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name != 'workflow_run' ||
       (github.event.workflow_run.head_repository.full_name == github.repository &&
        github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.event != 'pull_request' &&
        github.event.workflow_run.event != 'pull_request_target'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          filter: blob:none
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install locked dependencies
        run: python -m pip install -r requirements.lock
      - name: Check contracts and run required pre-push tests
        run: |
          python tools/preflight.py --baseline
          make PY=python test
      - name: Refresh generated README blocks only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python tools/update_readme.py --publish
