<line x1="78" y1="69.63" x2="78" y2="73.63" stroke="#000" stroke-width="1" stroke-linecap="butt"/>
<polygon points="73.05,144.37 70.02,149.61 63.98,149.61 60.95,144.37 63.98,139.14 70.02,139.14" fill="url(#p-mon)" stroke="#000" stroke-width="1" stroke-linejoin="round"/>
<polygon points="78,140.37 82,144.37 78,148.37 74,144.37" fill="#fff" stroke="#000" stroke-width="1.2" stroke-linejoin="round"/>
<line x1="76" y1="144.37" x2="80" y2="144.37" stroke="#000" stroke-width="1" stroke-linecap="butt"/>
