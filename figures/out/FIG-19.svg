<text x="18" y="10.4" font-weight="700" font-family="'Source Sans 3'" font-size="9.5" fill="#000">The Courier's Strongbox (B.6)</text>
<rect x="4" y="24" width="168" height="168" fill="#fff" stroke="#000" stroke-width="1.1"/>
<rect x="4" y="24" width="168" height="28" fill="#f0f0f0" stroke="#000" stroke-width="0.9" stroke-dasharray="3.5 2"/>
