<rect x="82.05" y="103.45" width="11.9" height="9.1" fill="#d9d9d9" stroke="#000" stroke-width="1"/>
<line x1="82.05" y1="107.3" x2="93.95" y2="107.3" stroke="#000" stroke-width="0.8" stroke-linecap="butt"/>
<circle cx="53" cy="38" r="4.6" fill="#000" stroke="#000" stroke-width="0.75"/>
