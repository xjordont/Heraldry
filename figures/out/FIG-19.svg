<circle cx="88" cy="108" r="49" fill="none" stroke="#8c8c8c" stroke-width="0.8" stroke-dasharray="2 2.5"/>
<polygon points="136.05,108 133.02,113.24 126.98,113.24 123.95,108 126.98,102.76 133.02,102.76" fill="url(#p-mon)" stroke="#000" stroke-width="1" stroke-linejoin="round"/>
<polygon points="141,104 145,108 141,112 137,108" fill="#fff" stroke="#000" stroke-width="1.2" stroke-linejoin="round"/>
<line x1="139" y1="108" x2="143" y2="108" stroke="#000" stroke-width="1" stroke-linecap="butt"/>
