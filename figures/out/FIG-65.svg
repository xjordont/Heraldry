<svg xmlns="http://www.w3.org/2000/svg" width="504pt" height="318.2pt" viewBox="0 0 504 318.2">
<title>Initiative Phase: roll, ties, who chooses, and the solo/cooperative pointer</title>
<desc>Show the Initiative Phase in order, whose modifier is used, the three tie-breakers, who chooses the first Party Phase activation, and where solo and cooperative play use PvE Initiative instead.</desc>
<defs>
<pattern id="p-cover" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="5" height="5" fill="#fff"/><path d="M0 0.5H5M0.5 0V5" stroke="#444" stroke-width="0.7" fill="none"/></pattern>
<pattern id="p-diff" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="4" height="4" fill="#fff"/><circle cx="1" cy="1" r="0.75" fill="#222"/><circle cx="3" cy="3" r="0.75" fill="#222"/></pattern>
<pattern id="p-imp" width="2.4" height="2.4" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="2.4" height="2.4" fill="#fff"/><path d="M0.4 0V2.4" stroke="#000" stroke-width="0.95" fill="none"/></pattern>
<pattern id="p-mon" width="3.2" height="3.2" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)"><rect width="3.2" height="3.2" fill="#fff"/><path d="M0.5 0V3.2" stroke="#000" stroke-width="1" fill="none"/></pattern>
<pattern id="p-aoe" width="4" height="4" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)"><rect width="4" height="4" fill="#fff"/><path d="M0.5 0V4" stroke="#777" stroke-width="1.4" fill="none"/></pattern>
</defs>
<rect x="0" y="0" width="13" height="13" fill="#000"/>
<text x="6.5" y="10.4" font-weight="700" font-family="'Source Sans 3'" font-size="9" fill="#fff" text-anchor="middle">A</text>
<text x="18" y="10.4" font-weight="700" font-family="'Source Sans 3'" font-size="9.5" fill="#000">Initiative Phase in order (3.2)</text>
<rect x="0" y="20" width="254" height="38.4" fill="#fff" stroke="#000" stroke-width="0.9" rx="2.5"/>
<circle cx="12" cy="32" r="6.6" fill="#000" stroke="#000" stroke-width="0.5"/>
<text x="12" y="35.3" font-weight="700" font-family="'Source Sans 3'" font-size="9" fill="#fff" text-anchor="middle">1</text>
<text x="25" y="32.5" font-family="'Source Sans 3'" font-size="9" fill="#000"><tspan font-weight="700">Refresh AP.</tspan><tspan font-weight="400"> Each combatant on the battlefield with an AP</tspan></text>
<text x="25" y="43.3" font-weight="400" font-family="'Source Sans 3'" font-size="9" fill="#000">maximum refreshes AP to their normal maximum unless a</text>
<text x="25" y="54.1" font-weight="400" font-family="'Source Sans 3'" font-size="9" fill="#000">rule says otherwise.</text>
<line x1="12" y1="58.9" x2="12" y2="60.9" stroke="#000" stroke-width="1.2" stroke-linecap="butt"/>
<polygon points="12,66.9 8.8,59.9 15.2,59.9" fill="#000"/>
<rect x="0" y="66.4" width="254" height="27.6" fill="#fff" stroke="#000" stroke-width="0.9" rx="2.5"/>
<circle cx="12" cy="78.4" r="6.6" fill="#000" stroke="#000" stroke-width="0.5"/>
<text x="12" y="81.7" font-weight="700" font-family="'Source Sans 3'" font-size="9" fill="#fff" text-anchor="middle">2</text>
<text x="25" y="78.9" font-family="'Source Sans 3'" font-size="9" fill="#000"><tspan font-weight="700">Roll.</tspan><tspan font-weight="400"> Competitive play: each side rolls 1d20 and adds its</tspan></text>
<text x="25" y="89.7" font-weight="400" font-family="'Source Sans 3'" font-size="9" fill="#000">Party Leader's INT and SPI (panel B).</text>
<line x1="12" y1="94.5" x2="12" y2="96.5" stroke="#000" stroke-width="1.2" stroke-linecap="butt"/>
<polygon points="12,102.5 8.8,95.5 15.2,95.5" fill="#000"/>
<rect x="0" y="102" width="254" height="27.6" fill="#fff" stroke="#000" stroke-width="0.9" rx="2.5"/>
<circle cx="12" cy="114" r="6.6" fill="#000" stroke="#000" stroke-width="0.5"/>
<text x="12" y="117.3" font-weight="700" font-family="'Source Sans 3'" font-size="9" fill="#fff" text-anchor="middle">3</text>
<text x="25" y="114.5" font-family="'Source Sans 3'" font-size="9" fill="#000"><tspan font-weight="700">Compare.</tspan><tspan font-weight="400"> The higher total wins Initiative for the round. A</tspan></text>
<text x="25" y="125.3" font-weight="400" font-family="'Source Sans 3'" font-size="9" fill="#000">tie goes to the tie-breakers (panel C).</text>
<line x1="12" y1="130.1" x2="12" y2="132.1" stroke="#000" stroke-width="1.2" stroke-linecap="butt"/>
<polygon points="12,138.1 8.8,131.1 15.2,131.1" fill="#000"/>
<rect x="0" y="137.6" width="254" height="38.4" fill="#fff" stroke="#000" stroke-width="0.9" rx="2.5"/>
<circle cx="12" cy="149.6" r="6.6" fill="#000" stroke="#000" stroke-width="0.5"/>
<text x="12" y="152.9" font-weight="700" font-family="'Source Sans 3'" font-size="9" fill="#fff" text-anchor="middle">4</text>
<text x="25" y="150.1" font-family="'Source Sans 3'" font-size="9" fill="#000"><tspan font-weight="700">Choose.</tspan><tspan font-weight="400"> The side that wins Initiative chooses which side</tspan></text>
<text x="25" y="160.9" font-weight="400" font-family="'Source Sans 3'" font-size="9" fill="#000">takes the first Party Phase activation. Sides then alternate,</text>
<text x="25" y="171.7" font-weight="400" font-family="'Source Sans 3'" font-size="9" fill="#000">beginning with that side (3.3).</text>
<line x1="12" y1="176.5" x2="12" y2="178.5" stroke="#000" stroke-width="1.2" stroke-linecap="butt"/>
<polygon points="12,184.5 8.8,177.5 15.2,177.5" fill="#000"/>
<rect x="0" y="184" width="254" height="38.4" fill="#fff" stroke="#000" stroke-width="0.9" rx="2.5"/>
<circle cx="12" cy="196" r="6.6" fill="#000" stroke="#000" stroke-width="0.5"/>
<text x="12" y="199.3" font-weight="700" font-family="'Source Sans 3'" font-size="9" fill="#fff" text-anchor="middle">5</text>
<text x="25" y="196.5" font-family="'Source Sans 3'" font-size="9" fill="#000"><tspan font-weight="700">Start of round.</tspan><tspan font-weight="400"> Resolve effects that occur at the start of the</tspan></text>
<text x="25" y="207.3" font-weight="400" font-family="'Source Sans 3'" font-size="9" fill="#000">round. If 2 or more would resolve at the same time, use 3.6</text>
<text x="25" y="218.1" font-weight="400" font-family="'Source Sans 3'" font-size="9" fill="#000">Timing Rules.</text>
<rect x="0" y="229.4" width="13" height="13" fill="#000"/>
<text x="6.5" y="239.8" font-weight="700" font-family="'Source Sans 3'" font-size="9" fill="#fff" text-anchor="middle">E</text>
<text x="18" y="239.8" font-weight="700" font-family="'Source Sans 3'" font-size="9.5" fill="#000">Source example: start of Round 3 (3.2)</text>
<text x="0" y="256.4" font-weight="600" font-family="'Source Sans 3'" font-size="9" fill="#000">Road Wardens</text>
<rect x="84" y="247.4" width="127.5" height="12" fill="#000" stroke="#000" stroke-width="0.8"/>
<text x="215.5" y="256.8" font-weight="700" font-family="'Source Sans 3'" font-size="9" fill="#000">total 17</text>
<text x="0" y="270.9" font-weight="600" font-family="'Source Sans 3'" font-size="9" fill="#000">Opposing side</text>
<rect x="84" y="261.9" width="105" height="12" fill="#d9d9d9" stroke="#000" stroke-width="0.8"/>
<text x="193" y="271.3" font-weight="700" font-family="'Source Sans 3'" font-size="9" fill="#000">total 14</text>
<text x="0" y="284.4" font-weight="400" font-family="'Source Sans 3'" font-size="9" fill="#000">Both sides refresh AP. The Road Wardens win Initiative and choose</text>
<text x="0" y="295" font-weight="400" font-family="'Source Sans 3'" font-size="9" fill="#000">to act second. A Power that lasts until the start of Round 3 ends</text>
<text x="0" y="305.6" font-weight="400" font-family="'Source Sans 3'" font-size="9" fill="#000">after Initiative is determined.</text>
<rect x="268" y="0" width="13" height="13" fill="#000"/>
<text x="274.5" y="10.4" font-weight="700" font-family="'Source Sans 3'" font-size="9" fill="#fff" text-anchor="middle">B</text>
<text x="286" y="10.4" font-weight="700" font-family="'Source Sans 3'" font-size="9.5" fill="#000">Whose modifier is used (competitive)</text>
<rect x="268" y="20" width="236" height="28.1" fill="#fff" stroke="#000" stroke-width="0.9" rx="2.5"/>
<text x="272" y="31.4" font-family="'Source Sans 3'" font-size="9" fill="#000"><tspan font-weight="700">Party Leader on the battlefield:</tspan><tspan font-weight="400"> the side adds that Party</tspan></text>
<text x="272" y="42.2" font-weight="400" font-family="'Source Sans 3'" font-size="9" fill="#000">Leader's INT and SPI.</text>
<line x1="280" y1="49.1" x2="280" y2="52.1" stroke="#000" stroke-width="1.2" stroke-linecap="butt"/>
<polygon points="280,58.1 276.8,51.1 283.2,51.1" fill="#000"/>
<text x="290" y="56.3" font-weight="400" font-family="'Source Sans 3'" font-size="9" fill="#333">otherwise</text>
<rect x="268" y="58.6" width="236" height="28.1" fill="#fff" stroke="#000" stroke-width="0.9" rx="2.5"/>
<text x="272" y="70" font-family="'Source Sans 3'" font-size="9" fill="#000"><tspan font-weight="700">Party Leader not on the battlefield:</tspan><tspan font-weight="400"> the side chooses one</tspan></text>
<text x="272" y="80.8" font-weight="400" font-family="'Source Sans 3'" font-size="9" fill="#000">allied Hero on the battlefield to provide the modifier instead.</text>
<line x1="280" y1="87.7" x2="280" y2="90.7" stroke="#000" stroke-width="1.2" stroke-linecap="butt"/>
<polygon points="280,96.7 276.8,89.7 283.2,89.7" fill="#000"/>
<text x="290" y="94.9" font-weight="400" font-family="'Source Sans 3'" font-size="9" fill="#333">otherwise</text>
<rect x="268" y="97.2" width="236" height="28.1" fill="#fff" stroke="#000" stroke-width="0.9" rx="2.5"/>
<text x="272" y="108.6" font-family="'Source Sans 3'" font-size="9" fill="#000"><tspan font-weight="700">No allied Hero on the battlefield:</tspan><tspan font-weight="400"> the side rolls 1d20 with</tspan></text>
<text x="272" y="119.4" font-weight="400" font-family="'Source Sans 3'" font-size="9" fill="#000">no ability modifiers.</text>
<rect x="268" y="131.3" width="13" height="13" fill="#000"/>
<text x="274.5" y="141.7" font-weight="700" font-family="'Source Sans 3'" font-size="9" fill="#fff" text-anchor="middle">C</text>
<text x="286" y="141.7" font-weight="700" font-family="'Source Sans 3'" font-size="9.5" fill="#000">Tied Initiative: use the first that resolves it</text>
<rect x="268" y="150.3" width="24" height="14" fill="#f0f0f0" stroke="#000" stroke-width="0.8" rx="2.5"/>
<text x="280" y="160.5" font-weight="700" font-family="'Source Sans 3'" font-size="9" fill="#000" text-anchor="middle">1st</text>
<text x="298" y="160.1" font-family="'Source Sans 3'" font-size="9" fill="#000"><tspan font-weight="400">Highest </tspan><tspan font-weight="700">DEX</tspan><tspan font-weight="400"> among the Heroes used for the Initiative</tspan></text>
<text x="298" y="170.7" font-weight="400" font-family="'Source Sans 3'" font-size="9" fill="#000">roll, if each side used a Hero.</text>
<rect x="268" y="178.5" width="24" height="14" fill="#f0f0f0" stroke="#000" stroke-width="0.8" rx="2.5"/>
<text x="280" y="188.7" font-weight="700" font-family="'Source Sans 3'" font-size="9" fill="#000" text-anchor="middle">2nd</text>
<text x="298" y="188.3" font-weight="400" font-family="'Source Sans 3'" font-size="9" fill="#000">Starting in Round 2, the side that won Initiative in the</text>
<text x="298" y="198.9" font-weight="400" font-family="'Source Sans 3'" font-size="9" fill="#000">previous round.</text>
<rect x="268" y="206.7" width="24" height="14" fill="#f0f0f0" stroke="#000" stroke-width="0.8" rx="2.5"/>
<text x="280" y="216.9" font-weight="700" font-family="'Source Sans 3'" font-size="9" fill="#000" text-anchor="middle">3rd</text>
<text x="298" y="216.5" font-weight="400" font-family="'Source Sans 3'" font-size="9" fill="#000">Roll off again.</text>
<rect x="268" y="227.7" width="13" height="13" fill="#000"/>
<text x="274.5" y="238.1" font-weight="700" font-family="'Source Sans 3'" font-size="9" fill="#fff" text-anchor="middle">D</text>
<text x="286" y="238.1" font-weight="700" font-family="'Source Sans 3'" font-size="9.5" fill="#000">Solo and cooperative play (10.5.4)</text>
<rect x="268" y="245.7" width="236" height="60.5" fill="#f0f0f0" stroke="#000" stroke-width="0.7" rx="2.5"/>
<text x="272" y="257.1" font-weight="400" font-family="'Source Sans 3'" font-size="9" fill="#000">One allied player rolls 1d20 and adds bonuses granted to the</text>
<text x="272" y="267.9" font-family="'Source Sans 3'" font-size="9" fill="#000"><tspan font-weight="400">party's Initiative roll, not a Party Leader's INT or SPI. </tspan><tspan font-weight="700">12 or</tspan></text>
<text x="272" y="278.7" font-family="'Source Sans 3'" font-size="9" fill="#000"><tspan font-weight="700">higher:</tspan><tspan font-weight="400"> Party Phase, then Monster Phase. </tspan><tspan font-weight="700">11 or lower:</tspan></text>
<text x="272" y="289.5" font-weight="400" font-family="'Source Sans 3'" font-size="9" fill="#000">Monster Phase, then Party Phase. This roll replaces</text>
<text x="272" y="300.3" font-weight="400" font-family="'Source Sans 3'" font-size="9" fill="#000">competitive side-based Initiative.</text>
</svg>
