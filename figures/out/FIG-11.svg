<svg xmlns="http://www.w3.org/2000/svg" width="504pt" height="336.1pt" viewBox="0 0 504 336.1">
<title>Standard Monster AI Script</title>
<desc>Show the five-instruction decision procedure: first valid instruction executes and the activation ends.</desc>
<defs>
<pattern id="p-cover" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="5" height="5" fill="#fff"/><path d="M0 0.5H5M0.5 0V5" stroke="#444" stroke-width="0.7" fill="none"/></pattern>
<pattern id="p-diff" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="4" height="4" fill="#fff"/><circle cx="1" cy="1" r="0.75" fill="#222"/><circle cx="3" cy="3" r="0.75" fill="#222"/></pattern>
<pattern id="p-imp" width="2.4" height="2.4" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="2.4" height="2.4" fill="#fff"/><path d="M0.4 0V2.4" stroke="#000" stroke-width="0.95" fill="none"/></pattern>
<pattern id="p-mon" width="3.2" height="3.2" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)"><rect width="3.2" height="3.2" fill="#fff"/><path d="M0.5 0V3.2" stroke="#000" stroke-width="1" fill="none"/></pattern>
<pattern id="p-aoe" width="4" height="4" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)"><rect width="4" height="4" fill="#fff"/><path d="M0.5 0V4" stroke="#777" stroke-width="1.4" fill="none"/></pattern>
</defs>
<rect x="0" y="0" width="504" height="40.9" fill="#f0f0f0" stroke="#000" stroke-width="0.7" rx="2.5"/>
<text x="5" y="12.38" font-family="'Source Sans 3'" font-size="9" fill="#000"><tspan font-weight="700">Before the steps:</tspan><tspan font-weight="400"> determine the Primary Target, applying any Target Priority printed in a Scenario-Specific Monster's AI Steps first;</tspan></text>
<text x="5" y="23.18" font-family="'Source Sans 3'" font-size="9" fill="#000"><tspan font-weight="400">otherwise it is the nearest visible enemy (9.5 E). Re-determine it if it ceases to be legal. The Monster executes the </tspan><tspan font-weight="700">first valid</tspan></text>
<text x="5" y="33.98" font-family="'Source Sans 3'" font-size="9" fill="#000"><tspan font-weight="700">instruction</tspan><tspan font-weight="400"> and ignores the rest unless a rule says they continue. Monsters do not use AP.</tspan></text>
<rect x="0" y="52.9" width="196" height="43.2" fill="#fff" stroke="#000" stroke-width="1" rx="2.5"/>
<circle cx="13" cy="65.9" r="6.6" fill="#000" stroke="#000" stroke-width="0.5"/>
<text x="13" y="69.2" font-weight="700" font-family="'Source Sans 3'" font-size="9" fill="#fff" text-anchor="middle">1</text>
<text x="26" y="67.9" font-weight="700" font-family="'Source Sans 3'" font-size="9.5" fill="#000">AI Step Abilities</text>
<text x="5" y="79.9" font-weight="400" font-family="'Source Sans 3'" font-size="9" fill="#000">Does the Monster have a listed AI Step ability</text>
<text x="5" y="90.5" font-weight="400" font-family="'Source Sans 3'" font-size="9" fill="#000">whose trigger is met?</text>
<rect x="242" y="52.9" width="262" height="43.2" fill="#f0f0f0" stroke="#000" stroke-width="0.8" rx="2.5"/>
<text x="247" y="64.9" font-weight="400" font-family="'Source Sans 3'" font-size="9" fill="#000">Resolve the first valid AI Step, in ascending order. A step marked d6</text>
<text x="247" y="75.5" font-weight="400" font-family="'Source Sans 3'" font-size="9" fill="#000">N+ is valid only on a roll of N or higher. The activation ends unless</text>
<text x="247" y="86.1" font-weight="400" font-family="'Source Sans 3'" font-size="9" fill="#000">the ability says it continues (9.5 D).</text>
<line x1="198" y1="65.9" x2="235" y2="65.9" stroke="#000" stroke-width="1.2" stroke-linecap="butt"/>
<polygon points="241,65.9 234,62.7 234,69.1" fill="#000"/>
<text x="220" y="62.9" font-weight="700" font-family="'Source Sans 3'" font-size="9" fill="#000" text-anchor="middle">yes</text>
<line x1="30" y1="96.1" x2="30" y2="104.1" stroke="#000" stroke-width="1.2" stroke-linecap="butt"/>
<polygon points="30,110.1 26.8,103.1 33.2,103.1" fill="#000"/>
<text x="36" y="107.1" font-weight="700" font-family="'Source Sans 3'" font-size="9" fill="#000">no</text>
<rect x="0" y="110.1" width="196" height="50.4" fill="#fff" stroke="#000" stroke-width="1" rx="2.5"/>
<circle cx="13" cy="123.1" r="6.6" fill="#000" stroke="#000" stroke-width="0.5"/>
<text x="13" y="126.4" font-weight="700" font-family="'Source Sans 3'" font-size="9" fill="#fff" text-anchor="middle">2</text>
<text x="26" y="125.1" font-weight="700" font-family="'Source Sans 3'" font-size="9.5" fill="#000">Engaged</text>
<text x="5" y="137.1" font-weight="400" font-family="'Source Sans 3'" font-size="9" fill="#000">Is the Monster Engaged?</text>
<rect x="242" y="110.1" width="262" height="50.4" fill="#f0f0f0" stroke="#000" stroke-width="0.8" rx="2.5"/>
<text x="247" y="122.1" font-weight="400" font-family="'Source Sans 3'" font-size="9" fill="#000">Attack the enemy it is Engaged with; if more than one, the one with</text>
<text x="247" y="132.7" font-weight="400" font-family="'Source Sans 3'" font-size="9" fill="#000">the lowest current HP (ties: Most Recent Attacker, then Random</text>
<text x="247" y="143.3" font-weight="400" font-family="'Source Sans 3'" font-size="9" fill="#000">Determination). Use Multi-Attack if listed; otherwise a legal melee</text>
<text x="247" y="153.9" font-weight="400" font-family="'Source Sans 3'" font-size="9" fill="#000">attack, or a legal ranged attack if it has no legal melee attack.</text>
<line x1="198" y1="123.1" x2="235" y2="123.1" stroke="#000" stroke-width="1.2" stroke-linecap="butt"/>
<polygon points="241,123.1 234,119.9 234,126.3" fill="#000"/>
<text x="220" y="120.1" font-weight="700" font-family="'Source Sans 3'" font-size="9" fill="#000" text-anchor="middle">yes</text>
<line x1="30" y1="160.5" x2="30" y2="168.5" stroke="#000" stroke-width="1.2" stroke-linecap="butt"/>
<polygon points="30,174.5 26.8,167.5 33.2,167.5" fill="#000"/>
<text x="36" y="171.5" font-weight="700" font-family="'Source Sans 3'" font-size="9" fill="#000">no</text>
<rect x="0" y="174.5" width="196" height="50.4" fill="#fff" stroke="#000" stroke-width="1" rx="2.5"/>
<circle cx="13" cy="187.5" r="6.6" fill="#000" stroke="#000" stroke-width="0.5"/>
<text x="13" y="190.8" font-weight="700" font-family="'Source Sans 3'" font-size="9" fill="#fff" text-anchor="middle">3</text>
<text x="26" y="189.5" font-weight="700" font-family="'Source Sans 3'" font-size="9.5" fill="#000">Visible Target</text>
<text x="5" y="201.5" font-weight="400" font-family="'Source Sans 3'" font-size="9" fill="#000">Not Engaged, but is an enemy visible?</text>
<rect x="242" y="174.5" width="262" height="50.4" fill="#f0f0f0" stroke="#000" stroke-width="0.8" rx="2.5"/>
<text x="247" y="186.5" font-weight="400" font-family="'Source Sans 3'" font-size="9" fill="#000">Move toward the Primary Target; if Engaged by that movement,</text>
<text x="247" y="197.1" font-weight="400" font-family="'Source Sans 3'" font-size="9" fill="#000">attack as in step 2. If it has a ranged attack and can attack without</text>
<text x="247" y="207.7" font-weight="400" font-family="'Source Sans 3'" font-size="9" fill="#000">becoming Engaged, it instead moves to the nearest legal firing</text>
<text x="247" y="218.3" font-weight="400" font-family="'Source Sans 3'" font-size="9" fill="#000">position and attacks.</text>
<line x1="198" y1="187.5" x2="235" y2="187.5" stroke="#000" stroke-width="1.2" stroke-linecap="butt"/>
<polygon points="241,187.5 234,184.3 234,190.7" fill="#000"/>
<text x="220" y="184.5" font-weight="700" font-family="'Source Sans 3'" font-size="9" fill="#000" text-anchor="middle">yes</text>
<line x1="30" y1="224.9" x2="30" y2="232.9" stroke="#000" stroke-width="1.2" stroke-linecap="butt"/>
<polygon points="30,238.9 26.8,231.9 33.2,231.9" fill="#000"/>
<text x="36" y="235.9" font-weight="700" font-family="'Source Sans 3'" font-size="9" fill="#000">no</text>
<rect x="0" y="238.9" width="196" height="43.2" fill="#fff" stroke="#000" stroke-width="1" rx="2.5"/>
<circle cx="13" cy="251.9" r="6.6" fill="#000" stroke="#000" stroke-width="0.5"/>
<text x="13" y="255.2" font-weight="700" font-family="'Source Sans 3'" font-size="9" fill="#fff" text-anchor="middle">4</text>
<text x="26" y="253.9" font-weight="700" font-family="'Source Sans 3'" font-size="9.5" fill="#000">Search</text>
<text x="5" y="265.9" font-weight="400" font-family="'Source Sans 3'" font-size="9" fill="#000">No enemy visible, but is a Hidden enemy within</text>
<text x="5" y="276.5" font-weight="400" font-family="'Source Sans 3'" font-size="9" fill="#000">12" and LOS?</text>
<rect x="242" y="238.9" width="262" height="43.2" fill="#f0f0f0" stroke="#000" stroke-width="0.8" rx="2.5"/>
<text x="247" y="250.9" font-weight="400" font-family="'Source Sans 3'" font-size="9" fill="#000">That enemy's controller makes a DEX Check; on a failure it loses</text>
<text x="247" y="261.5" font-weight="400" font-family="'Source Sans 3'" font-size="9" fill="#000">Hidden. If several, the nearest. The activation then ends.</text>
<line x1="198" y1="251.9" x2="235" y2="251.9" stroke="#000" stroke-width="1.2" stroke-linecap="butt"/>
<polygon points="241,251.9 234,248.7 234,255.1" fill="#000"/>
<text x="220" y="248.9" font-weight="700" font-family="'Source Sans 3'" font-size="9" fill="#000" text-anchor="middle">yes</text>
<line x1="30" y1="282.1" x2="30" y2="290.1" stroke="#000" stroke-width="1.2" stroke-linecap="butt"/>
<polygon points="30,296.1 26.8,289.1 33.2,289.1" fill="#000"/>
<text x="36" y="293.1" font-weight="700" font-family="'Source Sans 3'" font-size="9" fill="#000">no</text>
<rect x="0" y="296.1" width="196" height="36" fill="#fff" stroke="#000" stroke-width="1" rx="2.5"/>
<circle cx="13" cy="309.1" r="6.6" fill="#000" stroke="#000" stroke-width="0.5"/>
<text x="13" y="312.4" font-weight="700" font-family="'Source Sans 3'" font-size="9" fill="#fff" text-anchor="middle">5</text>
<text x="26" y="311.1" font-weight="700" font-family="'Source Sans 3'" font-size="9.5" fill="#000">No Visible Target</text>
<text x="5" y="323.1" font-weight="400" font-family="'Source Sans 3'" font-size="9" fill="#000">None of the above applies.</text>
<rect x="242" y="296.1" width="262" height="36" fill="#f0f0f0" stroke="#000" stroke-width="0.8" rx="2.5"/>
<text x="247" y="308.1" font-weight="400" font-family="'Source Sans 3'" font-size="9" fill="#000">Move toward the Guard Point, objective, patrol route or</text>
<text x="247" y="318.7" font-weight="400" font-family="'Source Sans 3'" font-size="9" fill="#000">scenario-directed destination by Movement Priorities (9.5 F).</text>
<line x1="198" y1="309.1" x2="234" y2="309.1" stroke="#000" stroke-width="1.2" stroke-linecap="butt"/>
<polygon points="240,309.1 233,305.9 233,312.3" fill="#000"/>
</svg>
