<text x="340" y="319" font-weight="400" font-family="'Source Sans 3'" font-size="9" fill="#000">Zones and bands are drawn to scale on a</text>
<text x="340" y="329.4" font-weight="400" font-family="'Source Sans 3'" font-size="9" fill="#000">36"×36" battlefield (4 pt per inch); Hero</text>
<text x="340" y="339.8" font-weight="400" font-family="'Source Sans 3'" font-size="9" fill="#000">markers are enlarged. North and South</text>
<text x="340" y="350.2" font-weight="400" font-family="'Source Sans 3'" font-size="9" fill="#000">are the short edges and East and West the</text>
<text x="340" y="360.6" font-weight="400" font-family="'Source Sans 3'" font-size="9" fill="#000">long edges, even on a square battlefield</text>
<text x="340" y="371" font-weight="400" font-family="'Source Sans 3'" font-size="9" fill="#000">(10.1). Each party may field 1–4 Heroes;</text>
<text x="340" y="381.4" font-weight="400" font-family="'Source Sans 3'" font-size="9" fill="#000">two or three are shown. Sun-Drowned 2,</text>
<text x="340" y="391.8" font-weight="400" font-family="'Source Sans 3'" font-size="9" fill="#000">The Mire 5 and The Mire 6 state no band</text>
<text x="340" y="402.2" font-weight="400" font-family="'Source Sans 3'" font-size="9" fill="#000">distance: the 6" band is the general</text>
<text x="340" y="412.6" font-weight="400" font-family="'Source Sans 3'" font-size="9" fill="#000">pattern there, not a stated value.</text>
