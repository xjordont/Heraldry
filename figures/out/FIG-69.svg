<svg xmlns="http://www.w3.org/2000/svg" width="504pt" height="327.5pt" viewBox="0 0 504 327.5">
<title>Illegal Actions: target legality, Climb and Jump, and what happens to AP</title>
<desc>Show the order of legality checks for an action (target legal at declaration and resolution, Climb and Jump destination, illegal before resolving, interrupted or incomplete movement) and the AP consequence of each.</desc>
<defs>
<pattern id="p-cover" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="5" height="5" fill="#fff"/><path d="M0 0.5H5M0.5 0V5" stroke="#444" stroke-width="0.7" fill="none"/></pattern>
<pattern id="p-diff" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="4" height="4" fill="#fff"/><circle cx="1" cy="1" r="0.75" fill="#222"/><circle cx="3" cy="3" r="0.75" fill="#222"/></pattern>
<pattern id="p-imp" width="2.4" height="2.4" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="2.4" height="2.4" fill="#fff"/><path d="M0.4 0V2.4" stroke="#000" stroke-width="0.95" fill="none"/></pattern>
<pattern id="p-mon" width="3.2" height="3.2" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)"><rect width="3.2" height="3.2" fill="#fff"/><path d="M0.5 0V3.2" stroke="#000" stroke-width="1" fill="none"/></pattern>
<pattern id="p-aoe" width="4" height="4" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)"><rect width="4" height="4" fill="#fff"/><path d="M0.5 0V4" stroke="#777" stroke-width="1.4" fill="none"/></pattern>
</defs>
<rect x="0" y="0" width="13" height="13" fill="#000"/>
<text x="6.5" y="10.4" font-weight="700" font-family="'Source Sans 3'" font-size="9" fill="#fff" text-anchor="middle">A</text>
<text x="18" y="10.4" font-weight="700" font-family="'Source Sans 3'" font-size="9.5" fill="#000">At declaration (4.6)</text>
<rect x="0" y="20" width="250" height="103.4" fill="#fff" stroke="#000" stroke-width="0.9" rx="2.5"/>
<circle cx="12" cy="32" r="6.6" fill="#000" stroke="#000" stroke-width="0.5"/>
<text x="12" y="35.3" font-weight="700" font-family="'Source Sans 3'" font-size="9" fill="#fff" text-anchor="middle">1</text>
<text x="25" y="32.5" font-family="'Source Sans 3'" font-size="9" fill="#000"><tspan font-weight="700">Target legal?</tspan><tspan font-weight="400"> If the action requires a target, it must be</tspan></text>
<text x="25" y="43.1" font-weight="400" font-family="'Source Sans 3'" font-size="9" fill="#000">legal when the action is declared and when it resolves. A</text>
<text x="25" y="53.7" font-weight="400" font-family="'Source Sans 3'" font-size="9" fill="#000">target is legal only if it:</text>
<text x="27" y="64.3" font-weight="700" font-family="'Source Sans 3'" font-size="9" fill="#000">•</text>
<text x="36" y="64.3" font-weight="400" font-family="'Source Sans 3'" font-size="9" fill="#000">matches the rule's target description and count</text>
<text x="27" y="74.9" font-weight="700" font-family="'Source Sans 3'" font-size="9" fill="#000">•</text>
<text x="36" y="74.9" font-weight="400" font-family="'Source Sans 3'" font-size="9" fill="#000">is within the required distance or range</text>
<text x="27" y="85.5" font-weight="700" font-family="'Source Sans 3'" font-size="9" fill="#000">•</text>
<text x="36" y="85.5" font-weight="400" font-family="'Source Sans 3'" font-size="9" fill="#000">meets any required LOS or visibility</text>
<text x="27" y="96.1" font-weight="700" font-family="'Source Sans 3'" font-size="9" fill="#000">•</text>
<text x="36" y="96.1" font-weight="400" font-family="'Source Sans 3'" font-size="9" fill="#000">satisfies every other restriction in that rule</text>
<text x="25" y="106.7" font-weight="400" font-family="'Source Sans 3'" font-size="9" fill="#000">This procedure adds no LOS or visibility requirement to a</text>
<text x="25" y="117.3" font-weight="400" font-family="'Source Sans 3'" font-size="9" fill="#000">rule that has none.</text>
<line x1="12" y1="123.9" x2="12" y2="125.9" stroke="#000" stroke-width="1.2" stroke-linecap="butt"/>
<polygon points="12,131.9 8.8,124.9 15.2,124.9" fill="#000"/>
<rect x="0" y="131.4" width="250" height="39.8" fill="#fff" stroke="#000" stroke-width="0.9" rx="2.5"/>
<circle cx="12" cy="143.4" r="6.6" fill="#000" stroke="#000" stroke-width="0.5"/>
<text x="12" y="146.7" font-weight="700" font-family="'Source Sans 3'" font-size="9" fill="#fff" text-anchor="middle">2</text>
<text x="25" y="143.9" font-family="'Source Sans 3'" font-size="9" fill="#000"><tspan font-weight="700">Climb or Jump:</tspan><tspan font-weight="400"> a legal destination must be declared</tspan></text>
<text x="25" y="154.5" font-family="'Source Sans 3'" font-size="9" fill="#000"><tspan font-weight="400">before the </tspan><tspan font-weight="700">Check</tspan><tspan font-weight="400"> is rolled. If it cannot be, the combatant</tspan></text>
<text x="25" y="165.1" font-weight="400" font-family="'Source Sans 3'" font-size="9" fill="#000">cannot attempt it.</text>
<rect x="0" y="176.2" width="250" height="28.1" fill="#f0f0f0" stroke="#000" stroke-width="0.7" rx="2.5"/>
<text x="4" y="187.6" font-family="'Source Sans 3'" font-size="9" fill="#000"><tspan font-weight="400">If a failed </tspan><tspan font-weight="700">Check</tspan><tspan font-weight="400"> forces the action to choose another target, the</tspan></text>
<text x="4" y="198.4" font-weight="400" font-family="'Source Sans 3'" font-size="9" fill="#000">rejected target remains ineligible for that action.</text>
<rect x="264" y="0" width="13" height="13" fill="#000"/>
<text x="270.5" y="10.4" font-weight="700" font-family="'Source Sans 3'" font-size="9" fill="#fff" text-anchor="middle">B</text>
<text x="282" y="10.4" font-weight="700" font-family="'Source Sans 3'" font-size="9.5" fill="#000">After declaration: three cases (4.6, 2.6.1)</text>
<rect x="264" y="20" width="240" height="50.4" fill="#fff" stroke="#000" stroke-width="0.9" rx="2.5"/>
<circle cx="276" cy="32" r="6.6" fill="#000" stroke="#000" stroke-width="0.5"/>
<text x="276" y="35.3" font-weight="700" font-family="'Source Sans 3'" font-size="9" fill="#fff" text-anchor="middle">3</text>
<text x="289" y="32.5" font-family="'Source Sans 3'" font-size="9" fill="#000"><tspan font-weight="700">Illegal before it resolves?</tspan><tspan font-weight="400"> The action fails and has no</tspan></text>
<text x="289" y="43.1" font-weight="400" font-family="'Source Sans 3'" font-size="9" fill="#000">effect unless a rule says otherwise. Its AP remains spent</text>
<text x="289" y="53.7" font-weight="400" font-family="'Source Sans 3'" font-size="9" fill="#000">unless the action was abandoned during Declared State</text>
<text x="289" y="64.3" font-weight="400" font-family="'Source Sans 3'" font-size="9" fill="#000">verification (2.6.1).</text>
<rect x="264" y="75.4" width="240" height="29.2" fill="#fff" stroke="#000" stroke-width="0.9" rx="2.5"/>
<circle cx="276" cy="87.4" r="6.6" fill="#000" stroke="#000" stroke-width="0.5"/>
<text x="276" y="90.7" font-weight="700" font-family="'Source Sans 3'" font-size="9" fill="#fff" text-anchor="middle">4</text>
<text x="289" y="87.9" font-family="'Source Sans 3'" font-size="9" fill="#000"><tspan font-weight="700">Movement interrupted by a Reaction?</tspan><tspan font-weight="400"> Resolve the</tspan></text>
<text x="289" y="98.5" font-weight="400" font-family="'Source Sans 3'" font-size="9" fill="#000">interruption under 2.6.1.</text>
<rect x="264" y="109.6" width="240" height="89.8" fill="#fff" stroke="#000" stroke-width="0.9" rx="2.5"/>
<circle cx="276" cy="121.6" r="6.6" fill="#000" stroke="#000" stroke-width="0.5"/>
<text x="276" y="124.9" font-weight="700" font-family="'Source Sans 3'" font-size="9" fill="#fff" text-anchor="middle">5</text>
<text x="289" y="122.1" font-family="'Source Sans 3'" font-size="9" fill="#000"><tspan font-weight="700">Path cannot be completed legally?</tspan><tspan font-weight="400"> If movement has</tspan></text>
<text x="289" y="132.7" font-weight="400" font-family="'Source Sans 3'" font-size="9" fill="#000">otherwise begun, the combatant stops at the last legal</text>
<text x="289" y="143.3" font-weight="400" font-family="'Source Sans 3'" font-size="9" fill="#000">position.</text>
<rect x="292" y="151.4" width="140" height="20" fill="#fff"/>
<line x1="292" y1="151.4" x2="292" y2="171.4" stroke="#a6a6a6" stroke-width="0.5" stroke-linecap="butt"/>
<line x1="312" y1="151.4" x2="312" y2="171.4" stroke="#a6a6a6" stroke-width="0.5" stroke-linecap="butt"/>
<line x1="332" y1="151.4" x2="332" y2="171.4" stroke="#a6a6a6" stroke-width="0.5" stroke-linecap="butt"/>
<line x1="352" y1="151.4" x2="352" y2="171.4" stroke="#a6a6a6" stroke-width="0.5" stroke-linecap="butt"/>
<line x1="372" y1="151.4" x2="372" y2="171.4" stroke="#a6a6a6" stroke-width="0.5" stroke-linecap="butt"/>
<line x1="392" y1="151.4" x2="392" y2="171.4" stroke="#a6a6a6" stroke-width="0.5" stroke-linecap="butt"/>
<line x1="412" y1="151.4" x2="412" y2="171.4" stroke="#a6a6a6" stroke-width="0.5" stroke-linecap="butt"/>
<line x1="432" y1="151.4" x2="432" y2="171.4" stroke="#a6a6a6" stroke-width="0.5" stroke-linecap="butt"/>
<line x1="292" y1="151.4" x2="432" y2="151.4" stroke="#a6a6a6" stroke-width="0.5" stroke-linecap="butt"/>
<line x1="292" y1="171.4" x2="432" y2="171.4" stroke="#a6a6a6" stroke-width="0.5" stroke-linecap="butt"/>
<rect x="292" y="151.4" width="140" height="20" fill="none" stroke="#000" stroke-width="0.9"/>
<circle cx="302" cy="161.4" r="6" fill="none" stroke="#000" stroke-width="1" stroke-dasharray="1.6 2"/>
<line x1="309" y1="161.4" x2="347" y2="161.4" stroke="#000" stroke-width="1.6" stroke-linecap="butt"/>
<polygon points="354,161.4 347,164.8 347,158" fill="#000"/>
<circle cx="362" cy="161.4" r="6" fill="#000" stroke="#000" stroke-width="0.75"/>
<line x1="369" y1="161.4" x2="402" y2="161.4" stroke="#000" stroke-width="1.6" stroke-linecap="butt"/>
<circle cx="402" cy="161.4" r="7.2" fill="#fff"/>
<line x1="397" y1="156.4" x2="407" y2="166.4" stroke="#000" stroke-width="1.8" stroke-linecap="round"/>
<line x1="397" y1="166.4" x2="407" y2="156.4" stroke="#000" stroke-width="1.8" stroke-linecap="round"/>
<text x="362" y="181.4" font-weight="600" font-family="'Source Sans 3'" font-size="9" fill="#000" text-anchor="middle">stops here</text>
<text x="292" y="192.4" font-weight="600" font-family="'Source Sans 3'" font-size="9" fill="#333">Schematic - not to scale</text>
<line x1="0" y1="208.3" x2="504" y2="208.3" stroke="#8c8c8c" stroke-width="0.6" stroke-linecap="butt"/>
<rect x="0" y="212.3" width="13" height="13" fill="#000"/>
<text x="6.5" y="222.7" font-weight="700" font-family="'Source Sans 3'" font-size="9" fill="#fff" text-anchor="middle">C</text>
<text x="18" y="222.7" font-weight="700" font-family="'Source Sans 3'" font-size="9.5" fill="#000">What happens to the AP</text>
<rect x="0" y="231.3" width="504" height="15" fill="#000" stroke="#000" stroke-width="0.8" rx="2"/>
<text x="5" y="242.1" font-weight="700" font-family="'Source Sans 3'" font-size="9" fill="#fff">Situation</text>
<text x="257" y="242.1" font-weight="700" font-family="'Source Sans 3'" font-size="9" fill="#fff">AP outcome</text>
<text x="461" y="242.1" font-weight="700" font-family="'Source Sans 3'" font-size="9" fill="#fff">Source</text>
<rect x="0" y="246.3" width="504" height="16" fill="#fff" stroke="#000" stroke-width="0.6"/>
<text x="5" y="257.8" font-weight="400" font-family="'Source Sans 3'" font-size="9" fill="#000">Declared movement is illegal and the declaration is abandoned</text>
<text x="257" y="257.8" font-weight="400" font-family="'Source Sans 3'" font-size="9" fill="#000">No AP is spent</text>
<text x="461" y="257.8" font-weight="400" font-family="'Source Sans 3'" font-size="9" fill="#000">2.6.1</text>
<rect x="0" y="262.3" width="504" height="26.6" fill="#f0f0f0" stroke="#000" stroke-width="0.6"/>
<text x="5" y="273.8" font-weight="400" font-family="'Source Sans 3'" font-size="9" fill="#000">An action becomes illegal before it resolves</text>
<text x="257" y="273.8" font-weight="400" font-family="'Source Sans 3'" font-size="9" fill="#000">AP remains spent, unless abandoned during</text>
<text x="257" y="284.4" font-weight="400" font-family="'Source Sans 3'" font-size="9" fill="#000">Declared State verification</text>
<text x="461" y="273.8" font-weight="400" font-family="'Source Sans 3'" font-size="9" fill="#000">4.6</text>
<rect x="0" y="288.9" width="504" height="16" fill="#fff" stroke="#000" stroke-width="0.6"/>
<text x="5" y="300.4" font-weight="400" font-family="'Source Sans 3'" font-size="9" fill="#000">An effect interrupts movement and the remaining path is illegal</text>
<text x="257" y="300.4" font-weight="400" font-family="'Source Sans 3'" font-size="9" fill="#000">No AP is refunded</text>
<text x="461" y="300.4" font-weight="400" font-family="'Source Sans 3'" font-size="9" fill="#000">2.6.1</text>
<text x="0" y="315.9" font-weight="400" font-family="'Source Sans 3'" font-size="9" fill="#000">Combat attacks and combat manoeuvres are resolved in Section 5. Powers are resolved in Section 8.</text>
</svg>
