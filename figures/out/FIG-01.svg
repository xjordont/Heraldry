<svg xmlns="http://www.w3.org/2000/svg" width="504pt" height="246.2pt" viewBox="0 0 504 246.2">
<title>Round and phase sequence</title>
<desc>Show the four phases of a round in order, what each resolves, the loop to the next round, and the stated order exception.</desc>
<defs>
<pattern id="p-cover" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="5" height="5" fill="#fff"/><path d="M0 0.5H5M0.5 0V5" stroke="#444" stroke-width="0.7" fill="none"/></pattern>
<pattern id="p-diff" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="4" height="4" fill="#fff"/><circle cx="1" cy="1" r="0.75" fill="#222"/><circle cx="3" cy="3" r="0.75" fill="#222"/></pattern>
<pattern id="p-imp" width="2.4" height="2.4" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="2.4" height="2.4" fill="#fff"/><path d="M0.4 0V2.4" stroke="#000" stroke-width="0.95" fill="none"/></pattern>
<pattern id="p-mon" width="3.2" height="3.2" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)"><rect width="3.2" height="3.2" fill="#fff"/><path d="M0.5 0V3.2" stroke="#000" stroke-width="1" fill="none"/></pattern>
<pattern id="p-aoe" width="4" height="4" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)"><rect width="4" height="4" fill="#fff"/><path d="M0.5 0V4" stroke="#777" stroke-width="1.4" fill="none"/></pattern>
</defs>
<rect x="0" y="4" width="114" height="22" fill="#000" stroke="#000" stroke-width="0.9" rx="2.5"/>
<circle cx="12" cy="15" r="6.6" fill="#fff"/>
<text x="12" y="18.2" font-weight="700" font-family="'Source Sans 3'" font-size="9" fill="#000" text-anchor="middle">1</text>
<text x="22" y="19" font-weight="700" font-family="'Source Sans 3'" font-size="9.5" fill="#fff">Initiative Phase</text>
<text x="5" y="40" font-weight="700" font-family="'Source Sans 3'" font-size="9" fill="#000">•</text>
<text x="12" y="40" font-weight="400" font-family="'Source Sans 3'" font-size="9" fill="#000">Refresh AP for each</text>
<text x="12" y="50.6" font-weight="400" font-family="'Source Sans 3'" font-size="9" fill="#000">combatant that has an AP</text>
<text x="12" y="61.2" font-weight="400" font-family="'Source Sans 3'" font-size="9" fill="#000">maximum.</text>
<text x="5" y="75.3" font-weight="700" font-family="'Source Sans 3'" font-size="9" fill="#000">•</text>
<text x="12" y="75.3" font-weight="400" font-family="'Source Sans 3'" font-size="9" fill="#000">Each side rolls 1d20 + its</text>
<text x="12" y="85.9" font-weight="400" font-family="'Source Sans 3'" font-size="9" fill="#000">Party Leader's INT and</text>
<text x="12" y="96.5" font-weight="400" font-family="'Source Sans 3'" font-size="9" fill="#000">SPI. The higher total wins</text>
<text x="12" y="107.1" font-weight="400" font-family="'Source Sans 3'" font-size="9" fill="#000">Initiative.</text>
<text x="5" y="121.2" font-weight="700" font-family="'Source Sans 3'" font-size="9" fill="#000">•</text>
<text x="12" y="121.2" font-weight="400" font-family="'Source Sans 3'" font-size="9" fill="#000">The winner chooses</text>
<text x="12" y="131.8" font-weight="400" font-family="'Source Sans 3'" font-size="9" fill="#000">which side takes the first</text>
<text x="12" y="142.4" font-weight="400" font-family="'Source Sans 3'" font-size="9" fill="#000">Party Phase activation.</text>
<text x="5" y="156.5" font-weight="700" font-family="'Source Sans 3'" font-size="9" fill="#000">•</text>
<text x="12" y="156.5" font-weight="400" font-family="'Source Sans 3'" font-size="9" fill="#000">Resolve start-of-round</text>
<text x="12" y="167.1" font-weight="400" font-family="'Source Sans 3'" font-size="9" fill="#000">effects.</text>
<text x="110" y="19" font-weight="600" font-family="'Source Sans 3'" font-size="9" fill="#fff" text-anchor="end">3.2</text>
<rect x="130" y="4" width="114" height="22" fill="#000" stroke="#000" stroke-width="0.9" rx="2.5"/>
<circle cx="142" cy="15" r="6.6" fill="#fff"/>
<text x="142" y="18.2" font-weight="700" font-family="'Source Sans 3'" font-size="9" fill="#000" text-anchor="middle">2</text>
<text x="152" y="19" font-weight="700" font-family="'Source Sans 3'" font-size="9.5" fill="#fff">Party Phase</text>
<text x="135" y="40" font-weight="700" font-family="'Source Sans 3'" font-size="9" fill="#000">•</text>
<text x="142" y="40" font-weight="400" font-family="'Source Sans 3'" font-size="9" fill="#000">Sides alternate activating</text>
<text x="142" y="50.6" font-weight="400" font-family="'Source Sans 3'" font-size="9" fill="#000">one eligible allied</text>
<text x="142" y="61.2" font-weight="400" font-family="'Source Sans 3'" font-size="9" fill="#000">combatant at a time.</text>
<text x="135" y="75.3" font-weight="700" font-family="'Source Sans 3'" font-size="9" fill="#000">•</text>
<text x="142" y="75.3" font-weight="400" font-family="'Source Sans 3'" font-size="9" fill="#000">Each combatant may</text>
<text x="142" y="85.9" font-weight="400" font-family="'Source Sans 3'" font-size="9" fill="#000">activate once per round.</text>
<text x="135" y="100" font-weight="700" font-family="'Source Sans 3'" font-size="9" fill="#000">•</text>
<text x="142" y="100" font-weight="400" font-family="'Source Sans 3'" font-size="9" fill="#000">A side must Pass when it</text>
<text x="142" y="110.6" font-weight="400" font-family="'Source Sans 3'" font-size="9" fill="#000">has no eligible</text>
<text x="142" y="121.2" font-weight="400" font-family="'Source Sans 3'" font-size="9" fill="#000">combatant.</text>
<text x="135" y="135.3" font-weight="700" font-family="'Source Sans 3'" font-size="9" fill="#000">•</text>
<text x="142" y="135.3" font-weight="400" font-family="'Source Sans 3'" font-size="9" fill="#000">The phase ends when all</text>
<text x="142" y="145.9" font-weight="400" font-family="'Source Sans 3'" font-size="9" fill="#000">sides have Passed.</text>
<text x="240" y="19" font-weight="600" font-family="'Source Sans 3'" font-size="9" fill="#fff" text-anchor="end">3.3</text>
<rect x="260" y="4" width="114" height="22" fill="#000" stroke="#000" stroke-width="0.9" rx="2.5"/>
<circle cx="272" cy="15" r="6.6" fill="#fff"/>
<text x="272" y="18.2" font-weight="700" font-family="'Source Sans 3'" font-size="9" fill="#000" text-anchor="middle">3</text>
<text x="282" y="19" font-weight="700" font-family="'Source Sans 3'" font-size="9.5" fill="#fff">Monster Phase</text>
<text x="265" y="40" font-weight="700" font-family="'Source Sans 3'" font-size="9" fill="#000">•</text>
<text x="272" y="40" font-weight="400" font-family="'Source Sans 3'" font-size="9" fill="#000">Resolve Monster waking</text>
<text x="272" y="50.6" font-weight="400" font-family="'Source Sans 3'" font-size="9" fill="#000">rules (9.4).</text>
<text x="265" y="64.7" font-weight="700" font-family="'Source Sans 3'" font-size="9" fill="#000">•</text>
<text x="272" y="64.7" font-weight="400" font-family="'Source Sans 3'" font-size="9" fill="#000">Activate each Awake</text>
<text x="272" y="75.3" font-weight="400" font-family="'Source Sans 3'" font-size="9" fill="#000">Monster Group in</text>
<text x="272" y="85.9" font-weight="400" font-family="'Source Sans 3'" font-size="9" fill="#000">ascending group number.</text>
<text x="265" y="100" font-weight="700" font-family="'Source Sans 3'" font-size="9" fill="#000">•</text>
<text x="272" y="100" font-weight="400" font-family="'Source Sans 3'" font-size="9" fill="#000">Each Monster follows the</text>
<text x="272" y="110.6" font-weight="400" font-family="'Source Sans 3'" font-size="9" fill="#000">Standard Monster AI</text>
<text x="272" y="121.2" font-weight="400" font-family="'Source Sans 3'" font-size="9" fill="#000">Script (9.5); Monsters do</text>
<text x="272" y="131.8" font-weight="400" font-family="'Source Sans 3'" font-size="9" fill="#000">not use AP.</text>
<text x="370" y="19" font-weight="600" font-family="'Source Sans 3'" font-size="9" fill="#fff" text-anchor="end">3.4</text>
<rect x="390" y="4" width="114" height="22" fill="#000" stroke="#000" stroke-width="0.9" rx="2.5"/>
<circle cx="402" cy="15" r="6.6" fill="#fff"/>
<text x="402" y="18.2" font-weight="700" font-family="'Source Sans 3'" font-size="9" fill="#000" text-anchor="middle">4</text>
<text x="412" y="19" font-weight="700" font-family="'Source Sans 3'" font-size="9.5" fill="#fff">End of Round</text>
<text x="395" y="40" font-weight="700" font-family="'Source Sans 3'" font-size="9" fill="#000">•</text>
<text x="402" y="40" font-weight="400" font-family="'Source Sans 3'" font-size="9" fill="#000">Resolve end-of-round</text>
<text x="402" y="50.6" font-weight="400" font-family="'Source Sans 3'" font-size="9" fill="#000">effects.</text>
<text x="395" y="64.7" font-weight="700" font-family="'Source Sans 3'" font-size="9" fill="#000">•</text>
<text x="402" y="64.7" font-weight="400" font-family="'Source Sans 3'" font-size="9" fill="#000">End effects that last until</text>
<text x="402" y="75.3" font-weight="400" font-family="'Source Sans 3'" font-size="9" fill="#000">the end of the round.</text>
<text x="395" y="89.4" font-weight="700" font-family="'Source Sans 3'" font-size="9" fill="#000">•</text>
<text x="402" y="89.4" font-weight="400" font-family="'Source Sans 3'" font-size="9" fill="#000">Remove unspent AP.</text>
<text x="395" y="103.5" font-weight="700" font-family="'Source Sans 3'" font-size="9" fill="#000">•</text>
<text x="402" y="103.5" font-weight="400" font-family="'Source Sans 3'" font-size="9" fill="#000">Resolve scoring,</text>
<text x="402" y="114.1" font-weight="400" font-family="'Source Sans 3'" font-size="9" fill="#000">extraction, round limits</text>
<text x="402" y="124.7" font-weight="400" font-family="'Source Sans 3'" font-size="9" fill="#000">and victory conditions.</text>
<text x="500" y="19" font-weight="600" font-family="'Source Sans 3'" font-size="9" fill="#fff" text-anchor="end">3.5</text>
<rect x="0" y="29" width="114" height="149.2" fill="none" stroke="#000" stroke-width="0.9" rx="2.5"/>
<line x1="115.5" y1="15" x2="122.5" y2="15" stroke="#000" stroke-width="1.2" stroke-linecap="butt"/>
<polygon points="128.5,15 121.5,11.8 121.5,18.2" fill="#000"/>
<rect x="130" y="29" width="114" height="149.2" fill="none" stroke="#000" stroke-width="0.9" rx="2.5"/>
<line x1="245.5" y1="15" x2="252.5" y2="15" stroke="#000" stroke-width="1.2" stroke-linecap="butt"/>
<polygon points="258.5,15 251.5,11.8 251.5,18.2" fill="#000"/>
<rect x="260" y="29" width="114" height="149.2" fill="none" stroke="#000" stroke-width="0.9" rx="2.5"/>
<line x1="375.5" y1="15" x2="382.5" y2="15" stroke="#000" stroke-width="1.2" stroke-linecap="butt"/>
<polygon points="388.5,15 381.5,11.8 381.5,18.2" fill="#000"/>
<rect x="390" y="29" width="114" height="149.2" fill="none" stroke="#000" stroke-width="0.9" rx="2.5"/>
<line x1="447" y1="178.2" x2="447" y2="188.2" stroke="#000" stroke-width="1.2" stroke-linecap="butt"/>
<line x1="447" y1="188.2" x2="57" y2="188.2" stroke="#000" stroke-width="1.2" stroke-linecap="butt"/>
<line x1="57" y1="188.2" x2="57" y2="180.2" stroke="#000" stroke-width="1.2" stroke-linecap="butt"/>
<polygon points="57,178.2 53.6,185.2 60.4,185.2" fill="#000"/>
<rect x="117.91" y="183.48" width="268.18" height="10.89" fill="#fff"/>
<text x="119.71" y="191.4" font-weight="600" font-family="'Source Sans 3'" font-size="9" fill="#000">Next round begins after End of Round, unless the scenario has ended</text>
<rect x="0" y="202.2" width="504" height="40" fill="#f0f0f0" stroke="#000" stroke-width="0.7" rx="2.5"/>
<text x="6" y="214.2" font-weight="700" font-family="'Source Sans 3'" font-size="9" fill="#000">Exception (3.1, 3.4.3):</text>
<text x="96.72" y="214.2" font-weight="400" font-family="'Source Sans 3'" font-size="9" fill="#000">if a specific rule places the Monster Phase before the Party Phase, both phases</text>
<text x="6" y="225.2" font-weight="400" font-family="'Source Sans 3'" font-size="9" fill="#000">still resolve once each before End of Round. Order then: Initiative → Monster → Party → End of Round.</text>
<rect x="6" y="230.2" width="42.81" height="10.5" fill="#fff" stroke="#000" stroke-width="0.6" rx="2"/>
<text x="27.41" y="238.4" font-weight="600" font-family="'Source Sans 3'" font-size="9" fill="#000" text-anchor="middle">Initiative</text>
<text x="53.81" y="238.8" font-weight="600" font-family="'Source Sans 3'" font-size="9" fill="#000" text-anchor="middle">→</text>
<rect x="58.81" y="230.2" width="39.73" height="10.5" fill="#fff" stroke="#000" stroke-width="0.6" rx="2"/>
<text x="78.68" y="238.4" font-weight="600" font-family="'Source Sans 3'" font-size="9" fill="#000" text-anchor="middle">Monster</text>
<text x="103.55" y="238.8" font-weight="600" font-family="'Source Sans 3'" font-size="9" fill="#000" text-anchor="middle">→</text>
<rect x="108.55" y="230.2" width="28.94" height="10.5" fill="#fff" stroke="#000" stroke-width="0.6" rx="2"/>
<text x="123.02" y="238.4" font-weight="600" font-family="'Source Sans 3'" font-size="9" fill="#000" text-anchor="middle">Party</text>
<text x="142.49" y="238.8" font-weight="600" font-family="'Source Sans 3'" font-size="9" fill="#000" text-anchor="middle">→</text>
<rect x="147.49" y="230.2" width="59.74" height="10.5" fill="#fff" stroke="#000" stroke-width="0.6" rx="2"/>
<text x="177.36" y="238.4" font-weight="600" font-family="'Source Sans 3'" font-size="9" fill="#000" text-anchor="middle">End of Round</text>
</svg>
