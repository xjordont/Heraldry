<rect x="218.1" y="90.08" width="15.8" height="10.89" fill="#fff"/>
<text x="219.9" y="98" font-weight="700" font-family="'Source Sans 3'" font-size="9" fill="#000">1.5</text>
<rect x="240.1" y="68.08" width="15.8" height="10.89" fill="#fff"/>
<text x="241.9" y="76" font-weight="700" font-family="'Source Sans 3'" font-size="9" fill="#000">1.5</text>
<rect x="257.82" y="44.08" width="8.35" height="10.89" fill="#fff"/>
<text x="259.62" y="52" font-weight="700" font-family="'Source Sans 3'" font-size="9" fill="#000">1</text>
<text x="207" y="123" font-weight="400" font-family="'Source Sans 3'" font-size="9" fill="#000" text-anchor="middle">source square</text>
<text x="174" y="137" font-weight="700" font-family="'Source Sans 3'" font-size="9" fill="#000">1.5" + 1.5" + 1" = 4"</text>
<text x="174" y="149" font-weight="400" font-family="'Source Sans 3'" font-size="9" fill="#000">Orthogonal square = 1", diagonal square =</text>
<text x="174" y="159.6" font-weight="400" font-family="'Source Sans 3'" font-size="9" fill="#000">1.5". Count the shortest grid distance</text>
<text x="174" y="170.2" font-weight="400" font-family="'Source Sans 3'" font-size="9" fill="#000">without the source square. Obstacles do</text>
<text x="174" y="180.8" font-weight="400" font-family="'Source Sans 3'" font-size="9" fill="#000">not change it; check LOS, Cover and terrain</text>
<text x="174" y="191.4" font-weight="400" font-family="'Source Sans 3'" font-size="9" fill="#000">separately.</text>
<rect x="350" y="0" width="13" height="13" fill="#000"/>
<text x="356.5" y="10.4" font-weight="700" font-family="'Source Sans 3'" font-size="9" fill="#fff" text-anchor="middle">C</text>
<text x="368" y="10.4" font-weight="700" font-family="'Source Sans 3'" font-size="9.5" fill="#000">Grid Mode: footprints (2.6)</text>
<rect x="352" y="70" width="16" height="16" fill="#fff"/>
<line x1="352" y1="70" x2="352" y2="86" stroke="#a6a6a6" stroke-width="0.5" stroke-linecap="butt"/>
<line x1="368" y1="70" x2="368" y2="86" stroke="#a6a6a6" stroke-width="0.5" stroke-linecap="butt"/>
<line x1="352" y1="70" x2="368" y2="70" stroke="#a6a6a6" stroke-width="0.5" stroke-linecap="butt"/>
<line x1="352" y1="86" x2="368" y2="86" stroke="#a6a6a6" stroke-width="0.5" stroke-linecap="butt"/>
<rect x="352" y="70" width="16" height="16" fill="none" stroke="#000" stroke-width="0.9"/>
<circle cx="360" cy="78" r="5.5" fill="#000" stroke="#000" stroke-width="0.75"/>
<text x="360" y="97" font-weight="700" font-family="'Source Sans 3'" font-size="9" fill="#000" text-anchor="middle">S</text>
<text x="360" y="107" font-weight="400" font-family="'Source Sans 3'" font-size="9" fill="#000" text-anchor="middle">1×1</text>
<rect x="377" y="70" width="16" height="16" fill="#fff"/>
<line x1="377" y1="70" x2="377" y2="86" stroke="#a6a6a6" stroke-width="0.5" stroke-linecap="butt"/>
<line x1="393" y1="70" x2="393" y2="86" stroke="#a6a6a6" stroke-width="0.5" stroke-linecap="butt"/>
<line x1="377" y1="70" x2="393" y2="70" stroke="#a6a6a6" stroke-width="0.5" stroke-linecap="butt"/>
<line x1="377" y1="86" x2="393" y2="86" stroke="#a6a6a6" stroke-width="0.5" stroke-linecap="butt"/>
<rect x="377" y="70" width="16" height="16" fill="none" stroke="#000" stroke-width="0.9"/>
<circle cx="385" cy="78" r="5.5" fill="#000" stroke="#000" stroke-width="0.75"/>
<text x="385" y="97" font-weight="700" font-family="'Source Sans 3'" font-size="9" fill="#000" text-anchor="middle">M</text>
<text x="385" y="107" font-weight="400" font-family="'Source Sans 3'" font-size="9" fill="#000" text-anchor="middle">1×1</text>
<rect x="402" y="54" width="32" height="32" fill="#fff"/>
<line x1="402" y1="54" x2="402" y2="86" stroke="#a6a6a6" stroke-width="0.5" stroke-linecap="butt"/>
<line x1="418" y1="54" x2="418" y2="86" stroke="#a6a6a6" stroke-width="0.5" stroke-linecap="butt"/>
<line x1="434" y1="54" x2="434" y2="86" stroke="#a6a6a6" stroke-width="0.5" stroke-linecap="butt"/>
<line x1="402" y1="54" x2="434" y2="54" stroke="#a6a6a6" stroke-width="0.5" stroke-linecap="butt"/>
<line x1="402" y1="70" x2="434" y2="70" stroke="#a6a6a6" stroke-width="0.5" stroke-linecap="butt"/>
<line x1="402" y1="86" x2="434" y2="86" stroke="#a6a6a6" stroke-width="0.5" stroke-linecap="butt"/>
<rect x="402" y="54" width="32" height="32" fill="none" stroke="#000" stroke-width="0.9"/>
<rect x="404" y="56" width="28" height="28" fill="url(#p-mon)" stroke="#000" stroke-width="1.2"/>
<text x="418" y="97" font-weight="700" font-family="'Source Sans 3'" font-size="9" fill="#000" text-anchor="middle">L</text>
<text x="418" y="107" font-weight="400" font-family="'Source Sans 3'" font-size="9" fill="#000" text-anchor="middle">2×2</text>
<rect x="443" y="38" width="48" height="48" fill="#fff"/>
<line x1="443" y1="38" x2="443" y2="86" stroke="#a6a6a6" stroke-width="0.5" stroke-linecap="butt"/>
<line x1="459" y1="38" x2="459" y2="86" stroke="#a6a6a6" stroke-width="0.5" stroke-linecap="butt"/>
<line x1="475" y1="38" x2="475" y2="86" stroke="#a6a6a6" stroke-width="0.5" stroke-linecap="butt"/>
<line x1="491" y1="38" x2="491" y2="86" stroke="#a6a6a6" stroke-width="0.5" stroke-linecap="butt"/>
<line x1="443" y1="38" x2="491" y2="38" stroke="#a6a6a6" stroke-width="0.5" stroke-linecap="butt"/>
<line x1="443" y1="54" x2="491" y2="54" stroke="#a6a6a6" stroke-width="0.5" stroke-linecap="butt"/>
<line x1="443" y1="70" x2="491" y2="70" stroke="#a6a6a6" stroke-width="0.5" stroke-linecap="butt"/>
<line x1="443" y1="86" x2="491" y2="86" stroke="#a6a6a6" stroke-width="0.5" stroke-linecap="butt"/>
<rect x="443" y="38" width="48" height="48" fill="none" stroke="#000" stroke-width="0.9"/>
<rect x="445" y="40" width="44" height="44" fill="url(#p-mon)" stroke="#000" stroke-width="1.2"/>
<text x="467" y="97" font-weight="700" font-family="'Source Sans 3'" font-size="9" fill="#000" text-anchor="middle">H</text>
<text x="467" y="107" font-weight="400" font-family="'Source Sans 3'" font-size="9" fill="#000" text-anchor="middle">3×3</text>
<text x="350" y="122" font-weight="400" font-family="'Source Sans 3'" font-size="9" fill="#000">A combatant occupies the squares of</text>
<text x="350" y="132.6" font-weight="400" font-family="'Source Sans 3'" font-size="9" fill="#000">their Sz footprint (S and M 1×1, L 2×2, H</text>
<text x="350" y="143.2" font-weight="400" font-family="'Source Sans 3'" font-size="9" fill="#000">3×3). Their whole footprint must fit in</text>
<text x="350" y="153.8" font-weight="400" font-family="'Source Sans 3'" font-size="9" fill="#000">every legal final position.</text>
<line x1="0" y1="212" x2="504" y2="212" stroke="#8c8c8c" stroke-width="0.6" stroke-linecap="butt"/>
<rect x="0" y="218" width="13" height="13" fill="#000"/>
<text x="6.5" y="228.4" font-weight="700" font-family="'Source Sans 3'" font-size="9" fill="#fff" text-anchor="middle">D</text>
<text x="18" y="228.4" font-weight="700" font-family="'Source Sans 3'" font-size="9.5" fill="#000">Declared movement and positional state (2.6.1)</text>
<rect x="0" y="238" width="115.5" height="108.8" fill="#fff" stroke="#000" stroke-width="0.9" rx="2.5"/>
<circle cx="11" cy="249" r="6.6" fill="#000" stroke="#000" stroke-width="0.5"/>
<text x="11" y="252.3" font-weight="700" font-family="'Source Sans 3'" font-size="9" fill="#fff" text-anchor="middle">1</text>
<text x="22" y="252" font-weight="700" font-family="'Source Sans 3'" font-size="9.5" fill="#000">Declare</text>
<text x="5" y="264" font-weight="400" font-family="'Source Sans 3'" font-size="9" fill="#000">Before voluntary or forced</text>
<text x="5" y="274.6" font-weight="400" font-family="'Source Sans 3'" font-size="9" fill="#000">movement, declare the</text>
<text x="5" y="285.2" font-weight="400" font-family="'Source Sans 3'" font-size="9" fill="#000">intended path and final</text>
<text x="5" y="295.8" font-weight="400" font-family="'Source Sans 3'" font-size="9" fill="#000">position (for placement, the</text>
<text x="5" y="306.4" font-weight="400" font-family="'Source Sans 3'" font-size="9" fill="#000">final position).</text>
<line x1="117" y1="249" x2="122" y2="249" stroke="#000" stroke-width="1.2" stroke-linecap="butt"/>
<polygon points="128,249 121,245.8 121,252.2" fill="#000"/>
<rect x="129.5" y="238" width="115.5" height="108.8" fill="#fff" stroke="#000" stroke-width="0.9" rx="2.5"/>
<circle cx="140.5" cy="249" r="6.6" fill="#000" stroke="#000" stroke-width="0.5"/>
<text x="140.5" y="252.3" font-weight="700" font-family="'Source Sans 3'" font-size="9" fill="#fff" text-anchor="middle">2</text>
<text x="151.5" y="252" font-weight="700" font-family="'Source Sans 3'" font-size="9.5" fill="#000">Verify</text>
<text x="134.5" y="264" font-weight="400" font-family="'Source Sans 3'" font-size="9" fill="#000">An opposing player may</text>
<text x="134.5" y="274.6" font-weight="400" font-family="'Source Sans 3'" font-size="9" fill="#000">measure and verify it. If</text>
<text x="134.5" y="285.2" font-weight="400" font-family="'Source Sans 3'" font-size="9" fill="#000">illegal, amend it or choose</text>
<text x="134.5" y="295.8" font-weight="400" font-family="'Source Sans 3'" font-size="9" fill="#000">another action; an</text>
<text x="134.5" y="306.4" font-weight="400" font-family="'Source Sans 3'" font-size="9" fill="#000">abandoned declaration</text>
<text x="134.5" y="317" font-weight="400" font-family="'Source Sans 3'" font-size="9" fill="#000">costs no AP.</text>
<line x1="246.5" y1="249" x2="251.5" y2="249" stroke="#000" stroke-width="1.2" stroke-linecap="butt"/>
<polygon points="257.5,249 250.5,245.8 250.5,252.2" fill="#000"/>
<rect x="259" y="238" width="115.5" height="108.8" fill="#fff" stroke="#000" stroke-width="0.9" rx="2.5"/>
<circle cx="270" cy="249" r="6.6" fill="#000" stroke="#000" stroke-width="0.5"/>
<text x="270" y="252.3" font-weight="700" font-family="'Source Sans 3'" font-size="9" fill="#fff" text-anchor="middle">3</text>
<text x="281" y="252" font-weight="700" font-family="'Source Sans 3'" font-size="9.5" fill="#000">Move</text>
<text x="264" y="264" font-weight="400" font-family="'Source Sans 3'" font-size="9" fill="#000">Once movement begins, or</text>
<text x="264" y="274.6" font-weight="400" font-family="'Source Sans 3'" font-size="9" fill="#000">a Reaction is declared</text>
<text x="264" y="285.2" font-weight="400" font-family="'Source Sans 3'" font-size="9" fill="#000">against it, the declaration</text>
<text x="264" y="295.8" font-weight="400" font-family="'Source Sans 3'" font-size="9" fill="#000">cannot be amended or</text>
<text x="264" y="306.4" font-weight="400" font-family="'Source Sans 3'" font-size="9" fill="#000">abandoned. A triggered</text>
<text x="264" y="317" font-weight="400" font-family="'Source Sans 3'" font-size="9" fill="#000">Reaction resolves at the</text>
<text x="264" y="327.6" font-weight="400" font-family="'Source Sans 3'" font-size="9" fill="#000">first point on the path</text>
<text x="264" y="338.2" font-weight="400" font-family="'Source Sans 3'" font-size="9" fill="#000">where its trigger occurs.</text>
<line x1="376" y1="249" x2="381" y2="249" stroke="#000" stroke-width="1.2" stroke-linecap="butt"/>
<polygon points="387,249 380,245.8 380,252.2" fill="#000"/>
<rect x="388.5" y="238" width="115.5" height="108.8" fill="#fff" stroke="#000" stroke-width="0.9" rx="2.5"/>
<circle cx="399.5" cy="249" r="6.6" fill="#000" stroke="#000" stroke-width="0.5"/>
<text x="399.5" y="252.3" font-weight="700" font-family="'Source Sans 3'" font-size="9" fill="#fff" text-anchor="middle">4</text>
<text x="410.5" y="252" font-weight="700" font-family="'Source Sans 3'" font-size="9.5" fill="#000">Declared State</text>
<text x="393.5" y="264" font-weight="400" font-family="'Source Sans 3'" font-size="9" fill="#000">The actual path and final</text>
<text x="393.5" y="274.6" font-weight="400" font-family="'Source Sans 3'" font-size="9" fill="#000">position become the</text>
<text x="393.5" y="285.2" font-weight="400" font-family="'Source Sans 3'" font-size="9" fill="#000">Declared State until the</text>
<text x="393.5" y="295.8" font-weight="400" font-family="'Source Sans 3'" font-size="9" fill="#000">combatant moves or is</text>
<text x="393.5" y="306.4" font-weight="400" font-family="'Source Sans 3'" font-size="9" fill="#000">moved. If a miniature is</text>
<text x="393.5" y="317" font-weight="400" font-family="'Source Sans 3'" font-size="9" fill="#000">moved accidentally, restore</text>
<text x="393.5" y="327.6" font-weight="400" font-family="'Source Sans 3'" font-size="9" fill="#000">it.</text>
</svg>
