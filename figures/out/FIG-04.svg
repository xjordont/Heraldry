<svg xmlns="http://www.w3.org/2000/svg" width="504pt" height="350.8pt" viewBox="0 0 504 350.8">
<title>Measurement, footprints and declared movement</title>
<desc>Contrast Tabletop closest-point measurement with Grid orthogonal/diagonal counting, show footprints by Sz, and show the declared-movement and Declared State procedure.</desc>
<defs>
<pattern id="p-cover" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="5" height="5" fill="#fff"/><path d="M0 0.5H5M0.5 0V5" stroke="#444" stroke-width="0.7" fill="none"/></pattern>
<pattern id="p-diff" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="4" height="4" fill="#fff"/><circle cx="1" cy="1" r="0.75" fill="#222"/><circle cx="3" cy="3" r="0.75" fill="#222"/></pattern>
<pattern id="p-imp" width="2.4" height="2.4" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="2.4" height="2.4" fill="#fff"/><path d="M0.4 0V2.4" stroke="#000" stroke-width="0.95" fill="none"/></pattern>
<pattern id="p-mon" width="3.2" height="3.2" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)"><rect width="3.2" height="3.2" fill="#fff"/><path d="M0.5 0V3.2" stroke="#000" stroke-width="1" fill="none"/></pattern>
<pattern id="p-aoe" width="4" height="4" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)"><rect width="4" height="4" fill="#fff"/><path d="M0.5 0V4" stroke="#777" stroke-width="1.4" fill="none"/></pattern>
</defs>
<rect x="0" y="0" width="13" height="13" fill="#000"/>
<text x="6.5" y="10.4" font-weight="700" font-family="'Source Sans 3'" font-size="9" fill="#fff" text-anchor="middle">A</text>
<text x="18" y="10.4" font-weight="700" font-family="'Source Sans 3'" font-size="9.5" fill="#000">Tabletop Mode (2.6)</text>
<rect x="4" y="36" width="16" height="16" fill="#fff" stroke="#000" stroke-width="0.9"/>
<circle cx="12" cy="44" r="5.5" fill="#000" stroke="#000" stroke-width="0.75"/>
<rect x="88" y="60" width="32" height="32" fill="url(#p-mon)" stroke="#000" stroke-width="1.2"/>
<line x1="20" y1="52" x2="88" y2="60" stroke="#000" stroke-width="1.2" stroke-linecap="butt"/>
<circle cx="20" cy="52" r="2.2" fill="#000"/>
<circle cx="88" cy="60" r="2.2" fill="#000"/>
<rect x="31.72" y="62.08" width="36.57" height="10.89" fill="#fff"/>
<text x="33.52" y="70" font-weight="600" font-family="'Source Sans 3'" font-size="9" fill="#000">distance</text>
<text x="4" y="100" font-weight="400" font-family="'Source Sans 3'" font-size="9" fill="#000">Measured between the closest points</text>
<text x="4" y="111" font-weight="400" font-family="'Source Sans 3'" font-size="9" fill="#000">of the source and target spaces.</text>
<text x="0" y="130" font-weight="400" font-family="'Source Sans 3'" font-size="9" fill="#000">Rules footprints are used, not the</text>
<text x="0" y="140.6" font-weight="400" font-family="'Source Sans 3'" font-size="9" fill="#000">miniature's base. Rules that measure</text>
<text x="0" y="151.2" font-weight="400" font-family="'Source Sans 3'" font-size="9" fill="#000">from a point use that point.</text>
<text x="0" y="167.8" font-weight="600" font-family="'Source Sans 3'" font-size="9" fill="#333">Schematic — not to scale</text>
<rect x="170" y="0" width="13" height="13" fill="#000"/>
<text x="176.5" y="10.4" font-weight="700" font-family="'Source Sans 3'" font-size="9" fill="#fff" text-anchor="middle">B</text>
<text x="188" y="10.4" font-weight="700" font-family="'Source Sans 3'" font-size="9.5" fill="#000">Grid Mode: range / distance (2.6)</text>
<rect x="174" y="24" width="154" height="88" fill="#fff"/>
