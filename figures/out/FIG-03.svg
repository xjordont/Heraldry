<svg xmlns="http://www.w3.org/2000/svg" width="504pt" height="337.4pt" viewBox="0 0 504 337.4">
<title>Attack sequence, Mitigation Order and damage/defence examples</title>
<desc>Show the five attack steps (with Total Miss branch) and apply the Mitigation Order to the source's own damage examples.</desc>
<defs>
<pattern id="p-cover" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="5" height="5" fill="#fff"/><path d="M0 0.5H5M0.5 0V5" stroke="#444" stroke-width="0.7" fill="none"/></pattern>
<pattern id="p-diff" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="4" height="4" fill="#fff"/><circle cx="1" cy="1" r="0.75" fill="#222"/><circle cx="3" cy="3" r="0.75" fill="#222"/></pattern>
<pattern id="p-imp" width="2.4" height="2.4" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="2.4" height="2.4" fill="#fff"/><path d="M0.4 0V2.4" stroke="#000" stroke-width="0.95" fill="none"/></pattern>
<pattern id="p-mon" width="3.2" height="3.2" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)"><rect width="3.2" height="3.2" fill="#fff"/><path d="M0.5 0V3.2" stroke="#000" stroke-width="1" fill="none"/></pattern>
<pattern id="p-aoe" width="4" height="4" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)"><rect width="4" height="4" fill="#fff"/><path d="M0.5 0V4" stroke="#777" stroke-width="1.4" fill="none"/></pattern>
</defs>
<rect x="0" y="0" width="13" height="13" fill="#000"/>
<text x="6.5" y="10.4" font-weight="700" font-family="'Source Sans 3'" font-size="9" fill="#fff" text-anchor="middle">A</text>
<text x="18" y="10.4" font-weight="700" font-family="'Source Sans 3'" font-size="9.5" fill="#000">The attack sequence (5.2)</text>
<rect x="0" y="21" width="236" height="37.8" fill="#fff" stroke="#000" stroke-width="0.9" rx="2.5"/>
<circle cx="13" cy="33" r="6.6" fill="#000" stroke="#000" stroke-width="0.5"/>
<text x="13" y="36.3" font-weight="700" font-family="'Source Sans 3'" font-size="9" fill="#fff" text-anchor="middle">1</text>
<text x="24" y="31" font-family="'Source Sans 3'" font-size="9" fill="#000"><tspan font-weight="700">Declare and verify.</tspan><tspan font-weight="400"> Attacker, attack, target, primary</tspan></text>
<text x="24" y="41.6" font-weight="400" font-family="'Source Sans 3'" font-size="9" fill="#000">damage type and any additional types. Confirm LOS,</text>
<text x="24" y="52.2" font-weight="400" font-family="'Source Sans 3'" font-size="9" fill="#000">visibility, range, Cover and other targeting rules.</text>
<line x1="13" y1="58.8" x2="13" y2="64.8" stroke="#000" stroke-width="1.2" stroke-linecap="butt"/>
<polygon points="13,70.8 9.8,63.8 16.2,63.8" fill="#000"/>
<rect x="0" y="70.8" width="236" height="59" fill="#fff" stroke="#000" stroke-width="0.9" rx="2.5"/>
<circle cx="13" cy="82.8" r="6.6" fill="#000" stroke="#000" stroke-width="0.5"/>
<text x="13" y="86.1" font-weight="700" font-family="'Source Sans 3'" font-size="9" fill="#fff" text-anchor="middle">2</text>
<text x="24" y="80.8" font-family="'Source Sans 3'" font-size="9" fill="#000"><tspan font-weight="700">Declare Reactions.</tspan><tspan font-weight="400"> Resolve redirection, verify</tspan></text>
<text x="24" y="91.4" font-weight="400" font-family="'Source Sans 3'" font-size="9" fill="#000">legality, then declare all Reactions before any damage</text>
<text x="24" y="102" font-weight="400" font-family="'Source Sans 3'" font-size="9" fill="#000">dice. Pay or commit costs under 4.5, including</text>
<text x="24" y="112.6" font-weight="400" font-family="'Source Sans 3'" font-size="9" fill="#000">result-dependent Reactions. Resolve effects at their</text>
<text x="24" y="123.2" font-weight="400" font-family="'Source Sans 3'" font-size="9" fill="#000">stated timings.</text>
<line x1="13" y1="129.8" x2="13" y2="135.8" stroke="#000" stroke-width="1.2" stroke-linecap="butt"/>
<polygon points="13,141.8 9.8,134.8 16.2,134.8" fill="#000"/>
<rect x="0" y="141.8" width="236" height="48.4" fill="#fff" stroke="#000" stroke-width="0.9" rx="2.5"/>
<circle cx="13" cy="153.8" r="6.6" fill="#000" stroke="#000" stroke-width="0.5"/>
<text x="13" y="157.1" font-weight="700" font-family="'Source Sans 3'" font-size="9" fill="#fff" text-anchor="middle">3</text>
<text x="24" y="151.8" font-family="'Source Sans 3'" font-size="9" fill="#000"><tspan font-weight="700">Roll and build damage.</tspan><tspan font-weight="400"> Base dice with</tspan></text>
<text x="24" y="162.4" font-weight="400" font-family="'Source Sans 3'" font-size="9" fill="#000">Advantage/Disadvantage, Total Miss and Critical Hit</text>
<text x="24" y="173" font-weight="400" font-family="'Source Sans 3'" font-size="9" fill="#000">checks, exploding dice, modifiers by damage type.</text>
<text x="24" y="183.6" font-weight="400" font-family="'Source Sans 3'" font-size="9" fill="#000">Any Luck reroll (2.10) happens before consequences.</text>
<line x1="13" y1="190.2" x2="13" y2="196.2" stroke="#000" stroke-width="1.2" stroke-linecap="butt"/>
<polygon points="13,202.2 9.8,195.2 16.2,195.2" fill="#000"/>
<rect x="0" y="202.2" width="236" height="48.4" fill="#fff" stroke="#000" stroke-width="0.9" rx="2.5"/>
<circle cx="13" cy="214.2" r="6.6" fill="#000" stroke="#000" stroke-width="0.5"/>
<text x="13" y="217.5" font-weight="700" font-family="'Source Sans 3'" font-size="9" fill="#fff" text-anchor="middle">4</text>
<text x="24" y="212.2" font-family="'Source Sans 3'" font-size="9" fill="#000"><tspan font-weight="700">Defend and mitigate.</tspan><tspan font-weight="400"> Resolve the predeclared</tspan></text>
<text x="24" y="222.8" font-weight="400" font-family="'Source Sans 3'" font-size="9" fill="#000">defensive Reaction, then apply the Mitigation Order</text>
<text x="24" y="233.4" font-weight="400" font-family="'Source Sans 3'" font-size="9" fill="#000">(5.1.1). No new Reaction may be declared after the</text>
<text x="24" y="244" font-weight="400" font-family="'Source Sans 3'" font-size="9" fill="#000">roll.</text>
<line x1="13" y1="250.6" x2="13" y2="256.6" stroke="#000" stroke-width="1.2" stroke-linecap="butt"/>
<polygon points="13,262.6 9.8,255.6 16.2,255.6" fill="#000"/>
<rect x="0" y="262.6" width="236" height="37.8" fill="#fff" stroke="#000" stroke-width="0.9" rx="2.5"/>
<circle cx="13" cy="274.6" r="6.6" fill="#000" stroke="#000" stroke-width="0.5"/>
<text x="13" y="277.9" font-weight="700" font-family="'Source Sans 3'" font-size="9" fill="#fff" text-anchor="middle">5</text>
<text x="24" y="272.6" font-family="'Source Sans 3'" font-size="9" fill="#000"><tspan font-weight="700">Apply and finish.</tspan><tspan font-weight="400"> Reduce HP, then resolve remaining</tspan></text>
<text x="24" y="283.2" font-weight="400" font-family="'Source Sans 3'" font-size="9" fill="#000">Critical Hit effects, damage-triggered effects and</text>
<text x="24" y="293.8" font-weight="400" font-family="'Source Sans 3'" font-size="9" fill="#000">conditions.</text>
<rect x="0" y="305.4" width="236" height="28" fill="#f0f0f0" stroke="#000" stroke-width="0.7" rx="2.5"/>
<text x="5" y="316.4" font-family="'Source Sans 3'" font-size="9" fill="#000"><tspan font-weight="700">Total Miss</tspan><tspan font-weight="400"> (5.3): if every retained base damage die shows a</tspan></text>
<text x="5" y="327" font-weight="400" font-family="'Source Sans 3'" font-size="9" fill="#000">natural 1, the attack deals no damage and ends at step 3.</text>
<rect x="252" y="0" width="13" height="13" fill="#000"/>
<text x="258.5" y="10.4" font-weight="700" font-family="'Source Sans 3'" font-size="9" fill="#fff" text-anchor="middle">B</text>
<text x="270" y="10.4" font-weight="700" font-family="'Source Sans 3'" font-size="9.5" fill="#000">Mitigation Order and worked example (5.1.1)</text>
<circle cx="258.6" cy="26" r="6.6" fill="#000" stroke="#000" stroke-width="0.5"/>
<text x="258.6" y="29.3" font-weight="700" font-family="'Source Sans 3'" font-size="9" fill="#fff" text-anchor="middle">1</text>
<text x="271.2" y="27" font-weight="400" font-family="'Source Sans 3'" font-size="9" fill="#000">Keep damage types separate. Apply AV first, then other flat</text>
<text x="271.2" y="37.5" font-weight="400" font-family="'Source Sans 3'" font-size="9" fill="#000">mitigation in the controller's chosen order. Apply each value</text>
<text x="271.2" y="48" font-weight="400" font-family="'Source Sans 3'" font-size="9" fill="#000">once; reduce several types in the source's listed order. Reduce</text>
<text x="271.2" y="58.5" font-weight="400" font-family="'Source Sans 3'" font-size="9" fill="#000">each type to a minimum of 0. AV applies only to blunt,</text>
<text x="271.2" y="69" font-weight="400" font-family="'Source Sans 3'" font-size="9" fill="#000">piercing and slashing.</text>
<circle cx="258.6" cy="82.5" r="6.6" fill="#000" stroke="#000" stroke-width="0.5"/>
<text x="258.6" y="85.8" font-weight="700" font-family="'Source Sans 3'" font-size="9" fill="#fff" text-anchor="middle">2</text>
<text x="271.2" y="83.5" font-weight="400" font-family="'Source Sans 3'" font-size="9" fill="#000">Apply Immune, Resistant and Vulnerable to each remaining</text>
<text x="271.2" y="94" font-weight="400" font-family="'Source Sans 3'" font-size="9" fill="#000">type.</text>
<circle cx="258.6" cy="107.5" r="6.6" fill="#000" stroke="#000" stroke-width="0.5"/>
<text x="258.6" y="110.8" font-weight="700" font-family="'Source Sans 3'" font-size="9" fill="#fff" text-anchor="middle">3</text>
<text x="271.2" y="108.5" font-weight="400" font-family="'Source Sans 3'" font-size="9" fill="#000">Total the remaining damage and apply it.</text>
<text x="252" y="129.7" font-weight="700" font-family="'Source Sans 3'" font-size="9" fill="#000">Example: Fighter pays 1 AP for Block before damage</text>
<rect x="252" y="135.7" width="252" height="15" fill="#000" stroke="#000" stroke-width="0.8"/>
<text x="257" y="146.5" font-weight="700" font-family="'Source Sans 3'" font-size="9" fill="#fff">Damage type</text>
<text x="335" y="146.5" font-weight="700" font-family="'Source Sans 3'" font-size="9" fill="#fff">Rolled</text>
<text x="385" y="146.5" font-weight="700" font-family="'Source Sans 3'" font-size="9" fill="#fff">AV</text>
<text x="445" y="146.5" font-weight="700" font-family="'Source Sans 3'" font-size="9" fill="#fff">Suffered</text>
<rect x="252" y="150.7" width="252" height="16" fill="#fff" stroke="#000" stroke-width="0.7"/>
<text x="257" y="162.2" font-weight="400" font-family="'Source Sans 3'" font-size="9" fill="#000">slashing</text>
<text x="335" y="162.2" font-weight="400" font-family="'Source Sans 3'" font-size="9" fill="#000">6</text>
<text x="385" y="162.2" font-weight="400" font-family="'Source Sans 3'" font-size="9" fill="#000">- 5</text>
<text x="445" y="162.2" font-weight="400" font-family="'Source Sans 3'" font-size="9" fill="#000">1</text>
<rect x="252" y="166.7" width="252" height="16" fill="#fff" stroke="#000" stroke-width="0.7"/>
<text x="257" y="178.2" font-weight="400" font-family="'Source Sans 3'" font-size="9" fill="#000">fire (ignores AV)</text>
<text x="335" y="178.2" font-weight="400" font-family="'Source Sans 3'" font-size="9" fill="#000">4</text>
<text x="385" y="178.2" font-weight="400" font-family="'Source Sans 3'" font-size="9" fill="#000">None</text>
<text x="445" y="178.2" font-weight="400" font-family="'Source Sans 3'" font-size="9" fill="#000">4</text>
<rect x="252" y="182.7" width="252" height="16" fill="#f0f0f0" stroke="#000" stroke-width="0.7"/>
<text x="257" y="194.2" font-weight="700" font-family="'Source Sans 3'" font-size="9" fill="#000">Total damage</text>
<text x="445" y="194.2" font-weight="700" font-family="'Source Sans 3'" font-size="9" fill="#000">1 + 4 = 5</text>
<text x="252" y="212.7" font-weight="400" font-family="'Source Sans 3'" font-size="9" fill="#000">The Fighter's 5 AV (armour AD plus shield AD) reduces the 6</text>
<text x="252" y="223.3" font-weight="400" font-family="'Source Sans 3'" font-size="9" fill="#000">slashing damage to 1. Fire damage ignores AV.</text>
<text x="252" y="245.9" font-weight="700" font-family="'Source Sans 3'" font-size="9" fill="#000">Second example: Hero with d6 AD Chest armour (5.4.3)</text>
<rect x="252" y="251.9" width="252" height="15" fill="#000" stroke="#000" stroke-width="0.8"/>
<text x="257" y="262.7" font-weight="700" font-family="'Source Sans 3'" font-size="9" fill="#fff">Case</text>
<text x="383" y="262.7" font-weight="700" font-family="'Source Sans 3'" font-size="9" fill="#fff">AV</text>
<text x="447" y="262.7" font-weight="700" font-family="'Source Sans 3'" font-size="9" fill="#fff">Suffered</text>
<rect x="252" y="266.9" width="252" height="16" fill="#fff" stroke="#000" stroke-width="0.7"/>
<text x="256" y="278.4" font-weight="400" font-family="'Source Sans 3'" font-size="9" fill="#000">9 slashing, no Block (d6 = 3)</text>
<text x="383" y="278.4" font-weight="400" font-family="'Source Sans 3'" font-size="9" fill="#000">3</text>
<text x="447" y="278.4" font-weight="400" font-family="'Source Sans 3'" font-size="9" fill="#000">9 - 3 = 6</text>
<rect x="252" y="282.9" width="252" height="16" fill="#fff" stroke="#000" stroke-width="0.7"/>
<text x="256" y="294.4" font-weight="400" font-family="'Source Sans 3'" font-size="9" fill="#000">same attack, Block (+2 AV)</text>
<text x="383" y="294.4" font-weight="400" font-family="'Source Sans 3'" font-size="9" fill="#000">3 + 2 = 5</text>
<text x="447" y="294.4" font-weight="400" font-family="'Source Sans 3'" font-size="9" fill="#000">9 - 5 = 4</text>
</svg>
