<svg xmlns="http://www.w3.org/2000/svg" width="504pt" height="344.8pt" viewBox="0 0 504 344.8">
<title>Reactions: declaration window, limits and roll-dependent commitments</title>
<desc>Show when Reactions to one source are declared, who may react and at what cost, the limit of 1 modifying Reaction per affected combatant (with the source Ogre/Cleric example), and how roll-dependent Reactions commit and then spend or release costs (with the source Conviction example).</desc>
<defs>
<pattern id="p-cover" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="5" height="5" fill="#fff"/><path d="M0 0.5H5M0.5 0V5" stroke="#444" stroke-width="0.7" fill="none"/></pattern>
<pattern id="p-diff" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="4" height="4" fill="#fff"/><circle cx="1" cy="1" r="0.75" fill="#222"/><circle cx="3" cy="3" r="0.75" fill="#222"/></pattern>
<pattern id="p-imp" width="2.4" height="2.4" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="2.4" height="2.4" fill="#fff"/><path d="M0.4 0V2.4" stroke="#000" stroke-width="0.95" fill="none"/></pattern>
<pattern id="p-mon" width="3.2" height="3.2" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)"><rect width="3.2" height="3.2" fill="#fff"/><path d="M0.5 0V3.2" stroke="#000" stroke-width="1" fill="none"/></pattern>
<pattern id="p-aoe" width="4" height="4" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)"><rect width="4" height="4" fill="#fff"/><path d="M0.5 0V4" stroke="#777" stroke-width="1.4" fill="none"/></pattern>
</defs>
<rect x="0" y="0" width="13" height="13" fill="#000"/>
<text x="6.5" y="10.4" font-weight="700" font-family="'Source Sans 3'" font-size="9" fill="#fff" text-anchor="middle">A</text>
<text x="18" y="10.4" font-weight="700" font-family="'Source Sans 3'" font-size="9.5" fill="#000">The declaration window for one attack or damaging effect (4.5)</text>
<rect x="0" y="31" width="140" height="78" fill="#fff" stroke="#000" stroke-width="0.9" rx="2.5"/>
<circle cx="11" cy="42" r="6.6" fill="#000" stroke="#000" stroke-width="0.5"/>
<text x="11" y="45.3" font-weight="700" font-family="'Source Sans 3'" font-size="9" fill="#fff" text-anchor="middle">1</text>
<text x="22" y="45" font-weight="700" font-family="'Source Sans 3'" font-size="9.5" fill="#000">Identify</text>
<text x="5" y="57" font-weight="400" font-family="'Source Sans 3'" font-size="9" fill="#000">If the source has no declaration</text>
<text x="5" y="67.6" font-weight="400" font-family="'Source Sans 3'" font-size="9" fill="#000">step, pause before its first damage</text>
<text x="5" y="78.2" font-weight="400" font-family="'Source Sans 3'" font-size="9" fill="#000">die, or before applying fixed</text>
<text x="5" y="88.8" font-weight="400" font-family="'Source Sans 3'" font-size="9" fill="#000">damage or HP loss, and identify</text>
<text x="5" y="99.4" font-weight="400" font-family="'Source Sans 3'" font-size="9" fill="#000">who would be affected.</text>
<line x1="141.5" y1="42" x2="137.83" y2="42" stroke="#000" stroke-width="1.2" stroke-linecap="butt"/>
<polygon points="143.83,42 136.83,38.8 136.83,45.2" fill="#000"/>
<rect x="145.33" y="31" width="72" height="78" fill="#fff" stroke="#000" stroke-width="0.9" rx="2.5"/>
<circle cx="156.33" cy="42" r="6.6" fill="#000" stroke="#000" stroke-width="0.5"/>
<text x="156.33" y="45.3" font-weight="700" font-family="'Source Sans 3'" font-size="9" fill="#fff" text-anchor="middle">2</text>
<text x="167.33" y="45" font-weight="700" font-family="'Source Sans 3'" font-size="9.5" fill="#000">Redirect</text>
<text x="150.33" y="57" font-weight="400" font-family="'Source Sans 3'" font-size="9" fill="#000">Resolve target</text>
<text x="150.33" y="67.6" font-weight="400" font-family="'Source Sans 3'" font-size="9" fill="#000">redirection first.</text>
<line x1="218.83" y1="42" x2="215.17" y2="42" stroke="#000" stroke-width="1.2" stroke-linecap="butt"/>
<polygon points="221.17,42 214.17,38.8 214.17,45.2" fill="#000"/>
<rect x="222.67" y="31" width="122" height="78" fill="#fff" stroke="#000" stroke-width="0.9" rx="2.5"/>
<circle cx="233.67" cy="42" r="6.6" fill="#000" stroke="#000" stroke-width="0.5"/>
<text x="233.67" y="45.3" font-weight="700" font-family="'Source Sans 3'" font-size="9" fill="#fff" text-anchor="middle">3</text>
<text x="244.67" y="45" font-weight="700" font-family="'Source Sans 3'" font-size="9.5" fill="#000">Declare</text>
<text x="227.67" y="57" font-weight="400" font-family="'Source Sans 3'" font-size="9" fill="#000">Confirm the final targets,</text>
<text x="227.67" y="67.6" font-weight="400" font-family="'Source Sans 3'" font-size="9" fill="#000">then declare all remaining</text>
<text x="227.67" y="78.2" font-weight="400" font-family="'Source Sans 3'" font-size="9" fill="#000">Reactions before any of the</text>
<text x="227.67" y="88.8" font-weight="400" font-family="'Source Sans 3'" font-size="9" fill="#000">source's damage dice are</text>
<text x="227.67" y="99.4" font-weight="400" font-family="'Source Sans 3'" font-size="9" fill="#000">rolled.</text>
<line x1="346.17" y1="42" x2="342.5" y2="42" stroke="#000" stroke-width="1.2" stroke-linecap="butt"/>
<polygon points="348.5,42 341.5,38.8 341.5,45.2" fill="#000"/>
<rect x="350" y="31" width="154" height="78" fill="#f0f0f0" stroke="#000" stroke-width="0.9" rx="2.5"/>
<circle cx="361" cy="42" r="6.6" fill="#000" stroke="#000" stroke-width="0.5"/>
<text x="361" y="45.3" font-weight="700" font-family="'Source Sans 3'" font-size="9" fill="#fff" text-anchor="middle">4</text>
<text x="372" y="45" font-weight="700" font-family="'Source Sans 3'" font-size="9.5" fill="#000">Roll and resolve</text>
<text x="355" y="57" font-weight="400" font-family="'Source Sans 3'" font-size="9" fill="#000">Roll damage. A damage roll, Total</text>
<text x="355" y="67.6" font-weight="400" font-family="'Source Sans 3'" font-size="9" fill="#000">Miss, Critical Hit, damage application,</text>
<text x="355" y="78.2" font-weight="400" font-family="'Source Sans 3'" font-size="9" fill="#000">or Luck reroll never opens a new</text>
<text x="355" y="88.8" font-weight="400" font-family="'Source Sans 3'" font-size="9" fill="#000">declaration window for that source.</text>
<line x1="0" y1="24" x2="344.67" y2="24" stroke="#000" stroke-width="0.9" stroke-linecap="butt"/>
<line x1="0" y1="24" x2="0" y2="28" stroke="#000" stroke-width="0.9" stroke-linecap="butt"/>
<line x1="344.67" y1="24" x2="344.67" y2="28" stroke="#000" stroke-width="0.9" stroke-linecap="butt"/>
<rect x="120.97" y="19.28" width="102.72" height="10.89" fill="#fff"/>
<text x="122.77" y="27.2" font-weight="600" font-family="'Source Sans 3'" font-size="9" fill="#000">Declaration window open</text>
<line x1="350" y1="24" x2="504" y2="24" stroke="#000" stroke-width="0.9" stroke-linecap="butt"/>
<line x1="350" y1="24" x2="350" y2="28" stroke="#000" stroke-width="0.9" stroke-linecap="butt"/>
<line x1="504" y1="24" x2="504" y2="28" stroke="#000" stroke-width="0.9" stroke-linecap="butt"/>
<rect x="396.1" y="19.28" width="61.8" height="10.89" fill="#fff"/>
<text x="397.9" y="27.2" font-weight="600" font-family="'Source Sans 3'" font-size="9" fill="#000">Window closed</text>
<line x1="0" y1="112.5" x2="504" y2="112.5" stroke="#8c8c8c" stroke-width="0.6" stroke-linecap="butt"/>
<rect x="0" y="116" width="13" height="13" fill="#000"/>
<text x="6.5" y="126.4" font-weight="700" font-family="'Source Sans 3'" font-size="9" fill="#fff" text-anchor="middle">B</text>
<text x="18" y="126.4" font-weight="700" font-family="'Source Sans 3'" font-size="9.5" fill="#000">Who may react, and cost</text>
<text x="1" y="141" font-weight="700" font-family="'Source Sans 3'" font-size="9" fill="#000">•</text>
<text x="9" y="141" font-family="'Source Sans 3'" font-size="9" fill="#000"><tspan font-weight="700">Heroes and Hirelings:</tspan><tspan font-weight="400"> whenever</tspan></text>
<text x="9" y="151.6" font-weight="400" font-family="'Source Sans 3'" font-size="9" fill="#000">a rule allows one.</text>
<text x="1" y="165.2" font-weight="700" font-family="'Source Sans 3'" font-size="9" fill="#000">•</text>
<text x="9" y="165.2" font-family="'Source Sans 3'" font-size="9" fill="#000"><tspan font-weight="700">Allied Summons:</tspan><tspan font-weight="400"> only if a rule</tspan></text>
<text x="9" y="175.8" font-weight="400" font-family="'Source Sans 3'" font-size="9" fill="#000">explicitly grants them Reactions.</text>
<text x="1" y="189.4" font-weight="700" font-family="'Source Sans 3'" font-size="9" fill="#000">•</text>
<text x="9" y="189.4" font-family="'Source Sans 3'" font-size="9" fill="#000"><tspan font-weight="700">Monsters:</tspan><tspan font-weight="400"> only if a rule explicitly</tspan></text>
<text x="9" y="200" font-weight="400" font-family="'Source Sans 3'" font-size="9" fill="#000">allows it.</text>
<text x="1" y="213.6" font-weight="700" font-family="'Source Sans 3'" font-size="9" fill="#000">•</text>
<text x="9" y="213.6" font-weight="400" font-family="'Source Sans 3'" font-size="9" fill="#000">A Reaction needs enough unspent</text>
<text x="9" y="224.2" font-weight="400" font-family="'Source Sans 3'" font-size="9" fill="#000">AP to pay its cost. Taking one does</text>
<text x="9" y="234.8" font-weight="400" font-family="'Source Sans 3'" font-size="9" fill="#000">not begin or end an activation.</text>
<text x="1" y="248.4" font-weight="700" font-family="'Source Sans 3'" font-size="9" fill="#000">•</text>
<text x="9" y="248.4" font-family="'Source Sans 3'" font-size="9" fill="#000"><tspan font-weight="700">Block, Dodge, Parry,</tspan><tspan font-weight="400"> and</tspan></text>
<text x="9" y="259" font-family="'Source Sans 3'" font-size="9" fill="#000"><tspan font-weight="400">ranged-triggered </tspan><tspan font-weight="700">Reflex Attack</tspan></text>
<text x="9" y="269.6" font-weight="400" font-family="'Source Sans 3'" font-size="9" fill="#000">pay their costs immediately, even</text>
<text x="9" y="280.2" font-weight="400" font-family="'Source Sans 3'" font-size="9" fill="#000">if the source later deals no</text>
<text x="9" y="290.8" font-weight="400" font-family="'Source Sans 3'" font-size="9" fill="#000">damage or is cancelled.</text>
<text x="1" y="304.4" font-weight="700" font-family="'Source Sans 3'" font-size="9" fill="#000">•</text>
<text x="9" y="304.4" font-weight="400" font-family="'Source Sans 3'" font-size="9" fill="#000">A Reaction the source's controller</text>
<text x="9" y="315" font-weight="400" font-family="'Source Sans 3'" font-size="9" fill="#000">uses on the source's own roll does</text>
<text x="9" y="325.6" font-weight="400" font-family="'Source Sans 3'" font-size="9" fill="#000">not count against an affected</text>
<text x="9" y="336.2" font-weight="400" font-family="'Source Sans 3'" font-size="9" fill="#000">combatant's limit (panel C).</text>
<rect x="152" y="116" width="13" height="13" fill="#000"/>
<text x="158.5" y="126.4" font-weight="700" font-family="'Source Sans 3'" font-size="9" fill="#fff" text-anchor="middle">C</text>
<text x="170" y="126.4" font-weight="700" font-family="'Source Sans 3'" font-size="9.5" fill="#000">Limit per affected combatant</text>
<text x="152" y="141" font-weight="400" font-family="'Source Sans 3'" font-size="9" fill="#000">Only 1 Reaction may modify how a</text>
<text x="152" y="151.6" font-weight="400" font-family="'Source Sans 3'" font-size="9" fill="#000">single action or effect resolves against</text>
<text x="152" y="162.2" font-weight="400" font-family="'Source Sans 3'" font-size="9" fill="#000">each affected combatant. A combatant</text>
<text x="152" y="172.8" font-weight="400" font-family="'Source Sans 3'" font-size="9" fill="#000">also takes only 1 Reaction in response</text>
<text x="152" y="183.4" font-weight="400" font-family="'Source Sans 3'" font-size="9" fill="#000">to the same action or effect, including</text>
<text x="152" y="194" font-weight="400" font-family="'Source Sans 3'" font-size="9" fill="#000">one that grants a separate action.</text>
<polygon points="165.48,214.6 162.24,220.21 155.76,220.21 152.52,214.6 155.76,208.99 162.24,208.99" fill="url(#p-mon)" stroke="#000" stroke-width="1" stroke-linejoin="round"/>
<line x1="167" y1="214.6" x2="180" y2="214.6" stroke="#000" stroke-width="1.1" stroke-linecap="butt" stroke-dasharray="4.5 2.8"/>
<circle cx="167" cy="214.6" r="1.9" fill="#000"/>
<circle cx="180" cy="214.6" r="1.9" fill="#000"/>
<circle cx="189" cy="214.6" r="6" fill="#000" stroke="#000" stroke-width="0.75"/>
<text x="200" y="217.8" font-weight="600" font-family="'Source Sans 3'" font-size="9" fill="#000">Source: Ogre attacks Cleric</text>
<rect x="152" y="227.6" width="59.19" height="15" fill="#fff" stroke="#000" stroke-width="0.8" rx="2.5"/>
<text x="181.6" y="238.3" font-weight="600" font-family="'Source Sans 3'" font-size="9" fill="#000" text-anchor="middle">Dodge [1 AP]</text>
<polyline points="216.99,235.1 219.93,238.46 225.39,231.74" fill="none" stroke="#000" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
<text x="229.19" y="238.6" font-weight="400" font-family="'Source Sans 3'" font-size="9" fill="#000">declared</text>
<rect x="152" y="245.6" width="124.68" height="15" fill="#fff" stroke="#000" stroke-width="0.8" stroke-dasharray="3 2" rx="2.5"/>
<text x="214.34" y="256.3" font-weight="600" font-family="'Source Sans 3'" font-size="9" fill="#000" text-anchor="middle">Any other modifying Reaction</text>
<line x1="282.48" y1="248.9" x2="290.88" y2="257.3" stroke="#000" stroke-width="1.6" stroke-linecap="round"/>
<line x1="282.48" y1="257.3" x2="290.88" y2="248.9" stroke="#000" stroke-width="1.6" stroke-linecap="round"/>
<text x="152" y="270.6" font-weight="400" font-family="'Source Sans 3'" font-size="9" fill="#000">The Cleric may still react to a different</text>
<text x="152" y="281.2" font-weight="400" font-family="'Source Sans 3'" font-size="9" fill="#000">attack later in the round. If 2 or more</text>
<text x="152" y="291.8" font-weight="400" font-family="'Source Sans 3'" font-size="9" fill="#000">legal Reactions would modify the same</text>
<text x="152" y="302.4" font-weight="400" font-family="'Source Sans 3'" font-size="9" fill="#000">effect, the affected combatant's</text>
<text x="152" y="313" font-weight="400" font-family="'Source Sans 3'" font-size="9" fill="#000">controller chooses which is declared;</text>
<text x="152" y="323.6" font-weight="400" font-family="'Source Sans 3'" font-size="9" fill="#000">the others cost nothing.</text>
<rect x="308" y="116" width="13" height="13" fill="#000"/>
<text x="314.5" y="126.4" font-weight="700" font-family="'Source Sans 3'" font-size="9" fill="#fff" text-anchor="middle">D</text>
<text x="326" y="126.4" font-weight="700" font-family="'Source Sans 3'" font-size="9.5" fill="#000">Reactions that depend on the roll</text>
<rect x="308" y="134" width="196" height="92.9" fill="#fff" stroke="#000" stroke-width="0.9" rx="2.5"/>
<text x="312" y="145.4" font-family="'Source Sans 3'" font-size="9" fill="#000"><tspan font-weight="700">Declare in advance.</tspan><tspan font-weight="400"> Choose its target and</tspan></text>
<text x="312" y="156.2" font-weight="400" font-family="'Source Sans 3'" font-size="9" fill="#000">commit its calculated AP and NRG costs, any</text>
<text x="312" y="167" font-weight="400" font-family="'Source Sans 3'" font-size="9" fill="#000">consumable, and any limited use. Committed</text>
<text x="312" y="177.8" font-weight="400" font-family="'Source Sans 3'" font-size="9" fill="#000">resources cannot be voluntarily spent or</text>
<text x="312" y="188.6" font-weight="400" font-family="'Source Sans 3'" font-size="9" fill="#000">committed elsewhere; AP and NRG stay unspent</text>
<text x="312" y="199.4" font-weight="400" font-family="'Source Sans 3'" font-size="9" fill="#000">and are still subject to forced loss. Declaring it</text>
<text x="312" y="210.2" font-weight="400" font-family="'Source Sans 3'" font-size="9" fill="#000">uses the one-Reaction limit for that source at</text>
<text x="312" y="221" font-weight="400" font-family="'Source Sans 3'" font-size="9" fill="#000">once.</text>
<line x1="357" y1="227.4" x2="357" y2="231.4" stroke="#000" stroke-width="1.2" stroke-linecap="butt"/>
<polygon points="357,237.4 353.8,230.4 360.2,230.4" fill="#000"/>
<line x1="455" y1="227.4" x2="455" y2="231.4" stroke="#000" stroke-width="1.2" stroke-linecap="butt"/>
<polygon points="455,237.4 451.8,230.4 458.2,230.4" fill="#000"/>
<rect x="308" y="237.9" width="93" height="49.7" fill="#f0f0f0" stroke="#000" stroke-width="0.7" rx="2.5"/>
<text x="312" y="249.3" font-family="'Source Sans 3'" font-size="9" fill="#000"><tspan font-weight="700">Trigger occurs,</tspan><tspan font-weight="400"> still</tspan></text>
<text x="312" y="260.1" font-weight="400" font-family="'Source Sans 3'" font-size="9" fill="#000">legal and affordable:</text>
<text x="312" y="270.9" font-weight="400" font-family="'Source Sans 3'" font-size="9" fill="#000">spend the committed</text>
<text x="312" y="281.7" font-weight="400" font-family="'Source Sans 3'" font-size="9" fill="#000">costs and resolve it.</text>
<rect x="411" y="237.9" width="93" height="49.7" fill="#f0f0f0" stroke="#000" stroke-width="0.7" rx="2.5"/>
<text x="415" y="249.3" font-family="'Source Sans 3'" font-size="9" fill="#000"><tspan font-weight="700">Source ends first:</tspan></text>
<text x="415" y="260.1" font-weight="400" font-family="'Source Sans 3'" font-size="9" fill="#000">release the</text>
<text x="415" y="270.9" font-weight="400" font-family="'Source Sans 3'" font-size="9" fill="#000">commitments,</text>
<text x="415" y="281.7" font-weight="400" font-family="'Source Sans 3'" font-size="9" fill="#000">spending nothing.</text>
<text x="308" y="298.6" font-family="'Source Sans 3'" font-size="9" fill="#000"><tspan font-weight="700">Source example:</tspan><tspan font-weight="400"> a Hero declares Conviction and</tspan></text>
<text x="308" y="309.2" font-weight="400" font-family="'Source Sans 3'" font-size="9" fill="#000">commits 1 AP. If a retained base die shows 1, spend</text>
<text x="308" y="319.8" font-weight="400" font-family="'Source Sans 3'" font-size="9" fill="#000">it and resolve the printed reroll; if none does,</text>
<text x="308" y="330.4" font-weight="400" font-family="'Source Sans 3'" font-size="9" fill="#000">release it.</text>
</svg>
