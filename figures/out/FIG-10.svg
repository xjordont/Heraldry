<svg xmlns="http://www.w3.org/2000/svg" width="504pt" height="373.5pt" viewBox="0 0 504 373.5">
<title>Monster Group states and wake-up triggers</title>
<desc>Show Resting/Awake transitions with the five wake-up triggers and how 6" movement, 12" LOS and blocked LOS differ.</desc>
<defs>
<pattern id="p-cover" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="5" height="5" fill="#fff"/><path d="M0 0.5H5M0.5 0V5" stroke="#444" stroke-width="0.7" fill="none"/></pattern>
<pattern id="p-diff" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="4" height="4" fill="#fff"/><circle cx="1" cy="1" r="0.75" fill="#222"/><circle cx="3" cy="3" r="0.75" fill="#222"/></pattern>
<pattern id="p-imp" width="2.4" height="2.4" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="2.4" height="2.4" fill="#fff"/><path d="M0.4 0V2.4" stroke="#000" stroke-width="0.95" fill="none"/></pattern>
<pattern id="p-mon" width="3.2" height="3.2" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)"><rect width="3.2" height="3.2" fill="#fff"/><path d="M0.5 0V3.2" stroke="#000" stroke-width="1" fill="none"/></pattern>
<pattern id="p-aoe" width="4" height="4" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)"><rect width="4" height="4" fill="#fff"/><path d="M0.5 0V4" stroke="#777" stroke-width="1.4" fill="none"/></pattern>
</defs>
<rect x="0" y="0" width="13" height="13" fill="#000"/>
<text x="6.5" y="10.4" font-weight="700" font-family="'Source Sans 3'" font-size="9" fill="#fff" text-anchor="middle">A</text>
<text x="18" y="10.4" font-weight="700" font-family="'Source Sans 3'" font-size="9.5" fill="#000">Monster Group states (9.3, 9.4)</text>
<rect x="0" y="22" width="236" height="40.9" fill="#f0f0f0" stroke="#000" stroke-width="0.7" rx="2.5"/>
<text x="5" y="34.38" font-family="'Source Sans 3'" font-size="9" fill="#000"><tspan font-weight="700">Setup (9.3):</tspan><tspan font-weight="400"> a Monster Group begins </tspan><tspan font-weight="700">Resting</tspan><tspan font-weight="400"> unless the</tspan></text>
<text x="5" y="45.18" font-weight="400" font-family="'Source Sans 3'" font-size="9" fill="#000">scenario says otherwise, has a Guard Point, and each</text>
<text x="5" y="55.98" font-weight="400" font-family="'Source Sans 3'" font-size="9" fill="#000">Monster begins within 3" of the group's starting point.</text>
<rect x="0" y="72.9" width="84" height="22" fill="#fff" stroke="#000" stroke-width="1" rx="2.5"/>
<text x="42" y="87.9" font-weight="700" font-family="'Source Sans 3'" font-size="9.5" fill="#000" text-anchor="middle">RESTING</text>
<rect x="152" y="72.9" width="84" height="22" fill="#000" stroke="#000" stroke-width="1" rx="2.5"/>
<text x="194" y="87.9" font-weight="700" font-family="'Source Sans 3'" font-size="9.5" fill="#fff" text-anchor="middle">AWAKE</text>
<line x1="87" y1="83.9" x2="143" y2="83.9" stroke="#000" stroke-width="1.2" stroke-linecap="butt"/>
<polygon points="149,83.9 142,80.7 142,87.1" fill="#000"/>
<text x="118" y="106.9" font-weight="600" font-family="'Source Sans 3'" font-size="9" fill="#000" text-anchor="middle">any wake-up trigger</text>
<text x="0" y="124.9" font-family="'Source Sans 3'" font-size="9" fill="#000"><tspan font-weight="700">Resting:</tspan><tspan font-weight="400"> does not activate; wakes only when a wake-up rule is</tspan></text>
<text x="0" y="135.5" font-family="'Source Sans 3'" font-size="9" fill="#000"><tspan font-weight="400">met. </tspan><tspan font-weight="700">Awake:</tspan><tspan font-weight="400"> activates in the Monster Phase and stays Awake</tspan></text>
<text x="0" y="146.1" font-weight="400" font-family="'Source Sans 3'" font-size="9" fill="#000">for the rest of the adventure.</text>
<text x="0" y="168.7" font-weight="700" font-family="'Source Sans 3'" font-size="9" fill="#000">Wake-up triggers (unless a scenario or stat block says otherwise)</text>
<circle cx="6.6" cy="179.7" r="6.6" fill="#000" stroke="#000" stroke-width="0.5"/>
<text x="6.6" y="183" font-weight="700" font-family="'Source Sans 3'" font-size="9" fill="#fff" text-anchor="middle">1</text>
<text x="19.2" y="180.7" font-weight="400" font-family="'Source Sans 3'" font-size="9" fill="#000">An enemy moves within 6". No LOS needed.</text>
<circle cx="6.6" cy="196.4" r="6.6" fill="#000" stroke="#000" stroke-width="0.5"/>
<text x="6.6" y="199.7" font-weight="700" font-family="'Source Sans 3'" font-size="9" fill="#fff" text-anchor="middle">2</text>
<text x="19.2" y="197.4" font-weight="400" font-family="'Source Sans 3'" font-size="9" fill="#000">A visible enemy enters the group's LOS within 12".</text>
<circle cx="6.6" cy="213.1" r="6.6" fill="#000" stroke="#000" stroke-width="0.5"/>
<text x="6.6" y="216.4" font-weight="700" font-family="'Source Sans 3'" font-size="9" fill="#fff" text-anchor="middle">3</text>
<text x="19.2" y="214.1" font-weight="400" font-family="'Source Sans 3'" font-size="9" fill="#000">The group suffers damage.</text>
<circle cx="6.6" cy="229.8" r="6.6" fill="#000" stroke="#000" stroke-width="0.5"/>
<text x="6.6" y="233.1" font-weight="700" font-family="'Source Sans 3'" font-size="9" fill="#fff" text-anchor="middle">4</text>
<text x="19.2" y="230.8" font-weight="400" font-family="'Source Sans 3'" font-size="9" fill="#000">An Explosion, collapsing terrain or a loud effect occurs</text>
<text x="19.2" y="241.3" font-weight="400" font-family="'Source Sans 3'" font-size="9" fill="#000">within 6".</text>
<circle cx="6.6" cy="254.3" r="6.6" fill="#000" stroke="#000" stroke-width="0.5"/>
<text x="6.6" y="257.6" font-weight="700" font-family="'Source Sans 3'" font-size="9" fill="#fff" text-anchor="middle">5</text>
<text x="19.2" y="255.3" font-weight="400" font-family="'Source Sans 3'" font-size="9" fill="#000">A scenario rule wakes it.</text>
<rect x="0" y="268" width="236" height="62.5" fill="#f0f0f0" stroke="#000" stroke-width="0.7" rx="2.5"/>
<text x="5" y="280.38" font-family="'Source Sans 3'" font-size="9" fill="#000"><tspan font-weight="400">A </tspan><tspan font-weight="700">Hidden</tspan><tspan font-weight="400"> enemy trips the 6" trigger only within its Hide</tspan></text>
<text x="5" y="291.18" font-weight="400" font-family="'Source Sans 3'" font-size="9" fill="#000">distance (normally 2") and remains Hidden unless revealed.</text>
<text x="5" y="301.98" font-weight="400" font-family="'Source Sans 3'" font-size="9" fill="#000">Hidden or Invisible enemies do not wake a Resting group</text>
<text x="5" y="312.78" font-weight="400" font-family="'Source Sans 3'" font-size="9" fill="#000">through the 12" LOS trigger unless a rule makes them visible</text>
<text x="5" y="323.58" font-weight="400" font-family="'Source Sans 3'" font-size="9" fill="#000">to the group.</text>
<rect x="262" y="0" width="13" height="13" fill="#000"/>
<text x="268.5" y="10.4" font-weight="700" font-family="'Source Sans 3'" font-size="9" fill="#fff" text-anchor="middle">B</text>
<text x="280" y="10.4" font-weight="700" font-family="'Source Sans 3'" font-size="9.5" fill="#000">Wake-up by distance and LOS (9.4)</text>
<circle cx="386" cy="130" r="92" fill="none" stroke="#000" stroke-width="1" stroke-dasharray="5 3"/>
<circle cx="386" cy="130" r="46" fill="#f0f0f0" stroke="#000" stroke-width="1.4"/>
<polygon points="385.26,125 382.13,130.42 375.87,130.42 372.74,125 375.87,119.58 382.13,119.58" fill="url(#p-mon)" stroke="#000" stroke-width="1" stroke-linejoin="round"/>
<polygon points="399.26,126 396.13,131.42 389.87,131.42 386.74,126 389.87,120.58 396.13,120.58" fill="url(#p-mon)" stroke="#000" stroke-width="1" stroke-linejoin="round"/>
<polygon points="392.26,137 389.13,142.42 382.87,142.42 379.74,137 382.87,131.58 389.13,131.58" fill="url(#p-mon)" stroke="#000" stroke-width="1" stroke-linejoin="round"/>
<rect x="403.41" y="87.08" width="13.19" height="10.89" fill="#fff"/>
<text x="405.21" y="95" font-weight="700" font-family="'Source Sans 3'" font-size="9" fill="#000">6"</text>
<rect x="314.03" y="50.08" width="17.94" height="10.89" fill="#fff"/>
<text x="315.83" y="58" font-weight="700" font-family="'Source Sans 3'" font-size="9" fill="#000">12"</text>
<line x1="443.34" y1="89.85" x2="394" y2="126" stroke="#000" stroke-width="1.1" stroke-linecap="butt" stroke-dasharray="4.5 2.8"/>
<circle cx="443.34" cy="89.85" r="1.9" fill="#000"/>
<circle cx="394" cy="126" r="1.9" fill="#000"/>
<circle cx="443.34" cy="89.85" r="6.5" fill="#000" stroke="#000" stroke-width="0.75"/>
<circle cx="439.34" cy="74.85" r="6" fill="#000" stroke="#000" stroke-width="0.5"/>
<text x="439.34" y="78.15" font-weight="700" font-family="'Source Sans 3'" font-size="9" fill="#fff" text-anchor="middle">2</text>
<rect x="355" y="110" width="6" height="40" fill="#4a4a4a" stroke="#000" stroke-width="0.9"/>
<circle cx="298" cy="140" r="6.5" fill="#fff" stroke="#000" stroke-width="1.4"/>
<circle cx="298" cy="140" r="1.82" fill="#000"/>
<line x1="306" y1="140" x2="331" y2="140" stroke="#000" stroke-width="1.6" stroke-linecap="butt"/>
<polygon points="338,140 331,143.4 331,136.6" fill="#000"/>
<circle cx="346" cy="140" r="6.5" fill="#fff" stroke="#000" stroke-width="1.4"/>
<circle cx="346" cy="140" r="1.82" fill="#000"/>
<circle cx="343" cy="156" r="6" fill="#000" stroke="#000" stroke-width="0.5"/>
<text x="343" y="159.3" font-weight="700" font-family="'Source Sans 3'" font-size="9" fill="#fff" text-anchor="middle">1</text>
<rect x="364" y="189" width="44" height="6" fill="#4a4a4a" stroke="#000" stroke-width="0.9"/>
<circle cx="386" cy="212" r="6.5" fill="#000" stroke="#000" stroke-width="0.75"/>
<line x1="386" y1="205" x2="386" y2="144" stroke="#000" stroke-width="1.1" stroke-linecap="butt" stroke-dasharray="4.5 2.8"/>
<circle cx="386" cy="205" r="1.9" fill="#000"/>
<circle cx="386" cy="144" r="1.9" fill="#000"/>
<circle cx="386" cy="192" r="6.4" fill="#fff"/>
<line x1="381.8" y1="187.8" x2="390.2" y2="196.2" stroke="#000" stroke-width="1.6" stroke-linecap="round"/>
<line x1="381.8" y1="196.2" x2="390.2" y2="187.8" stroke="#000" stroke-width="1.6" stroke-linecap="round"/>
<text x="398" y="215.2" font-weight="700" font-family="'Source Sans 3'" font-size="9" fill="#000">no wake-up</text>
<circle cx="269" cy="238" r="6" fill="#000" stroke="#000" stroke-width="0.5"/>
<text x="269" y="241.3" font-weight="700" font-family="'Source Sans 3'" font-size="9" fill="#fff" text-anchor="middle">1</text>
<text x="280" y="241" font-weight="400" font-family="'Source Sans 3'" font-size="9" fill="#000">moves within 6": wakes, although Blocking Terrain stands</text>
<text x="280" y="251.6" font-weight="400" font-family="'Source Sans 3'" font-size="9" fill="#000">between</text>
<circle cx="269" cy="271.2" r="6" fill="#000" stroke="#000" stroke-width="0.5"/>
<text x="269" y="274.5" font-weight="700" font-family="'Source Sans 3'" font-size="9" fill="#fff" text-anchor="middle">2</text>
<text x="280" y="274.2" font-weight="400" font-family="'Source Sans 3'" font-size="9" fill="#000">visible, within 12" with LOS: wakes</text>
<text x="262" y="294.8" font-weight="400" font-family="'Source Sans 3'" font-size="9" fill="#000">× on a sight line: LOS blocked. Third enemy: outside 6", no LOS.</text>
<text x="262" y="306.8" font-weight="600" font-family="'Source Sans 3'" font-size="9" fill="#333">Schematic - not to scale</text>
<text x="0" y="344.5" font-weight="700" font-family="'Source Sans 3'" font-size="9" fill="#000">Key</text>
<polygon points="38.36,344.5 35.12,350.11 28.64,350.11 25.4,344.5 28.64,338.89 35.12,338.89" fill="url(#p-mon)" stroke="#000" stroke-width="1" stroke-linejoin="round"/>
<text x="48.88" y="347.5" font-weight="400" font-family="'Source Sans 3'" font-size="9" fill="#000">Monster Group</text>
<circle cx="123.87" cy="344.5" r="6" fill="#000" stroke="#000" stroke-width="0.75"/>
<text x="140.87" y="347.5" font-weight="400" font-family="'Source Sans 3'" font-size="9" fill="#000">Party A enemy</text>
<circle cx="213.87" cy="344.5" r="6" fill="#fff" stroke="#000" stroke-width="1.4"/>
<circle cx="213.87" cy="344.5" r="1.68" fill="#000"/>
<text x="230.87" y="347.5" font-weight="400" font-family="'Source Sans 3'" font-size="9" fill="#000">Party B enemy</text>
<rect x="297.27" y="339" width="16" height="11" fill="#4a4a4a" stroke="#000" stroke-width="0.8"/>
<text x="321.27" y="347.5" font-weight="400" font-family="'Source Sans 3'" font-size="9" fill="#000">Blocking Terrain</text>
<line x1="393.98" y1="344.5" x2="411.98" y2="344.5" stroke="#000" stroke-width="1.1" stroke-linecap="butt" stroke-dasharray="4.5 2.8"/>
<circle cx="393.98" cy="344.5" r="1.9" fill="#000"/>
<circle cx="411.98" cy="344.5" r="1.9" fill="#000"/>
<text x="418.98" y="347.5" font-weight="400" font-family="'Source Sans 3'" font-size="9" fill="#000">sight line</text>
<line x1="0" y1="359.5" x2="13" y2="359.5" stroke="#000" stroke-width="1.6" stroke-linecap="butt"/>
<polygon points="20,359.5 13,362.9 13,356.1" fill="#000"/>
<text x="26" y="362.5" font-weight="400" font-family="'Source Sans 3'" font-size="9" fill="#000">enemy movement</text>
</svg>
