<text x="0" y="290.4" font-weight="400" font-family="'Source Sans 3'" font-size="9" fill="#000">Zones, the Trail, the Chasm and the Ravine are drawn to scale on a 36"×36" battlefield (3.3 pt per inch); Hero markers are enlarged.</text>
<text x="0" y="300.8" font-weight="400" font-family="'Source Sans 3'" font-size="9" fill="#000">Dimension lines show the stated placement limits. Where the source gives a range (Trail 3–4", Ravine 6–8"), a value inside the range is</text>
<text x="0" y="311.2" font-weight="400" font-family="'Source Sans 3'" font-size="9" fill="#000">drawn and its position is schematic.</text>
</svg>
