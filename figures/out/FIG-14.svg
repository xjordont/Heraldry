<text x="378" y="151.8" font-weight="400" font-family="'Source Sans 3'" font-size="9" fill="#000">Opposite short edges, within 6"</text>
<text x="378" y="162.2" font-weight="400" font-family="'Source Sans 3'" font-size="9" fill="#000">of the edge, on higher ground</text>
<text x="378" y="172.6" font-weight="400" font-family="'Source Sans 3'" font-size="9" fill="#000">outside the Ravine (6–8" wide,</text>
<text x="378" y="183" font-weight="400" font-family="'Source Sans 3'" font-size="9" fill="#000">perpendicular to the long</text>
<text x="378" y="193.4" font-weight="400" font-family="'Source Sans 3'" font-size="9" fill="#000">edges).</text>
<text x="0" y="259.4" font-weight="700" font-family="'Source Sans 3'" font-size="9" fill="#000">Key</text>
