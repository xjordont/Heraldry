<svg xmlns="http://www.w3.org/2000/svg" width="504pt" height="354.8pt" viewBox="0 0 504 354.8">
<title>Party deployment configurations II</title>
<desc>Deployment patterns with extra spatial conditions: Trail, shared short edge, central Safe Zone, and short edges across a Ravine.</desc>
<defs>
<pattern id="p-cover" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="5" height="5" fill="#fff"/><path d="M0 0.5H5M0.5 0V5" stroke="#444" stroke-width="0.7" fill="none"/></pattern>
