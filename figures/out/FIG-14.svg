<rect x="294.12" y="115.72" width="42.55" height="10.89" fill="#fff"/>
<text x="295.92" y="123.64" font-weight="700" font-family="'Source Sans 3'" font-size="9" fill="#000">Safe Zone</text>
<text x="252" y="151.8" font-weight="400" font-family="'Source Sans 3'" font-size="9" fill="#000">Both parties deploy inside a</text>
<text x="252" y="162.2" font-weight="400" font-family="'Source Sans 3'" font-size="9" fill="#000">central 8"×8" Safe Zone (shown</text>
<text x="252" y="172.6" font-weight="400" font-family="'Source Sans 3'" font-size="9" fill="#000">enlarged: detail of the centre,</text>
<text x="252" y="183" font-weight="400" font-family="'Source Sans 3'" font-size="9" fill="#000">6.6 pt per inch), placing Heroes</text>
<text x="252" y="193.4" font-weight="400" font-family="'Source Sans 3'" font-size="9" fill="#000">alternately starting with the</text>
<text x="252" y="203.8" font-weight="400" font-family="'Source Sans 3'" font-size="9" fill="#000">party that lost the Setup</text>
<text x="252" y="214.2" font-weight="400" font-family="'Source Sans 3'" font-size="9" fill="#000">Roll-off. No Hero is placed</text>
<text x="252" y="224.6" font-weight="400" font-family="'Source Sans 3'" font-size="9" fill="#000">within 3" of an opposing Hero.</text>
<rect x="378" y="0" width="13" height="13" fill="#000"/>
