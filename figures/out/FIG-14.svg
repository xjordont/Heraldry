<rect x="232.31" y="30.48" width="13.19" height="10.89" fill="#fff"/>
<text x="234.11" y="38.4" font-weight="700" font-family="'Source Sans 3'" font-size="9" fill="#000">8"</text>
<text x="126" y="151.8" font-weight="400" font-family="'Source Sans 3'" font-size="9" fill="#000">Both parties deploy along the</text>
<text x="126" y="162.2" font-weight="400" font-family="'Source Sans 3'" font-size="9" fill="#000">same short edge (the start side</text>
<text x="126" y="172.6" font-weight="400" font-family="'Source Sans 3'" font-size="9" fill="#000">of the Chasm) within 8" of it,</text>
<text x="126" y="183" font-weight="400" font-family="'Source Sans 3'" font-size="9" fill="#000">placing Heroes alternately</text>
<text x="126" y="193.4" font-weight="400" font-family="'Source Sans 3'" font-size="9" fill="#000">starting with the party that lost</text>
<text x="126" y="203.8" font-weight="400" font-family="'Source Sans 3'" font-size="9" fill="#000">the Setup Roll-off. No Hero is</text>
<text x="126" y="214.2" font-weight="400" font-family="'Source Sans 3'" font-size="9" fill="#000">placed within 6" of an opposing</text>
<text x="126" y="224.6" font-weight="400" font-family="'Source Sans 3'" font-size="9" fill="#000">Hero.</text>
