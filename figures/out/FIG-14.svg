<text x="0" y="290.4" font-weight="400" font-family="'Source Sans 3'" font-size="9" fill="#000">Zones, the Trail, the Chasm and the Ravine are drawn to scale on a 36"×36" battlefield (3.3 pt per inch); Hero markers are enlarged.</text>
<text x="0" y="300.8" font-weight="400" font-family="'Source Sans 3'" font-size="9" fill="#000">Zone-depth dimensions show the stated limits. In panels B and C no Hero is placed within the stated distance of an opposing Hero: the</text>
<text x="0" y="311.2" font-weight="400" font-family="'Source Sans 3'" font-size="9" fill="#000">dashed arc (B, 6") or ring (C, 3") marks that distance from a Party A Hero’s edge, and the dimension line between the nearest opposing</text>
<text x="0" y="321.6" font-weight="400" font-family="'Source Sans 3'" font-size="9" fill="#000">Heroes runs between their closest edges (2.6), 7" in B and 4" in C, both outside the limit. Panel B is measured between drawn marker</text>
<text x="0" y="332" font-weight="400" font-family="'Source Sans 3'" font-size="9" fill="#000">edges; panel C markers are drawn at their true 1" size. Where the source gives a range (Trail 3–4", Ravine 6–8"), a value inside the range</text>
<text x="0" y="342.4" font-weight="400" font-family="'Source Sans 3'" font-size="9" fill="#000">is drawn and its position is schematic.</text>
</svg>
