<text x="90.51" y="84.4" font-weight="700" font-family="'Source Sans 3'" font-size="9" fill="#000">Trail</text>
<text x="0" y="151.8" font-weight="400" font-family="'Source Sans 3'" font-size="9" fill="#000">The Setup Roll-off winner</text>
<text x="0" y="162.2" font-weight="400" font-family="'Source Sans 3'" font-size="9" fill="#000">chooses the short edge where</text>
<text x="0" y="172.6" font-weight="400" font-family="'Source Sans 3'" font-size="9" fill="#000">the Trail enters and deploys</text>
<text x="0" y="183" font-weight="400" font-family="'Source Sans 3'" font-size="9" fill="#000">within 6" of it with at least two</text>
<text x="0" y="193.4" font-weight="400" font-family="'Source Sans 3'" font-size="9" fill="#000">Heroes on the Trail. The other</text>
<text x="0" y="203.8" font-weight="400" font-family="'Source Sans 3'" font-size="9" fill="#000">party does the same at the</text>
<text x="0" y="214.2" font-weight="400" font-family="'Source Sans 3'" font-size="9" fill="#000">opposite short edge. The Trail</text>
<text x="0" y="224.6" font-weight="400" font-family="'Source Sans 3'" font-size="9" fill="#000">is 3–4" wide and runs the full</text>
<text x="0" y="235" font-weight="400" font-family="'Source Sans 3'" font-size="9" fill="#000">length.</text>
