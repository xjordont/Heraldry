<svg xmlns="http://www.w3.org/2000/svg" width="504pt" height="351pt" viewBox="0 0 504 351">
<title>Primary Target, tie-breakers and Blocked Route</title>
<desc>Show target selection by nearest visible enemy, the three tie-breakers, and the Blocked Route retargeting rule.</desc>
