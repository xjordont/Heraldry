<text x="0" y="148" font-family="'Source Sans 3'" font-size="9" fill="#000"><tspan font-weight="700">1 Primary Target:</tspan><tspan font-weight="400"> the nearest visible</tspan></text>
<text x="0" y="158.6" font-weight="400" font-family="'Source Sans 3'" font-size="9" fill="#000">enemy. The Hidden enemy is nearer but is</text>
<text x="0" y="169.2" font-weight="400" font-family="'Source Sans 3'" font-size="9" fill="#000">not a visible enemy, so it is not chosen.</text>
<text x="0" y="179.8" font-weight="400" font-family="'Source Sans 3'" font-size="9" fill="#000">Monsters follow priority alone and never</text>
<text x="0" y="190.4" font-weight="400" font-family="'Source Sans 3'" font-size="9" fill="#000">favour one player over another (9.5 A).</text>
<text x="0" y="205" font-weight="600" font-family="'Source Sans 3'" font-size="9" fill="#333">Schematic — not to scale</text>
