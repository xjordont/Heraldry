<line x1="0" y1="226" x2="504" y2="226" stroke="#8c8c8c" stroke-width="0.6" stroke-linecap="butt"/>
<text x="0" y="240.2" font-weight="600" font-family="'Source Sans 3'" font-size="9" fill="#000">Other tables use other fields, for example 7.10 Armour:</text>
