<text x="22" y="129.55" font-weight="600" font-family="'Source Sans 3'" font-size="9" fill="#000">procedure</text>
<circle cx="10" cy="155.9" r="6.6" fill="#000" stroke="#000" stroke-width="0.5"/>
<text x="10" y="159.2" font-weight="700" font-family="'Source Sans 3'" font-size="9" fill="#fff" text-anchor="middle">4</text>
<text x="22" y="159.2" font-weight="600" font-family="'Source Sans 3'" font-size="9" fill="#000">effect</text>
<circle cx="10" cy="185.55" r="6.6" fill="#000" stroke="#000" stroke-width="0.5"/>
