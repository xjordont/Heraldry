<text x="323" y="128.4" font-weight="400" font-family="'Source Sans 3'" font-size="9" fill="#555" font-style="italic">not in this entry</text>
<rect x="134" y="137.5" width="178" height="36.8" fill="#fff" stroke="#000" stroke-width="0.9" rx="2.5"/>
<text x="139" y="147.9" font-family="'Source Sans 3'" font-size="9" fill="#000"><tspan font-weight="400">Remove </tspan><tspan font-weight="700">Difficult Terrain</tspan><tspan font-weight="400"> from the </tspan><tspan font-weight="700">Aura 1"</tspan></text>
<text x="139" y="158.5" font-weight="400" font-family="'Source Sans 3'" font-size="9" fill="#000">area around that origin</text>
<rect x="318" y="137.5" width="178" height="36.8" fill="#fff" stroke="#000" stroke-width="0.9" rx="2.5"/>
<text x="323" y="147.9" font-family="'Source Sans 3'" font-size="9" fill="#000"><tspan font-weight="400">The weapon attack deals an additional </tspan><tspan font-weight="700">1d4</tspan></text>
<text x="323" y="158.5" font-family="'Source Sans 3'" font-size="9" fill="#000"><tspan font-weight="700">poison damage</tspan><tspan font-weight="400">; target's </tspan><tspan font-weight="700">Speed</tspan><tspan font-weight="400"> is reduced</tspan></text>
<text x="323" y="169.1" font-weight="400" font-family="'Source Sans 3'" font-size="9" fill="#000">by 2"</text>
<rect x="134" y="177.3" width="178" height="16.5" fill="#fff" stroke="#000" stroke-width="0.9" rx="2.5"/>
<text x="139" y="187.7" font-weight="400" font-family="'Source Sans 3'" font-size="9" fill="#000">for the remainder of the adventure.</text>
<rect x="318" y="177.3" width="178" height="16.5" fill="#fff" stroke="#000" stroke-width="0.9" rx="2.5"/>
<text x="323" y="187.7" font-weight="400" font-family="'Source Sans 3'" font-size="9" fill="#000">until the end of the round.</text>
<rect x="134" y="196.8" width="178" height="26.2" fill="#fff" stroke="#000" stroke-width="0.9" rx="2.5"/>
<text x="139" y="207.2" font-weight="400" font-family="'Source Sans 3'" font-size="9" fill="#000">This does not remove magical, hazardous, or</text>
<text x="139" y="217.8" font-weight="400" font-family="'Source Sans 3'" font-size="9" fill="#000">scenario-locked terrain effects.</text>
<rect x="318" y="196.8" width="178" height="26.2" fill="#f0f0f0" stroke="#000" stroke-width="0.7" stroke-dasharray="3 2" rx="2.5"/>
<text x="323" y="207.2" font-weight="400" font-family="'Source Sans 3'" font-size="9" fill="#555" font-style="italic">not in this entry</text>
