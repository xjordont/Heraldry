<text x="5" y="261.4" font-family="'Source Sans 3'" font-size="9" fill="#000"><tspan font-weight="400">Item entries use the core terminology and procedures in </tspan><tspan font-weight="700">Sections 2, 4, 5,</tspan><tspan font-weight="400"> and </tspan><tspan font-weight="700">7.2</tspan><tspan font-weight="400">; apply those rules unless an entry gives a specific</tspan></text>
<text x="5" y="272" font-weight="400" font-family="'Source Sans 3'" font-size="9" fill="#000">exception. Entries include enough operational information to resolve ordinary use without unnecessary reference chains.</text>
