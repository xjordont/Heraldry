<text x="323" y="89.4" font-weight="400" font-family="'Source Sans 3'" font-size="9" fill="#555" font-style="italic">not in this entry; the cost is set by 7.14.1</text>
<rect x="134" y="98.5" width="178" height="16.5" fill="#fff" stroke="#000" stroke-width="0.9" rx="2.5"/>
<text x="139" y="108.9" font-family="'Source Sans 3'" font-size="9" fill="#000"><tspan font-weight="400">Choose an origin within </tspan><tspan font-weight="700">1"</tspan><tspan font-weight="400"> and </tspan><tspan font-weight="700">LOS</tspan><tspan font-weight="400">.</tspan></text>
<rect x="318" y="98.5" width="178" height="16.5" fill="#f0f0f0" stroke="#000" stroke-width="0.7" stroke-dasharray="3 2" rx="2.5"/>
<text x="323" y="108.9" font-weight="400" font-family="'Source Sans 3'" font-size="9" fill="#555" font-style="italic">not in this entry</text>
<rect x="134" y="118" width="178" height="16.5" fill="#f0f0f0" stroke="#000" stroke-width="0.7" stroke-dasharray="3 2" rx="2.5"/>
