<text x="318" y="27.5" font-family="'Source Sans 3'" font-size="9" fill="#000"><tspan font-weight="700">Spidermilk Venom</tspan><tspan font-weight="400"> (7.14)</tspan></text>
<rect x="134" y="32" width="43.96" height="14" fill="#d9d9d9" stroke="#000" stroke-width="0.7"/>
