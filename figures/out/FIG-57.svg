<svg xmlns="http://www.w3.org/2000/svg" width="504pt" height="325.6pt" viewBox="0 0 504 325.6">
<title>10.1 Preparation Steps: procedural template</title>
<desc>Template, not a fixed battlefield: the twelve Preparation Steps, with the step 11 default deployment zones and the step 7 terrain exclusion distances on a generic battlefield.</desc>
<defs>
<pattern id="p-cover" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="5" height="5" fill="#fff"/><path d="M0 0.5H5M0.5 0V5" stroke="#444" stroke-width="0.7" fill="none"/></pattern>
