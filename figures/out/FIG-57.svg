<text x="425.72" y="52.15" font-weight="600" font-family="'Source Sans 3'" font-size="9" fill="#000">3"</text>
<line x1="397.2" y1="70.4" x2="411.2" y2="84.4" stroke="#000" stroke-width="0.8" stroke-linecap="butt"/>
