<text x="0" y="10" font-weight="700" font-family="'Source Sans 3'" font-size="10.5" fill="#000">10.1 Preparation Steps</text>
<circle cx="9.5" cy="29.5" r="6.6" fill="#000" stroke="#000" stroke-width="0.5"/>
<text x="9.5" y="32.8" font-weight="700" font-family="'Source Sans 3'" font-size="9" fill="#fff" text-anchor="middle">1</text>
<text x="22" y="31.5" font-weight="400" font-family="'Source Sans 3'" font-size="9" fill="#000">Determine Average Party Level (APL).</text>
<line x1="9.5" y1="36.3" x2="9.5" y2="40.6" stroke="#000" stroke-width="1" stroke-linecap="butt"/>
<circle cx="9.5" cy="48.5" r="6.6" fill="#000" stroke="#000" stroke-width="0.5"/>
<text x="9.5" y="51.8" font-weight="700" font-family="'Source Sans 3'" font-size="9" fill="#fff" text-anchor="middle">2</text>
<text x="22" y="50.5" font-weight="400" font-family="'Source Sans 3'" font-size="9" fill="#000">Choose Climate.</text>
<line x1="9.5" y1="55.3" x2="9.5" y2="59.6" stroke="#000" stroke-width="1" stroke-linecap="butt"/>
<circle cx="9.5" cy="67.5" r="6.6" fill="#000" stroke="#000" stroke-width="0.5"/>
<text x="9.5" y="70.8" font-weight="700" font-family="'Source Sans 3'" font-size="9" fill="#fff" text-anchor="middle">3</text>
<text x="22" y="69.5" font-weight="400" font-family="'Source Sans 3'" font-size="9" fill="#000">Choose the Core Scenario.</text>
<line x1="9.5" y1="74.3" x2="9.5" y2="78.6" stroke="#000" stroke-width="1" stroke-linecap="butt"/>
<circle cx="9.5" cy="86.5" r="6.6" fill="#000" stroke="#000" stroke-width="0.5"/>
<text x="9.5" y="89.8" font-weight="700" font-family="'Source Sans 3'" font-size="9" fill="#fff" text-anchor="middle">4</text>
<text x="22" y="88.5" font-weight="400" font-family="'Source Sans 3'" font-size="9" fill="#000">Generate Secondary Objectives: record only.</text>
<line x1="9.5" y1="93.3" x2="9.5" y2="97.6" stroke="#000" stroke-width="1" stroke-linecap="butt"/>
<circle cx="9.5" cy="105.5" r="6.6" fill="#000" stroke="#000" stroke-width="0.5"/>
<text x="9.5" y="108.8" font-weight="700" font-family="'Source Sans 3'" font-size="9" fill="#fff" text-anchor="middle">5</text>
<text x="22" y="107.5" font-weight="400" font-family="'Source Sans 3'" font-size="9" fill="#000">Generate Weather: record only.</text>
<line x1="9.5" y1="112.3" x2="9.5" y2="116.6" stroke="#000" stroke-width="1" stroke-linecap="butt"/>
<circle cx="9.5" cy="124.5" r="6.6" fill="#000" stroke="#000" stroke-width="0.5"/>
<text x="9.5" y="127.8" font-weight="700" font-family="'Source Sans 3'" font-size="9" fill="#fff" text-anchor="middle">6</text>
<text x="22" y="126.5" font-weight="400" font-family="'Source Sans 3'" font-size="9" fill="#000">Resolve the Setup Roll-off.</text>
<line x1="9.5" y1="131.3" x2="9.5" y2="135.6" stroke="#000" stroke-width="1" stroke-linecap="butt"/>
<rect x="0" y="135" width="214" height="46.6" fill="#f0f0f0" stroke="#000" stroke-width="0.9" rx="2"/>
<circle cx="9.5" cy="158.8" r="6.6" fill="#000" stroke="#000" stroke-width="0.5"/>
<text x="9.5" y="162.1" font-weight="700" font-family="'Source Sans 3'" font-size="9" fill="#fff" text-anchor="middle">7</text>
<text x="22" y="145.2" font-family="'Source Sans 3'" font-size="9" fill="#000"><tspan font-weight="700">Place Terrain.</tspan><tspan font-weight="400"> Major Blocking or Impassable</tspan></text>
<text x="22" y="155.6" font-weight="400" font-family="'Source Sans 3'" font-size="9" fill="#000">Terrain stays 3" from a battlefield edge and 6"</text>
<text x="22" y="166" font-weight="400" font-family="'Source Sans 3'" font-size="9" fill="#000">from a deployment zone unless the scenario says</text>
<text x="22" y="176.4" font-weight="400" font-family="'Source Sans 3'" font-size="9" fill="#000">otherwise.</text>
<line x1="9.5" y1="165.6" x2="9.5" y2="185.2" stroke="#000" stroke-width="1" stroke-linecap="butt"/>
<circle cx="9.5" cy="193.1" r="6.6" fill="#000" stroke="#000" stroke-width="0.5"/>
<text x="9.5" y="196.4" font-weight="700" font-family="'Source Sans 3'" font-size="9" fill="#fff" text-anchor="middle">8</text>
<text x="22" y="195.1" font-weight="400" font-family="'Source Sans 3'" font-size="9" fill="#000">Place Objectives and Markers.</text>
<line x1="9.5" y1="199.9" x2="9.5" y2="204.2" stroke="#000" stroke-width="1" stroke-linecap="butt"/>
<circle cx="9.5" cy="212.1" r="6.6" fill="#000" stroke="#000" stroke-width="0.5"/>
<text x="9.5" y="215.4" font-weight="700" font-family="'Source Sans 3'" font-size="9" fill="#fff" text-anchor="middle">9</text>
<text x="22" y="214.1" font-weight="400" font-family="'Source Sans 3'" font-size="9" fill="#000">Generate and Place Monsters.</text>
<line x1="9.5" y1="218.9" x2="9.5" y2="223.2" stroke="#000" stroke-width="1" stroke-linecap="butt"/>
<circle cx="9.5" cy="231.1" r="6.6" fill="#000" stroke="#000" stroke-width="0.5"/>
<text x="9.5" y="234.4" font-weight="700" font-family="'Source Sans 3'" font-size="9" fill="#fff" text-anchor="middle">10</text>
<text x="22" y="233.1" font-weight="400" font-family="'Source Sans 3'" font-size="9" fill="#000">Assign Guard Points.</text>
<line x1="9.5" y1="237.9" x2="9.5" y2="242.2" stroke="#000" stroke-width="1" stroke-linecap="butt"/>
<rect x="0" y="241.6" width="214" height="57" fill="#f0f0f0" stroke="#000" stroke-width="0.9" rx="2"/>
<circle cx="9.5" cy="270.6" r="6.6" fill="#000" stroke="#000" stroke-width="0.5"/>
<text x="9.5" y="273.9" font-weight="700" font-family="'Source Sans 3'" font-size="9" fill="#fff" text-anchor="middle">11</text>
<text x="22" y="251.8" font-family="'Source Sans 3'" font-size="9" fill="#000"><tspan font-weight="700">Deploy the Parties</tspan><tspan font-weight="400"> as the scenario instructs.</tspan></text>
<text x="22" y="262.2" font-weight="400" font-family="'Source Sans 3'" font-size="9" fill="#000">Where it is silent: the Roll-off winner chooses an</text>
<text x="22" y="272.6" font-weight="400" font-family="'Source Sans 3'" font-size="9" fill="#000">edge or corner zone and the other party takes the</text>
<text x="22" y="283" font-weight="400" font-family="'Source Sans 3'" font-size="9" fill="#000">opposite one; alternate placing Heroes, the</text>
<text x="22" y="293.4" font-weight="400" font-family="'Source Sans 3'" font-size="9" fill="#000">Roll-off loser first.</text>
<line x1="9.5" y1="277.4" x2="9.5" y2="302.2" stroke="#000" stroke-width="1" stroke-linecap="butt"/>
<circle cx="9.5" cy="310.1" r="6.6" fill="#000" stroke="#000" stroke-width="0.5"/>
<text x="9.5" y="313.4" font-weight="700" font-family="'Source Sans 3'" font-size="9" fill="#fff" text-anchor="middle">12</text>
<text x="22" y="312.1" font-weight="400" font-family="'Source Sans 3'" font-size="9" fill="#000">Begin Round 1 with the Initiative Phase.</text>
<rect x="232" y="6" width="272" height="17" fill="#fff" stroke="#000" stroke-width="1.2" rx="2"/>
<text x="368" y="18.2" font-weight="700" font-family="'Source Sans 3'" font-size="10" fill="#000" text-anchor="middle">Template — not a fixed battlefield</text>
<text x="238" y="36.8" font-weight="700" font-family="'Source Sans 3'" font-size="9" fill="#000">Step 11 default: edge zones</text>
<text x="370.8" y="36.8" font-weight="700" font-family="'Source Sans 3'" font-size="9" fill="#000">Step 11 default: corner zones</text>
<rect x="238" y="44" width="118.8" height="118.8" fill="url(#p-aoe)"/>
<rect x="277.6" y="53.9" width="39.6" height="99" fill="#fff" stroke="#000" stroke-width="0.8" stroke-dasharray="3 2"/>
