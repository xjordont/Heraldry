<text x="414.5" y="88.88" font-weight="600" font-family="'Source Sans 3'" font-size="9" fill="#000">6"</text>
<text x="238" y="174.8" font-weight="400" font-family="'Source Sans 3'" font-size="9" fill="#000">Zones are 6" deep. The other pair</text>
<text x="238" y="185.2" font-weight="400" font-family="'Source Sans 3'" font-size="9" fill="#000">of opposite edges works the</text>
<text x="238" y="195.6" font-weight="400" font-family="'Source Sans 3'" font-size="9" fill="#000">same way.</text>
<text x="370.8" y="174.8" font-weight="400" font-family="'Source Sans 3'" font-size="9" fill="#000">Corner zones are 8"×8"; the</text>
<text x="370.8" y="185.2" font-weight="400" font-family="'Source Sans 3'" font-size="9" fill="#000">second zone is diagonally</text>
<text x="370.8" y="195.6" font-weight="400" font-family="'Source Sans 3'" font-size="9" fill="#000">opposite.</text>
<rect x="232" y="204" width="22" height="11" fill="url(#p-aoe)" stroke="#000" stroke-width="0.8"/>
<text x="260" y="213" font-weight="400" font-family="'Source Sans 3'" font-size="9" fill="#000">Step 7: no major Blocking or Impassable Terrain here</text>
<rect x="232" y="219" width="22" height="11" fill="#fff" stroke="#000" stroke-width="0.8" stroke-dasharray="3 2"/>
<text x="260" y="228" font-weight="400" font-family="'Source Sans 3'" font-size="9" fill="#000">Step 7: major Blocking or Impassable Terrain allowed</text>
<rect x="232" y="234" width="22" height="11" fill="#f0f0f0" stroke="#000" stroke-width="0.9" stroke-dasharray="3.2 2.2"/>
<text x="260" y="243" font-weight="400" font-family="'Source Sans 3'" font-size="9" fill="#000">Deployment zone (Party A black, Party B dotted)</text>
<text x="232" y="256" font-weight="400" font-family="'Source Sans 3'" font-size="9" fill="#000">Drawn to scale at 3.3 pt per inch on a 36"×36" battlefield; the 3" edge</text>
<text x="232" y="266.4" font-weight="400" font-family="'Source Sans 3'" font-size="9" fill="#000">margin and the 6" distance from a zone are measured from the zone's</text>
<text x="232" y="276.8" font-weight="400" font-family="'Source Sans 3'" font-size="9" fill="#000">outline, so corner zones leave a rounded exclusion.</text>
</svg>
