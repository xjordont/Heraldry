<svg xmlns="http://www.w3.org/2000/svg" width="504pt" height="303.8pt" viewBox="0 0 504 303.8">
<title>Rules hierarchy and precedence</title>
<desc>Show how to resolve two conflicting rules, which kinds of rule override the general rules they modify, and how must, may, and cannot are read.</desc>
<defs>
<pattern id="p-cover" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="5" height="5" fill="#fff"/><path d="M0 0.5H5M0.5 0V5" stroke="#444" stroke-width="0.7" fill="none"/></pattern>
<pattern id="p-diff" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="4" height="4" fill="#fff"/><circle cx="1" cy="1" r="0.75" fill="#222"/><circle cx="3" cy="3" r="0.75" fill="#222"/></pattern>
<pattern id="p-imp" width="2.4" height="2.4" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="2.4" height="2.4" fill="#fff"/><path d="M0.4 0V2.4" stroke="#000" stroke-width="0.95" fill="none"/></pattern>
<pattern id="p-mon" width="3.2" height="3.2" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)"><rect width="3.2" height="3.2" fill="#fff"/><path d="M0.5 0V3.2" stroke="#000" stroke-width="1" fill="none"/></pattern>
<pattern id="p-aoe" width="4" height="4" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)"><rect width="4" height="4" fill="#fff"/><path d="M0.5 0V4" stroke="#777" stroke-width="1.4" fill="none"/></pattern>
</defs>
<rect x="0" y="0" width="262" height="19" fill="#000" stroke="#000" stroke-width="0.9" rx="2.5"/>
<circle cx="11" cy="9.5" r="6.6" fill="#fff"/>
<text x="11" y="12.7" font-weight="700" font-family="'Source Sans 3'" font-size="9" fill="#000" text-anchor="middle">1</text>
<text x="22" y="12.9" font-weight="700" font-family="'Source Sans 3'" font-size="9.5" fill="#fff">Resolving a conflict</text>
<text x="257" y="12.9" font-weight="600" font-family="'Source Sans 3'" font-size="9" fill="#fff" text-anchor="end">1.6</text>
<rect x="5" y="25" width="252" height="22" fill="#f0f0f0" stroke="#000" stroke-width="0.9" rx="2.5"/>
<text x="131" y="37.6" font-family="'Source Sans 3'" font-size="9" fill="#000" text-anchor="middle"><tspan font-weight="700">Two rules conflict.</tspan></text>
<line x1="131" y1="48" x2="131" y2="66" stroke="#000" stroke-width="1.2" stroke-linecap="butt"/>
<polygon points="131,72 127.8,65 134.2,65" fill="#000"/>
<circle cx="13" cy="95" r="6.6" fill="#000" stroke="#000" stroke-width="0.5"/>
<text x="13" y="98.3" font-weight="700" font-family="'Source Sans 3'" font-size="9" fill="#fff" text-anchor="middle">1</text>
<rect x="23" y="74" width="98" height="42" fill="#fff" stroke="#000" stroke-width="0.9" rx="2.5"/>
<text x="72" y="91.3" font-family="'Source Sans 3'" font-size="9" fill="#000" text-anchor="middle"><tspan font-weight="400">One rule is </tspan><tspan font-weight="700">more</tspan></text>
<text x="72" y="101.9" font-family="'Source Sans 3'" font-size="9" fill="#000" text-anchor="middle"><tspan font-weight="700">specific</tspan><tspan font-weight="400">.</tspan></text>
<line x1="122" y1="95" x2="138" y2="95" stroke="#000" stroke-width="1.2" stroke-linecap="butt"/>
<polygon points="144,95 137,91.8 137,98.2" fill="#000"/>
<rect x="146" y="74" width="111" height="42" fill="#f0f0f0" stroke="#000" stroke-width="0.9" rx="2.5"/>
<text x="201.5" y="91.3" font-family="'Source Sans 3'" font-size="9" fill="#000" text-anchor="middle"><tspan font-weight="700">Use the more specific</tspan></text>
<text x="201.5" y="101.9" font-family="'Source Sans 3'" font-size="9" fill="#000" text-anchor="middle"><tspan font-weight="700">rule.</tspan></text>
<line x1="72" y1="117" x2="72" y2="151" stroke="#000" stroke-width="1.2" stroke-linecap="butt"/>
<polygon points="72,157 68.8,150 75.2,150" fill="#000"/>
<text x="79" y="141" font-weight="600" font-family="'Source Sans 3'" font-size="9" fill="#000">equally specific</text>
<circle cx="13" cy="180" r="6.6" fill="#000" stroke="#000" stroke-width="0.5"/>
<text x="13" y="183.3" font-weight="700" font-family="'Source Sans 3'" font-size="9" fill="#fff" text-anchor="middle">2</text>
<rect x="23" y="159" width="98" height="42" fill="#fff" stroke="#000" stroke-width="0.9" rx="2.5"/>
<text x="72" y="176.3" font-family="'Source Sans 3'" font-size="9" fill="#000" text-anchor="middle"><tspan font-weight="400">Two rules are </tspan><tspan font-weight="700">equally</tspan></text>
<text x="72" y="186.9" font-family="'Source Sans 3'" font-size="9" fill="#000" text-anchor="middle"><tspan font-weight="700">specific</tspan><tspan font-weight="400">.</tspan></text>
<line x1="122" y1="180" x2="138" y2="180" stroke="#000" stroke-width="1.2" stroke-linecap="butt"/>
<polygon points="144,180 137,176.8 137,183.2" fill="#000"/>
<rect x="146" y="159" width="111" height="42" fill="#f0f0f0" stroke="#000" stroke-width="0.9" rx="2.5"/>
<text x="201.5" y="176.3" font-family="'Source Sans 3'" font-size="9" fill="#000" text-anchor="middle"><tspan font-weight="700">Use the more restrictive</tspan></text>
<text x="201.5" y="186.9" font-family="'Source Sans 3'" font-size="9" fill="#000" text-anchor="middle"><tspan font-weight="700">rule.</tspan></text>
<rect x="0" y="0" width="262" height="220.2" fill="none" stroke="#000" stroke-width="0.9" rx="2.5"/>
<rect x="270" y="0" width="234" height="19" fill="#000" stroke="#000" stroke-width="0.9" rx="2.5"/>
<circle cx="281" cy="9.5" r="6.6" fill="#fff"/>
<text x="281" y="12.7" font-weight="700" font-family="'Source Sans 3'" font-size="9" fill="#000" text-anchor="middle">2</text>
<text x="292" y="12.9" font-weight="700" font-family="'Source Sans 3'" font-size="9.5" fill="#fff">Which rule overrides</text>
<text x="499" y="12.9" font-weight="600" font-family="'Source Sans 3'" font-size="9" fill="#fff" text-anchor="end">1.6</text>
<rect x="275" y="25" width="224" height="16.6" fill="#f0f0f0" stroke="#000" stroke-width="0.9" rx="2.5"/>
<text x="387" y="34.9" font-family="'Source Sans 3'" font-size="9" fill="#000" text-anchor="middle"><tspan font-weight="700">Scenario rules</tspan></text>
<line x1="289" y1="43.6" x2="289" y2="55.6" stroke="#000" stroke-width="1.2" stroke-linecap="butt"/>
<polygon points="289,61.6 285.8,54.6 292.2,54.6" fill="#000"/>
<text x="303" y="55.6" font-weight="600" font-family="'Source Sans 3'" font-size="9" fill="#000">override</text>
<rect x="275" y="63.6" width="224" height="16.6" fill="#fff" stroke="#000" stroke-width="0.9" rx="2.5"/>
<text x="387" y="73.5" font-weight="400" font-family="'Source Sans 3'" font-size="9" fill="#000" text-anchor="middle">the core rules, for that scenario</text>
<rect x="275" y="87.2" width="224" height="27.2" fill="#f0f0f0" stroke="#000" stroke-width="0.9" rx="2.5"/>
<text x="387" y="97.1" font-family="'Source Sans 3'" font-size="9" fill="#000" text-anchor="middle"><tspan font-weight="700">Class features, Powers, Monster rules, terrain rules,</tspan></text>
<text x="387" y="107.7" font-family="'Source Sans 3'" font-size="9" fill="#000" text-anchor="middle"><tspan font-weight="700">and item rules</tspan></text>
<line x1="289" y1="116.4" x2="289" y2="128.4" stroke="#000" stroke-width="1.2" stroke-linecap="butt"/>
<polygon points="289,134.4 285.8,127.4 292.2,127.4" fill="#000"/>
<text x="303" y="128.4" font-weight="600" font-family="'Source Sans 3'" font-size="9" fill="#000">override</text>
<rect x="275" y="136.4" width="224" height="16.6" fill="#fff" stroke="#000" stroke-width="0.9" rx="2.5"/>
<text x="387" y="146.3" font-weight="400" font-family="'Source Sans 3'" font-size="9" fill="#000" text-anchor="middle">the general rules they explicitly modify</text>
<rect x="275" y="160" width="224" height="16.6" fill="#fff" stroke="#000" stroke-width="0.9" rx="2.5"/>
<text x="387" y="169.9" font-family="'Source Sans 3'" font-size="9" fill="#000" text-anchor="middle"><tspan font-weight="700">Examples, summaries, and reference tables</tspan></text>
<line x1="289" y1="178.6" x2="289" y2="196.6" stroke="#000" stroke-width="1.2" stroke-linecap="butt"/>
<circle cx="289" cy="187.6" r="6.4" fill="#fff"/>
<line x1="284.8" y1="183.4" x2="293.2" y2="191.8" stroke="#000" stroke-width="1.8" stroke-linecap="round"/>
<line x1="284.8" y1="191.8" x2="293.2" y2="183.4" stroke="#000" stroke-width="1.8" stroke-linecap="round"/>
<text x="303" y="190.6" font-weight="600" font-family="'Source Sans 3'" font-size="9" fill="#000">never override</text>
<rect x="275" y="198.6" width="224" height="16.6" fill="#fff" stroke="#000" stroke-width="0.9" rx="2.5"/>
<text x="387" y="208.5" font-weight="400" font-family="'Source Sans 3'" font-size="9" fill="#000" text-anchor="middle">the main rules text</text>
<rect x="270" y="0" width="234" height="220.2" fill="none" stroke="#000" stroke-width="0.9" rx="2.5"/>
<rect x="0" y="228.2" width="504" height="19" fill="#000" stroke="#000" stroke-width="0.9" rx="2.5"/>
<circle cx="11" cy="237.7" r="6.6" fill="#fff"/>
<text x="11" y="240.9" font-weight="700" font-family="'Source Sans 3'" font-size="9" fill="#000" text-anchor="middle">3</text>
<text x="22" y="241.1" font-weight="700" font-family="'Source Sans 3'" font-size="9.5" fill="#fff">Reading rules text</text>
<text x="499" y="241.1" font-weight="600" font-family="'Source Sans 3'" font-size="9" fill="#fff" text-anchor="end">1.6</text>
<rect x="5" y="253.2" width="160.67" height="28" fill="#fff" stroke="#000" stroke-width="0.9" rx="2.5"/>
<text x="85.33" y="268.8" font-family="'Source Sans 3'" font-size="9" fill="#000" text-anchor="middle"><tspan font-weight="700">must</tspan><tspan font-weight="400"> marks a required instruction</tspan></text>
<rect x="171.67" y="253.2" width="160.67" height="28" fill="#fff" stroke="#000" stroke-width="0.9" rx="2.5"/>
<text x="252" y="268.8" font-family="'Source Sans 3'" font-size="9" fill="#000" text-anchor="middle"><tspan font-weight="700">may</tspan><tspan font-weight="400"> marks a permission or choice</tspan></text>
<rect x="338.33" y="253.2" width="160.67" height="28" fill="#fff" stroke="#000" stroke-width="0.9" rx="2.5"/>
<text x="418.67" y="268.8" font-family="'Source Sans 3'" font-size="9" fill="#000" text-anchor="middle"><tspan font-weight="700">cannot</tspan><tspan font-weight="400"> marks a prohibition</tspan></text>
<text x="5" y="293.5" font-weight="400" font-family="'Source Sans 3'" font-size="9" fill="#000">These words do not create a separate precedence system. Resolve every conflict with the procedure above.</text>
<rect x="0" y="228.2" width="504" height="73.6" fill="none" stroke="#000" stroke-width="0.9" rx="2.5"/>
</svg>
