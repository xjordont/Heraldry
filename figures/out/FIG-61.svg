<text x="144" y="65.4" font-weight="400" font-family="'Source Sans 3'" font-size="9" fill="#000">speed</text>
<text x="135" y="77.5" font-weight="700" font-family="'Source Sans 3'" font-size="9" fill="#000">•</text>
<text x="144" y="77.5" font-weight="400" font-family="'Source Sans 3'" font-size="9" fill="#000">balance</text>
<text x="135" y="89.6" font-weight="700" font-family="'Source Sans 3'" font-size="9" fill="#000">•</text>
<text x="144" y="89.6" font-weight="400" font-family="'Source Sans 3'" font-size="9" fill="#000">stealth</text>
<text x="135" y="101.7" font-weight="700" font-family="'Source Sans 3'" font-size="9" fill="#000">•</text>
<text x="144" y="101.7" font-weight="400" font-family="'Source Sans 3'" font-size="9" fill="#000">dodging</text>
<text x="135" y="113.8" font-weight="700" font-family="'Source Sans 3'" font-size="9" fill="#000">•</text>
<text x="144" y="113.8" font-weight="400" font-family="'Source Sans 3'" font-size="9" fill="#000">delicate physical tasks</text>
