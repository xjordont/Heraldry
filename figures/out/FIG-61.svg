<text x="298" y="258.2" font-family="'Source Sans 3'" font-size="9" fill="#000"><tspan font-weight="400">Most starting Heroes have values between </tspan><tspan font-weight="700">-1</tspan><tspan font-weight="400"> and </tspan><tspan font-weight="700">+3</tspan><tspan font-weight="400">.</tspan></text>
<text x="289" y="270.3" font-weight="700" font-family="'Source Sans 3'" font-size="9" fill="#000">•</text>
<text x="298" y="270.3" font-weight="400" font-family="'Source Sans 3'" font-size="9" fill="#000">Scores may be negative.</text>
