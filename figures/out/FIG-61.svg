<text x="59" y="256.6" font-family="'Source Sans 3'" font-size="9" fill="#000" text-anchor="middle"><tspan font-weight="700">DEX</tspan><tspan font-weight="400">, </tspan><tspan font-weight="700">INT</tspan><tspan font-weight="400">, or </tspan><tspan font-weight="700">SPI Check</tspan></text>
