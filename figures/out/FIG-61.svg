<text x="19" y="53.3" font-weight="400" font-family="'Source Sans 3'" font-size="9" fill="#000">melee force</text>
<text x="10" y="65.4" font-weight="700" font-family="'Source Sans 3'" font-size="9" fill="#000">•</text>
<text x="19" y="65.4" font-weight="400" font-family="'Source Sans 3'" font-size="9" fill="#000">physical power</text>
<text x="10" y="77.5" font-weight="700" font-family="'Source Sans 3'" font-size="9" fill="#000">•</text>
<text x="19" y="77.5" font-weight="400" font-family="'Source Sans 3'" font-size="9" fill="#000">climbing</text>
<text x="10" y="89.6" font-weight="700" font-family="'Source Sans 3'" font-size="9" fill="#000">•</text>
<text x="19" y="89.6" font-weight="400" font-family="'Source Sans 3'" font-size="9" fill="#000">forcing objects</text>
