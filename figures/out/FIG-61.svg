<text x="394" y="53.3" font-weight="400" font-family="'Source Sans 3'" font-size="9" fill="#000">willpower</text>
<text x="385" y="65.4" font-weight="700" font-family="'Source Sans 3'" font-size="9" fill="#000">•</text>
<text x="394" y="65.4" font-weight="400" font-family="'Source Sans 3'" font-size="9" fill="#000">faith</text>
<text x="385" y="77.5" font-weight="700" font-family="'Source Sans 3'" font-size="9" fill="#000">•</text>
<text x="394" y="77.5" font-weight="400" font-family="'Source Sans 3'" font-size="9" fill="#000">resolve</text>
<text x="385" y="89.6" font-weight="700" font-family="'Source Sans 3'" font-size="9" fill="#000">•</text>
<text x="394" y="89.6" font-weight="400" font-family="'Source Sans 3'" font-size="9" fill="#000">leadership</text>
<text x="385" y="101.7" font-weight="700" font-family="'Source Sans 3'" font-size="9" fill="#000">•</text>
<text x="394" y="101.7" font-weight="400" font-family="'Source Sans 3'" font-size="9" fill="#000">powers of faith, nature,</text>
<text x="394" y="112.3" font-weight="400" font-family="'Source Sans 3'" font-size="9" fill="#000">and sorcery</text>
