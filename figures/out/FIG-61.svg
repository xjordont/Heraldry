<text x="260" y="65.4" font-weight="700" font-family="'Source Sans 3'" font-size="9" fill="#000">•</text>
<text x="269" y="65.4" font-weight="400" font-family="'Source Sans 3'" font-size="9" fill="#000">reasoning</text>
<text x="260" y="77.5" font-weight="700" font-family="'Source Sans 3'" font-size="9" fill="#000">•</text>
<text x="269" y="77.5" font-weight="400" font-family="'Source Sans 3'" font-size="9" fill="#000">knowledge</text>
<text x="260" y="89.6" font-weight="700" font-family="'Source Sans 3'" font-size="9" fill="#000">•</text>
<text x="269" y="89.6" font-weight="400" font-family="'Source Sans 3'" font-size="9" fill="#000">investigation</text>
<text x="260" y="101.7" font-weight="700" font-family="'Source Sans 3'" font-size="9" fill="#000">•</text>
<text x="269" y="101.7" font-weight="400" font-family="'Source Sans 3'" font-size="9" fill="#000">initiative</text>
<text x="260" y="113.8" font-weight="700" font-family="'Source Sans 3'" font-size="9" fill="#000">•</text>
<text x="269" y="113.8" font-family="'Source Sans 3'" font-size="9" fill="#000"><tspan font-weight="700">Arcane Spells</tspan></text>
<text x="260" y="125.9" font-weight="700" font-family="'Source Sans 3'" font-size="9" fill="#000">•</text>
<text x="269" y="125.9" font-family="'Source Sans 3'" font-size="9" fill="#000"><tspan font-weight="700">Psychic Abilities</tspan></text>
