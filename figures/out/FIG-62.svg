<svg xmlns="http://www.w3.org/2000/svg" width="504pt" height="326.6pt" viewBox="0 0 504 326.6">
<title>Ability Checks, Advantage and Disadvantage, and Monsters</title>
<desc>Show how a Check is rolled and read, how Advantage and Disadvantage change a d20 Check (with an example), and how Monsters are handled.</desc>
<defs>
<pattern id="p-cover" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="5" height="5" fill="#fff"/><path d="M0 0.5H5M0.5 0V5" stroke="#444" stroke-width="0.7" fill="none"/></pattern>
<pattern id="p-diff" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="4" height="4" fill="#fff"/><circle cx="1" cy="1" r="0.75" fill="#222"/><circle cx="3" cy="3" r="0.75" fill="#222"/></pattern>
<pattern id="p-imp" width="2.4" height="2.4" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="2.4" height="2.4" fill="#fff"/><path d="M0.4 0V2.4" stroke="#000" stroke-width="0.95" fill="none"/></pattern>
<pattern id="p-mon" width="3.2" height="3.2" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)"><rect width="3.2" height="3.2" fill="#fff"/><path d="M0.5 0V3.2" stroke="#000" stroke-width="1" fill="none"/></pattern>
<pattern id="p-aoe" width="4" height="4" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)"><rect width="4" height="4" fill="#fff"/><path d="M0.5 0V4" stroke="#777" stroke-width="1.4" fill="none"/></pattern>
</defs>
<rect x="0" y="0" width="252" height="19" fill="#000" stroke="#000" stroke-width="0.9" rx="2.5"/>
<circle cx="11" cy="9.5" r="6.6" fill="#fff"/>
<text x="11" y="12.7" font-weight="700" font-family="'Source Sans 3'" font-size="9" fill="#000" text-anchor="middle">1</text>
<text x="22" y="12.9" font-weight="700" font-family="'Source Sans 3'" font-size="9.5" fill="#fff">Making a Check</text>
<text x="247" y="12.9" font-weight="600" font-family="'Source Sans 3'" font-size="9" fill="#fff" text-anchor="end">2.3</text>
<circle cx="11.6" cy="30.6" r="6.6" fill="#000" stroke="#000" stroke-width="0.5"/>
<text x="11.6" y="33.9" font-weight="700" font-family="'Source Sans 3'" font-size="9" fill="#fff" text-anchor="middle">1</text>
<text x="23" y="32.3" font-family="'Source Sans 3'" font-size="9" fill="#000"><tspan font-weight="400">A rule calls for a </tspan><tspan font-weight="700">Check</tspan><tspan font-weight="400"> and tells you which ability to use.</tspan></text>
<circle cx="11.6" cy="46.2" r="6.6" fill="#000" stroke="#000" stroke-width="0.5"/>
<text x="11.6" y="49.5" font-weight="700" font-family="'Source Sans 3'" font-size="9" fill="#fff" text-anchor="middle">2</text>
<text x="23" y="47.9" font-family="'Source Sans 3'" font-size="9" fill="#000"><tspan font-weight="400">Roll </tspan><tspan font-weight="700">1d20</tspan><tspan font-weight="400"> and add the listed ability score.</tspan></text>
<circle cx="11.6" cy="61.8" r="6.6" fill="#000" stroke="#000" stroke-width="0.5"/>
<text x="11.6" y="65.1" font-weight="700" font-family="'Source Sans 3'" font-size="9" fill="#fff" text-anchor="middle">3</text>
<text x="23" y="63.5" font-weight="400" font-family="'Source Sans 3'" font-size="9" fill="#000">Read the result.</text>
<rect x="5" y="72.8" width="118" height="27.2" fill="#f0f0f0" stroke="#000" stroke-width="0.9" rx="2.5"/>
<text x="64" y="82.7" font-family="'Source Sans 3'" font-size="9" fill="#000" text-anchor="middle"><tspan font-weight="700">Natural 1:</tspan><tspan font-weight="400"> </tspan><tspan font-weight="700">Critical Failure</tspan><tspan font-weight="400">,</tspan></text>
<text x="64" y="93.3" font-weight="400" font-family="'Source Sans 3'" font-size="9" fill="#000" text-anchor="middle">always fails</text>
<rect x="129" y="72.8" width="118" height="27.2" fill="#f0f0f0" stroke="#000" stroke-width="0.9" rx="2.5"/>
<text x="188" y="82.7" font-family="'Source Sans 3'" font-size="9" fill="#000" text-anchor="middle"><tspan font-weight="700">Natural 20:</tspan><tspan font-weight="400"> </tspan><tspan font-weight="700">Critical Success</tspan><tspan font-weight="400">,</tspan></text>
<text x="188" y="93.3" font-weight="400" font-family="'Source Sans 3'" font-size="9" fill="#000" text-anchor="middle">always succeeds</text>
<text x="5" y="113.3" font-weight="600" font-family="'Source Sans 3'" font-size="9" fill="#000">Otherwise compare the total with 12:</text>
<rect x="5" y="119" width="121" height="18" fill="#fff" stroke="#000" stroke-width="0.9" rx="2"/>
<rect x="126" y="119" width="121" height="18" fill="#4a4a4a" stroke="#000" stroke-width="0.9" rx="2"/>
<text x="65.5" y="131.3" font-weight="600" font-family="'Source Sans 3'" font-size="9" fill="#000" text-anchor="middle">11 or lower: fails</text>
<text x="186.5" y="131.3" font-weight="600" font-family="'Source Sans 3'" font-size="9" fill="#fff" text-anchor="middle">12 or higher: succeeds</text>
<text x="5" y="150.3" font-family="'Source Sans 3'" font-size="9" fill="#000"><tspan font-weight="700">Natural 1</tspan><tspan font-weight="400"> and </tspan><tspan font-weight="700">natural 20</tspan><tspan font-weight="400"> apply only to </tspan><tspan font-weight="700">d20 Checks</tspan><tspan font-weight="400"> unless a rule</tspan></text>
<text x="5" y="160.9" font-weight="400" font-family="'Source Sans 3'" font-size="9" fill="#000">says otherwise. Some attacks, Reactions, and Power rules define</text>
<text x="5" y="171.5" font-weight="400" font-family="'Source Sans 3'" font-size="9" fill="#000">their own critical results for non-d20 rolls.</text>
<rect x="0" y="0" width="252" height="179.8" fill="none" stroke="#000" stroke-width="0.9" rx="2.5"/>
<rect x="260" y="0" width="244" height="19" fill="#000" stroke="#000" stroke-width="0.9" rx="2.5"/>
<circle cx="271" cy="9.5" r="6.6" fill="#fff"/>
<text x="271" y="12.7" font-weight="700" font-family="'Source Sans 3'" font-size="9" fill="#000" text-anchor="middle">2</text>
<text x="282" y="12.9" font-weight="700" font-family="'Source Sans 3'" font-size="9.5" fill="#fff">Advantage and Disadvantage</text>
<text x="499" y="12.9" font-weight="600" font-family="'Source Sans 3'" font-size="9" fill="#fff" text-anchor="end">2.4</text>
<text x="265" y="32.3" font-family="'Source Sans 3'" font-size="9" fill="#000"><tspan font-weight="400">For a </tspan><tspan font-weight="700">d20 Check</tspan><tspan font-weight="400"> the affected die is </tspan><tspan font-weight="700">d20</tspan><tspan font-weight="400">. Add one extra die,</tspan></text>
<text x="265" y="42.9" font-weight="400" font-family="'Source Sans 3'" font-size="9" fill="#000">then ignore one:</text>
<text x="265" y="54.5" font-weight="700" font-family="'Source Sans 3'" font-size="9" fill="#000">•</text>
<text x="274" y="54.5" font-family="'Source Sans 3'" font-size="9" fill="#000"><tspan font-weight="700">Advantage:</tspan><tspan font-weight="400"> ignore the lowest single die.</tspan></text>
<text x="265" y="66.6" font-weight="700" font-family="'Source Sans 3'" font-size="9" fill="#000">•</text>
<text x="274" y="66.6" font-family="'Source Sans 3'" font-size="9" fill="#000"><tspan font-weight="700">Disadvantage:</tspan><tspan font-weight="400"> ignore the highest single die.</tspan></text>
<text x="265" y="78.7" font-weight="700" font-family="'Source Sans 3'" font-size="9" fill="#000">•</text>
<text x="274" y="78.7" font-weight="400" font-family="'Source Sans 3'" font-size="9" fill="#000">Both apply to one roll: they cancel and you roll normally.</text>
<text x="265" y="90.8" font-weight="700" font-family="'Source Sans 3'" font-size="9" fill="#000">•</text>
<text x="274" y="90.8" font-weight="400" font-family="'Source Sans 3'" font-size="9" fill="#000">Instances of the same kind do not stack.</text>
<text x="265" y="105.9" font-family="'Source Sans 3'" font-size="9" fill="#000"><tspan font-weight="700">Example.</tspan><tspan font-weight="400"> Assume an ability score of +2 and two d20 showing</tspan></text>
<text x="265" y="116.5" font-weight="400" font-family="'Source Sans 3'" font-size="9" fill="#000">7 and 15:</text>
<text x="265" y="136.3" font-weight="600" font-family="'Source Sans 3'" font-size="9" fill="#000">Advantage</text>
<rect x="337" y="122.8" width="20" height="20" fill="#f0f0f0" stroke="#000" stroke-width="1" rx="3"/>
<text x="347" y="136.2" font-weight="700" font-family="'Source Sans 3'" font-size="10" fill="#8c8c8c" text-anchor="middle">7</text>
<line x1="339" y1="140.8" x2="355" y2="124.8" stroke="#000" stroke-width="1.2" stroke-linecap="butt"/>
<rect x="362" y="122.8" width="20" height="20" fill="#fff" stroke="#000" stroke-width="1" rx="3"/>
<text x="372" y="136.2" font-weight="700" font-family="'Source Sans 3'" font-size="10" fill="#000" text-anchor="middle">15</text>
<text x="389" y="136.3" font-weight="600" font-family="'Source Sans 3'" font-size="9" fill="#000">15 + 2 = 17: succeeds</text>
<text x="265" y="161.3" font-weight="600" font-family="'Source Sans 3'" font-size="9" fill="#000">Disadvantage</text>
<rect x="337" y="147.8" width="20" height="20" fill="#fff" stroke="#000" stroke-width="1" rx="3"/>
<text x="347" y="161.2" font-weight="700" font-family="'Source Sans 3'" font-size="10" fill="#000" text-anchor="middle">7</text>
<rect x="362" y="147.8" width="20" height="20" fill="#f0f0f0" stroke="#000" stroke-width="1" rx="3"/>
<text x="372" y="161.2" font-weight="700" font-family="'Source Sans 3'" font-size="10" fill="#8c8c8c" text-anchor="middle">15</text>
<line x1="364" y1="165.8" x2="380" y2="149.8" stroke="#000" stroke-width="1.2" stroke-linecap="butt"/>
<text x="389" y="161.3" font-weight="600" font-family="'Source Sans 3'" font-size="9" fill="#000">7 + 2 = 9: fails</text>
<rect x="260" y="0" width="244" height="179.8" fill="none" stroke="#000" stroke-width="0.9" rx="2.5"/>
<rect x="0" y="187.8" width="504" height="19" fill="#000" stroke="#000" stroke-width="0.9" rx="2.5"/>
<circle cx="11" cy="197.3" r="6.6" fill="#fff"/>
<text x="11" y="200.5" font-weight="700" font-family="'Source Sans 3'" font-size="9" fill="#000" text-anchor="middle">3</text>
<text x="22" y="200.7" font-weight="700" font-family="'Source Sans 3'" font-size="9.5" fill="#fff">Monsters and Checks</text>
<text x="499" y="200.7" font-weight="600" font-family="'Source Sans 3'" font-size="9" fill="#fff" text-anchor="end">2.3</text>
<rect x="5" y="212.8" width="150" height="106.8" fill="#fff" stroke="#000" stroke-width="0.9" rx="2.5"/>
<rect x="5" y="212.8" width="150" height="14" fill="#d9d9d9" stroke="#000" stroke-width="0.9" rx="2.5"/>
<text x="80" y="223.1" font-weight="700" font-family="'Source Sans 3'" font-size="9" fill="#000" text-anchor="middle">Monsters never make a Check</text>
<text x="9" y="237.1" font-family="'Source Sans 3'" font-size="9" fill="#000"><tspan font-weight="400">A </tspan><tspan font-weight="700">Monster</tspan><tspan font-weight="400"> has no </tspan><tspan font-weight="700">STR</tspan><tspan font-weight="400">, </tspan><tspan font-weight="700">DEX</tspan><tspan font-weight="400">, </tspan><tspan font-weight="700">INT</tspan><tspan font-weight="400">, or</tspan></text>
<text x="9" y="247.7" font-family="'Source Sans 3'" font-size="9" fill="#000"><tspan font-weight="700">SPI</tspan><tspan font-weight="400"> score. If a rule would require one</tspan></text>
<text x="9" y="258.3" font-weight="400" font-family="'Source Sans 3'" font-size="9" fill="#000">to make a Check, do not roll it.</text>
<text x="9" y="268.9" font-weight="400" font-family="'Source Sans 3'" font-size="9" fill="#000">Resolve the normal failed-Check</text>
<text x="9" y="279.5" font-family="'Source Sans 3'" font-size="9" fill="#000"><tspan font-weight="400">effect (not a </tspan><tspan font-weight="700">Critical Failure</tspan><tspan font-weight="400">) against</tspan></text>
<text x="9" y="290.1" font-family="'Source Sans 3'" font-size="9" fill="#000"><tspan font-weight="400">that </tspan><tspan font-weight="700">Monster</tspan><tspan font-weight="400"> automatically unless</tspan></text>
<text x="9" y="300.7" font-family="'Source Sans 3'" font-size="9" fill="#000"><tspan font-weight="400">they are </tspan><tspan font-weight="700">Immune</tspan><tspan font-weight="400"> to it.</tspan></text>
<rect x="161" y="212.8" width="196" height="106.8" fill="#fff" stroke="#000" stroke-width="0.9" rx="2.5"/>
<rect x="161" y="212.8" width="196" height="14" fill="#d9d9d9" stroke="#000" stroke-width="0.9" rx="2.5"/>
<text x="259" y="223.1" font-weight="700" font-family="'Source Sans 3'" font-size="9" fill="#000" text-anchor="middle">Exception: Terrain Check</text>
<text x="165" y="237.1" font-family="'Source Sans 3'" font-size="9" fill="#000"><tspan font-weight="400">A </tspan><tspan font-weight="700">Monster</tspan><tspan font-weight="400"> automatically succeeds on every</tspan></text>
<text x="165" y="247.7" font-family="'Source Sans 3'" font-size="9" fill="#000"><tspan font-weight="700">Terrain Check</tspan><tspan font-weight="400">: a Check required by the </tspan><tspan font-weight="700">Climb</tspan><tspan font-weight="400"> or</tspan></text>
<text x="165" y="258.3" font-family="'Source Sans 3'" font-size="9" fill="#000"><tspan font-weight="700">Jump</tspan><tspan font-weight="400"> rules, by a Terrain Type or </tspan><tspan font-weight="700">Terrain Tag</tspan><tspan font-weight="400">, or</tspan></text>
<text x="165" y="268.9" font-weight="400" font-family="'Source Sans 3'" font-size="9" fill="#000">by a terrain feature or hazard marker that a</text>
<text x="165" y="279.5" font-weight="400" font-family="'Source Sans 3'" font-size="9" fill="#000">scenario or Secondary Objective places. A Check</text>
<text x="165" y="290.1" font-weight="400" font-family="'Source Sans 3'" font-size="9" fill="#000">that a Power, scroll, item, attack, Special Ability,</text>
<text x="165" y="300.7" font-family="'Source Sans 3'" font-size="9" fill="#000"><tspan font-weight="400">or weather result requires directly is not a </tspan><tspan font-weight="700">Terrain</tspan></text>
<text x="165" y="311.3" font-family="'Source Sans 3'" font-size="9" fill="#000"><tspan font-weight="700">Check</tspan><tspan font-weight="400">.</tspan></text>
<rect x="363" y="212.8" width="136" height="106.8" fill="#fff" stroke="#000" stroke-width="0.9" rx="2.5"/>
<rect x="363" y="212.8" width="136" height="14" fill="#d9d9d9" stroke="#000" stroke-width="0.9" rx="2.5"/>
<text x="431" y="223.1" font-weight="700" font-family="'Source Sans 3'" font-size="9" fill="#000" text-anchor="middle">Casting Check</text>
<text x="367" y="237.1" font-family="'Source Sans 3'" font-size="9" fill="#000"><tspan font-weight="400">If a </tspan><tspan font-weight="700">Power</tspan><tspan font-weight="400"> or scroll would require</tspan></text>
<text x="367" y="247.7" font-family="'Source Sans 3'" font-size="9" fill="#000"><tspan font-weight="400">a </tspan><tspan font-weight="700">Monster</tspan><tspan font-weight="400"> to make such a Check</tspan></text>
<text x="367" y="258.3" font-family="'Source Sans 3'" font-size="9" fill="#000"><tspan font-weight="400">and that </tspan><tspan font-weight="700">Monster's LVL</tspan><tspan font-weight="400"> is higher</tspan></text>
<text x="367" y="268.9" font-weight="400" font-family="'Source Sans 3'" font-size="9" fill="#000">than the Level of the Hero using</text>
<text x="367" y="279.5" font-family="'Source Sans 3'" font-size="9" fill="#000"><tspan font-weight="400">it, its </tspan><tspan font-weight="700">Casting Check</tspan><tspan font-weight="400"> is made with</tspan></text>
<text x="367" y="290.1" font-family="'Source Sans 3'" font-size="9" fill="#000"><tspan font-weight="700">Disadvantage</tspan><tspan font-weight="400">.</tspan></text>
<rect x="0" y="187.8" width="504" height="136.8" fill="none" stroke="#000" stroke-width="0.9" rx="2.5"/>
</svg>
