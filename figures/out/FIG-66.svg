<text x="114" y="31.2" font-weight="600" font-family="'Source Sans 3'" font-size="9" fill="#000" text-anchor="middle">Party Phase</text>
<line x1="144.05" y1="28" x2="150.05" y2="28" stroke="#000" stroke-width="1.2" stroke-linecap="butt"/>
<polygon points="156.05,28 149.05,24.8 149.05,31.2" fill="#000"/>
<rect x="158.05" y="20" width="66.88" height="16" fill="#fff" stroke="#000" stroke-width="0.8" rx="2.5"/>
<text x="191.49" y="31.2" font-weight="600" font-family="'Source Sans 3'" font-size="9" fill="#000" text-anchor="middle">Monster Phase</text>
<line x1="226.93" y1="28" x2="232.93" y2="28" stroke="#000" stroke-width="1.2" stroke-linecap="butt"/>
<polygon points="238.93,28 231.93,24.8 231.93,31.2" fill="#000"/>
<rect x="240.93" y="20" width="61.74" height="16" fill="#000" stroke="#000" stroke-width="0.8" rx="2.5"/>
<text x="271.8" y="31.2" font-weight="600" font-family="'Source Sans 3'" font-size="9" fill="#fff" text-anchor="middle">End of Round</text>
<text x="308.67" y="31.4" font-weight="400" font-family="'Source Sans 3'" font-size="9" fill="#000">Default order shown (3.1).</text>
<text x="0" y="49" font-family="'Source Sans 3'" font-size="9" fill="#000"><tspan font-weight="400">The </tspan><tspan font-weight="700">End of Round</tspan><tspan font-weight="400"> begins after both the </tspan><tspan font-weight="700">Party Phase</tspan><tspan font-weight="400"> and </tspan><tspan font-weight="700">Monster Phase</tspan><tspan font-weight="400"> have resolved, including when a specific rule places the</tspan></text>
<text x="0" y="59.6" font-weight="400" font-family="'Source Sans 3'" font-size="9" fill="#000">Monster Phase first (3.1, 3.4.3). Resolve it in the order below unless a more specific rule says otherwise.</text>
