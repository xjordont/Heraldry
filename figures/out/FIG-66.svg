<text x="18" y="10.4" font-weight="700" font-family="'Source Sans 3'" font-size="9.5" fill="#000">When End of Round begins (3.5)</text>
<rect x="0" y="20" width="69.96" height="16" fill="#fff" stroke="#000" stroke-width="0.8" rx="2.5"/>
<text x="34.98" y="31.2" font-weight="600" font-family="'Source Sans 3'" font-size="9" fill="#000" text-anchor="middle">Initiative Phase</text>
<line x1="71.96" y1="28" x2="77.96" y2="28" stroke="#000" stroke-width="1.2" stroke-linecap="butt"/>
<polygon points="83.96,28 76.96,24.8 76.96,31.2" fill="#000"/>
