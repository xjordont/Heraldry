<text x="458" y="88.4" font-weight="600" font-family="'Source Sans 3'" font-size="9" fill="#000" text-anchor="middle">item effects</text>
<rect x="143" y="96.2" width="69.65" height="14" fill="#f0f0f0" stroke="#000" stroke-width="0.7" rx="2.5"/>
<text x="177.83" y="106.4" font-weight="600" font-family="'Source Sans 3'" font-size="9" fill="#000" text-anchor="middle">Monster effects</text>
<rect x="216.65" y="96.2" width="70.86" height="14" fill="#f0f0f0" stroke="#000" stroke-width="0.7" rx="2.5"/>
<text x="252.08" y="106.4" font-weight="600" font-family="'Source Sans 3'" font-size="9" fill="#000" text-anchor="middle">scenario effects</text>
<text x="144" y="122.7" font-weight="400" font-family="'Source Sans 3'" font-size="9" fill="#000">that occur at the end of the round. If 2 or more resolve at the same time, use 3.6 Timing Rules.</text>
<line x1="65" y1="128.5" x2="65" y2="130.5" stroke="#000" stroke-width="1.2" stroke-linecap="butt"/>
<polygon points="65,136.5 61.8,129.5 68.2,129.5" fill="#000"/>
<rect x="0" y="136" width="130" height="40.4" fill="#000" stroke="#000" stroke-width="0.9" rx="2.5"/>
<circle cx="12" cy="148" r="6.6" fill="#fff"/>
<text x="12" y="151.2" font-weight="700" font-family="'Source Sans 3'" font-size="9" fill="#000" text-anchor="middle">2</text>
<text x="24" y="150.4" font-weight="700" font-family="'Source Sans 3'" font-size="9" fill="#fff">End effects, remove</text>
<text x="24" y="161.2" font-weight="700" font-family="'Source Sans 3'" font-size="9" fill="#fff">Temporary HP</text>
<rect x="138" y="136" width="366" height="40.4" fill="#fff" stroke="#000" stroke-width="0.9" rx="2.5"/>
<text x="144" y="150" font-family="'Source Sans 3'" font-size="9" fill="#000"><tspan font-weight="400">Effects that last </tspan><tspan font-weight="700">until the end of the round</tspan><tspan font-weight="400"> end. Any remaining </tspan><tspan font-weight="700">Temporary HP</tspan><tspan font-weight="400"> is removed</tspan></text>
<text x="144" y="160.8" font-weight="400" font-family="'Source Sans 3'" font-size="9" fill="#000">(5.4.2). A combatant loses all Temporary HP earlier if reduced to 0 HP, Knocked Out, or</text>
<text x="144" y="171.6" font-weight="400" font-family="'Source Sans 3'" font-size="9" fill="#000">removed from the battlefield (5.4.2).</text>
<line x1="65" y1="176.9" x2="65" y2="178.9" stroke="#000" stroke-width="1.2" stroke-linecap="butt"/>
<polygon points="65,184.9 61.8,177.9 68.2,177.9" fill="#000"/>
<rect x="0" y="184.4" width="130" height="29.6" fill="#000" stroke="#000" stroke-width="0.9" rx="2.5"/>
<circle cx="12" cy="196.4" r="6.6" fill="#fff"/>
<text x="12" y="199.6" font-weight="700" font-family="'Source Sans 3'" font-size="9" fill="#000" text-anchor="middle">3</text>
<text x="24" y="198.8" font-weight="700" font-family="'Source Sans 3'" font-size="9" fill="#fff">Remove unspent AP</text>
<rect x="138" y="184.4" width="366" height="29.6" fill="#fff" stroke="#000" stroke-width="0.9" rx="2.5"/>
<text x="144" y="198.4" font-weight="400" font-family="'Source Sans 3'" font-size="9" fill="#000">Any unspent AP is removed. Until then it is kept, and Heroes and Hirelings may spend it on</text>
<text x="144" y="209.2" font-weight="400" font-family="'Source Sans 3'" font-size="9" fill="#000">Reactions (3.3.2, 3.3.3). It never carries into the following round (3.3.2).</text>
<line x1="65" y1="214.5" x2="65" y2="216.5" stroke="#000" stroke-width="1.2" stroke-linecap="butt"/>
<polygon points="65,222.5 61.8,215.5 68.2,215.5" fill="#000"/>
<rect x="0" y="222" width="130" height="24" fill="#000" stroke="#000" stroke-width="0.9" rx="2.5"/>
<circle cx="12" cy="234" r="6.6" fill="#fff"/>
<text x="12" y="237.2" font-weight="700" font-family="'Source Sans 3'" font-size="9" fill="#000" text-anchor="middle">4</text>
<text x="24" y="236.4" font-weight="700" font-family="'Source Sans 3'" font-size="9" fill="#fff">Scoring and victory</text>
<rect x="138" y="222" width="366" height="24" fill="#fff" stroke="#000" stroke-width="0.9" rx="2.5"/>
<text x="144" y="237.4" font-family="'Source Sans 3'" font-size="9" fill="#000"><tspan font-weight="400">Resolve </tspan><tspan font-weight="700">scenario scoring, extraction, round limits, and victory conditions</tspan><tspan font-weight="400">.</tspan></text>
<line x1="65" y1="247.5" x2="65" y2="251.5" stroke="#000" stroke-width="1.2" stroke-linecap="butt"/>
<polygon points="65,257.5 61.8,250.5 68.2,250.5" fill="#000"/>
<rect x="0" y="257" width="246" height="28.1" fill="#f0f0f0" stroke="#000" stroke-width="0.7" rx="2.5"/>
<text x="4" y="268.4" font-family="'Source Sans 3'" font-size="9" fill="#000"><tspan font-weight="700">The scenario has ended:</tspan><tspan font-weight="400"> no new round begins.</tspan></text>
<rect x="258" y="257" width="246" height="28.1" fill="#f0f0f0" stroke="#000" stroke-width="0.7" rx="2.5"/>
<text x="262" y="268.4" font-family="'Source Sans 3'" font-size="9" fill="#000"><tspan font-weight="700">The scenario has not ended:</tspan><tspan font-weight="400"> a new round begins with the</tspan></text>
<text x="262" y="279.2" font-family="'Source Sans 3'" font-size="9" fill="#000"><tspan font-weight="700">Initiative Phase</tspan><tspan font-weight="400"> (3.1, 3.2).</tspan></text>
<line x1="0" y1="292.1" x2="504" y2="292.1" stroke="#8c8c8c" stroke-width="0.6" stroke-linecap="butt"/>
<rect x="0" y="297.1" width="13" height="13" fill="#000"/>
<text x="6.5" y="307.5" font-weight="700" font-family="'Source Sans 3'" font-size="9" fill="#fff" text-anchor="middle">B</text>
<text x="18" y="307.5" font-weight="700" font-family="'Source Sans 3'" font-size="9.5" fill="#000">Example (assumed values): one Hero through the End of Round</text>
<text x="0" y="321.1" font-weight="400" font-family="'Source Sans 3'" font-size="9" fill="#000">Assumes the Hero starts with 4 Temporary HP, 1 unspent AP, and an effect that lasts until the end of the round, and that an ongoing</text>
<text x="0" y="331.7" font-weight="400" font-family="'Source Sans 3'" font-size="9" fill="#000">effect deals 2 damage after mitigation at the end of the round.</text>
