<circle cx="12" cy="85.2" r="6.6" fill="#fff"/>
<text x="12" y="88.4" font-weight="700" font-family="'Source Sans 3'" font-size="9" fill="#000" text-anchor="middle">1</text>
<text x="24" y="87.6" font-weight="700" font-family="'Source Sans 3'" font-size="9" fill="#fff">End-of-round effects</text>
<rect x="138" y="73.2" width="366" height="54.8" fill="#fff" stroke="#000" stroke-width="0.9" rx="2.5"/>
<rect x="143" y="78.2" width="74.67" height="14" fill="#f0f0f0" stroke="#000" stroke-width="0.7" rx="2.5"/>
<text x="180.34" y="88.4" font-weight="600" font-family="'Source Sans 3'" font-size="9" fill="#000" text-anchor="middle">ongoing damage</text>
<rect x="221.67" y="78.2" width="51.04" height="14" fill="#f0f0f0" stroke="#000" stroke-width="0.7" rx="2.5"/>
<text x="247.19" y="88.4" font-weight="600" font-family="'Source Sans 3'" font-size="9" fill="#000" text-anchor="middle">conditions</text>
<rect x="276.71" y="78.2" width="36.57" height="14" fill="#f0f0f0" stroke="#000" stroke-width="0.7" rx="2.5"/>
<text x="295" y="88.4" font-weight="600" font-family="'Source Sans 3'" font-size="9" fill="#000" text-anchor="middle">terrain</text>
<rect x="317.28" y="78.2" width="42.13" height="14" fill="#f0f0f0" stroke="#000" stroke-width="0.7" rx="2.5"/>
<text x="338.35" y="88.4" font-weight="600" font-family="'Source Sans 3'" font-size="9" fill="#000" text-anchor="middle">weather</text>
<rect x="363.41" y="78.2" width="62.75" height="14" fill="#f0f0f0" stroke="#000" stroke-width="0.7" rx="2.5"/>
<text x="394.79" y="88.4" font-weight="600" font-family="'Source Sans 3'" font-size="9" fill="#000" text-anchor="middle">Power effects</text>
