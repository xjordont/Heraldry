<svg xmlns="http://www.w3.org/2000/svg" width="504pt" height="282pt" viewBox="0 0 504 282">
<title>Stacking and precedence</title>
<desc>Group the eight rules of 7.4 into what stacks, damage type and damage order, overrides, and placement and Reactions, keeping the bullet numbers.</desc>
<defs>
<pattern id="p-cover" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="5" height="5" fill="#fff"/><path d="M0 0.5H5M0.5 0V5" stroke="#444" stroke-width="0.7" fill="none"/></pattern>
<pattern id="p-diff" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="4" height="4" fill="#fff"/><circle cx="1" cy="1" r="0.75" fill="#222"/><circle cx="3" cy="3" r="0.75" fill="#222"/></pattern>
<pattern id="p-imp" width="2.4" height="2.4" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="2.4" height="2.4" fill="#fff"/><path d="M0.4 0V2.4" stroke="#000" stroke-width="0.95" fill="none"/></pattern>
<pattern id="p-mon" width="3.2" height="3.2" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)"><rect width="3.2" height="3.2" fill="#fff"/><path d="M0.5 0V3.2" stroke="#000" stroke-width="1" fill="none"/></pattern>
<pattern id="p-aoe" width="4" height="4" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)"><rect width="4" height="4" fill="#fff"/><path d="M0.5 0V4" stroke="#777" stroke-width="1.4" fill="none"/></pattern>
</defs>
<rect x="0" y="0" width="13" height="13" fill="#000"/>
<text x="6.5" y="10.4" font-weight="700" font-family="'Source Sans 3'" font-size="9" fill="#fff" text-anchor="middle">A</text>
<text x="18" y="10.4" font-weight="700" font-family="'Source Sans 3'" font-size="9.5" fill="#000">What stacks and what does not</text>
<rect x="0" y="19" width="246" height="62" fill="#fff" stroke="#000" stroke-width="0.9" rx="2.5"/>
<circle cx="13" cy="50" r="6.6" fill="#000" stroke="#000" stroke-width="0.5"/>
<text x="13" y="53.3" font-weight="700" font-family="'Source Sans 3'" font-size="9" fill="#fff" text-anchor="middle">1</text>
<text x="26" y="31.7" font-weight="400" font-family="'Source Sans 3'" font-size="9" fill="#000">If 2 item effects would modify the same statistic,</text>
<text x="26" y="42.3" font-family="'Source Sans 3'" font-size="9" fill="#000"><tspan font-weight="700">Reaction</tspan><tspan font-weight="400">, </tspan><tspan font-weight="700">Check</tspan><tspan font-weight="400">, or non-damage roll, apply only the</tspan></text>
<text x="26" y="52.9" font-family="'Source Sans 3'" font-size="9" fill="#000"><tspan font-weight="700">single highest bonus</tspan><tspan font-weight="400"> and the </tspan><tspan font-weight="700">single worst penalty</tspan></text>
<text x="26" y="63.5" font-weight="400" font-family="'Source Sans 3'" font-size="9" fill="#000">unless a rule explicitly says the effects stack. Damage</text>
<text x="26" y="74.1" font-family="'Source Sans 3'" font-size="9" fill="#000"><tspan font-weight="400">dice and damage modifiers stack under </tspan><tspan font-weight="700">5.4</tspan><tspan font-weight="400">.</tspan></text>
<rect x="12" y="84" width="234" height="29.7" fill="#f0f0f0" stroke="#000" stroke-width="0.7" rx="2.5"/>
<text x="17" y="96.4" font-weight="400" font-family="'Source Sans 3'" font-size="9" fill="#000">Example (assumed values), same Check: two item bonuses,</text>
<text x="17" y="107" font-weight="400" font-family="'Source Sans 3'" font-size="9" fill="#000">+1 and +2, apply +2. Two item penalties, -1 and -3, apply -3.</text>
<line x1="6.5" y1="81.5" x2="6.5" y2="98.85" stroke="#000" stroke-width="1" stroke-linecap="butt"/>
<line x1="6.5" y1="98.85" x2="12" y2="98.85" stroke="#000" stroke-width="1" stroke-linecap="butt"/>
<rect x="0" y="117.7" width="246" height="30.2" fill="#fff" stroke="#000" stroke-width="0.9" rx="2.5"/>
<circle cx="13" cy="132.8" r="6.6" fill="#000" stroke="#000" stroke-width="0.5"/>
<text x="13" y="136.1" font-weight="700" font-family="'Source Sans 3'" font-size="9" fill="#fff" text-anchor="middle">4</text>
<text x="26" y="130.4" font-family="'Source Sans 3'" font-size="9" fill="#000"><tspan font-weight="700">AV bonuses</tspan><tspan font-weight="400"> from different equipped locations stack. Two</tspan></text>
<text x="26" y="141" font-family="'Source Sans 3'" font-size="9" fill="#000"><tspan font-weight="400">effects from the </tspan><tspan font-weight="700">same named item</tspan><tspan font-weight="400"> never stack.</tspan></text>
<rect x="0" y="155.9" width="13" height="13" fill="#000"/>
<text x="6.5" y="166.3" font-weight="700" font-family="'Source Sans 3'" font-size="9" fill="#fff" text-anchor="middle">B</text>
<text x="18" y="166.3" font-weight="700" font-family="'Source Sans 3'" font-size="9.5" fill="#000">Damage type and damage order</text>
<rect x="0" y="174.9" width="246" height="30.2" fill="#fff" stroke="#000" stroke-width="0.9" rx="2.5"/>
<circle cx="13" cy="190" r="6.6" fill="#000" stroke="#000" stroke-width="0.5"/>
<text x="13" y="193.3" font-weight="700" font-family="'Source Sans 3'" font-size="9" fill="#fff" text-anchor="middle">2</text>
<text x="26" y="187.6" font-weight="400" font-family="'Source Sans 3'" font-size="9" fill="#000">If two effects would change a weapon's damage type, the</text>
<text x="26" y="198.2" font-family="'Source Sans 3'" font-size="9" fill="#000"><tspan font-weight="700">most recent effect</tspan><tspan font-weight="400"> applies.</tspan></text>
<rect x="0" y="210.1" width="246" height="30.2" fill="#fff" stroke="#000" stroke-width="0.9" rx="2.5"/>
<circle cx="13" cy="225.2" r="6.6" fill="#000" stroke="#000" stroke-width="0.5"/>
<text x="13" y="228.5" font-weight="700" font-family="'Source Sans 3'" font-size="9" fill="#fff" text-anchor="middle">3</text>
<text x="26" y="222.8" font-family="'Source Sans 3'" font-size="9" fill="#000"><tspan font-weight="400">If a rule would both </tspan><tspan font-weight="700">replace</tspan><tspan font-weight="400"> and </tspan><tspan font-weight="700">modify</tspan><tspan font-weight="400"> damage, resolve</tspan></text>
<text x="26" y="233.4" font-weight="400" font-family="'Source Sans 3'" font-size="9" fill="#000">the replacement first, then apply modifiers.</text>
<rect x="258" y="0" width="13" height="13" fill="#000"/>
<text x="264.5" y="10.4" font-weight="700" font-family="'Source Sans 3'" font-size="9" fill="#fff" text-anchor="middle">C</text>
<text x="276" y="10.4" font-weight="700" font-family="'Source Sans 3'" font-size="9.5" fill="#000">Cross-reference and overrides</text>
<rect x="258" y="19" width="246" height="22" fill="#fff" stroke="#000" stroke-width="0.9" rx="2.5"/>
<circle cx="271" cy="30" r="6.6" fill="#000" stroke="#000" stroke-width="0.5"/>
<text x="271" y="33.3" font-weight="700" font-family="'Source Sans 3'" font-size="9" fill="#fff" text-anchor="middle">5</text>
<text x="284" y="32.9" font-family="'Source Sans 3'" font-size="9" fill="#000"><tspan font-weight="400">If a combatant is both </tspan><tspan font-weight="700">Hidden</tspan><tspan font-weight="400"> and </tspan><tspan font-weight="700">Invisible</tspan><tspan font-weight="400">, follow </tspan><tspan font-weight="700">2.8.5</tspan><tspan font-weight="400">.</tspan></text>
<rect x="258" y="46" width="246" height="119.4" fill="#fff" stroke="#000" stroke-width="0.9" rx="2.5"/>
<circle cx="271" cy="59" r="6.6" fill="#000" stroke="#000" stroke-width="0.5"/>
<text x="271" y="62.3" font-weight="700" font-family="'Source Sans 3'" font-size="9" fill="#fff" text-anchor="middle">6</text>
<rect x="284" y="51" width="214" height="31.2" fill="#000" stroke="#000" stroke-width="0.9" rx="2.5"/>
<text x="289" y="63" font-weight="700" font-family="'Source Sans 3'" font-size="9" fill="#fff">If a rule says a combatant cannot be chosen as</text>
<text x="289" y="73.6" font-weight="700" font-family="'Source Sans 3'" font-size="9" fill="#fff">the target of attacks, Powers, or Special Abilities</text>
<line x1="381" y1="83.2" x2="381" y2="93.2" stroke="#000" stroke-width="1.2" stroke-linecap="butt"/>
<polygon points="381,99.2 377.8,92.2 384.2,92.2" fill="#000"/>
<text x="389" y="95.2" font-weight="700" font-family="'Source Sans 3'" font-size="9" fill="#000">overrides</text>
<rect x="264" y="103.2" width="38.08" height="15" fill="#fff" stroke="#000" stroke-width="0.9" rx="2.5"/>
<text x="283.04" y="114" font-weight="600" font-family="'Source Sans 3'" font-size="9" fill="#000" text-anchor="middle">Hidden</text>
<rect x="306.08" y="103.2" width="42.7" height="15" fill="#fff" stroke="#000" stroke-width="0.9" rx="2.5"/>
<text x="327.43" y="114" font-weight="600" font-family="'Source Sans 3'" font-size="9" fill="#000" text-anchor="middle">Invisible</text>
<rect x="352.78" y="103.2" width="25.49" height="15" fill="#fff" stroke="#000" stroke-width="0.9" rx="2.5"/>
<text x="365.52" y="114" font-weight="600" font-family="'Source Sans 3'" font-size="9" fill="#000" text-anchor="middle">LOS</text>
<rect x="382.27" y="103.2" width="49.1" height="15" fill="#fff" stroke="#000" stroke-width="0.9" rx="2.5"/>
<text x="406.82" y="114" font-weight="600" font-family="'Source Sans 3'" font-size="9" fill="#000" text-anchor="middle">adjacency</text>
<rect x="264" y="122.2" width="157.75" height="15" fill="#fff" stroke="#000" stroke-width="0.9" rx="2.5"/>
<text x="342.88" y="133" font-weight="600" font-family="'Source Sans 3'" font-size="9" fill="#000" text-anchor="middle">rules that ignore targeting restrictions</text>
<text x="264" y="149.2" font-weight="400" font-family="'Source Sans 3'" font-size="9" fill="#000">Unless another rule explicitly says they can affect</text>
<text x="264" y="159.8" font-weight="400" font-family="'Source Sans 3'" font-size="9" fill="#000">untargetable targets.</text>
<rect x="258" y="173.4" width="13" height="13" fill="#000"/>
<text x="264.5" y="183.8" font-weight="700" font-family="'Source Sans 3'" font-size="9" fill="#fff" text-anchor="middle">D</text>
<text x="276" y="183.8" font-weight="700" font-family="'Source Sans 3'" font-size="9.5" fill="#000">Placement and Reactions</text>
<rect x="258" y="192.4" width="246" height="40.8" fill="#fff" stroke="#000" stroke-width="0.9" rx="2.5"/>
<circle cx="271" cy="212.8" r="6.6" fill="#000" stroke="#000" stroke-width="0.5"/>
<text x="271" y="216.1" font-weight="700" font-family="'Source Sans 3'" font-size="9" fill="#fff" text-anchor="middle">7</text>
<text x="284" y="205.1" font-weight="400" font-family="'Source Sans 3'" font-size="9" fill="#000">If an effect places a combatant in an illegal space, place</text>
<text x="284" y="215.7" font-weight="400" font-family="'Source Sans 3'" font-size="9" fill="#000">that combatant in the nearest legal space instead. Forced</text>
<text x="284" y="226.3" font-family="'Source Sans 3'" font-size="9" fill="#000"><tspan font-weight="400">movement follows </tspan><tspan font-weight="700">4.4.6</tspan><tspan font-weight="400">.</tspan></text>
<rect x="258" y="238.2" width="246" height="40.8" fill="#fff" stroke="#000" stroke-width="0.9" rx="2.5"/>
<circle cx="271" cy="258.6" r="6.6" fill="#000" stroke="#000" stroke-width="0.5"/>
<text x="271" y="261.9" font-weight="700" font-family="'Source Sans 3'" font-size="9" fill="#fff" text-anchor="middle">8</text>
<text x="284" y="250.9" font-family="'Source Sans 3'" font-size="9" fill="#000"><tspan font-weight="400">If an item duplicates a </tspan><tspan font-weight="700">Reaction</tspan><tspan font-weight="400"> such as </tspan><tspan font-weight="700">Block</tspan><tspan font-weight="400"> or </tspan><tspan font-weight="700">Parry</tspan><tspan font-weight="400">,</tspan></text>
<text x="284" y="261.5" font-weight="400" font-family="'Source Sans 3'" font-size="9" fill="#000">follow the item text exactly. If an item does not change</text>
<text x="284" y="272.1" font-family="'Source Sans 3'" font-size="9" fill="#000"><tspan font-weight="400">the normal </tspan><tspan font-weight="700">Reaction</tspan><tspan font-weight="400"> timing or cost, use the core rule.</tspan></text>
<text x="0" y="253.8" font-weight="400" font-family="'Source Sans 3'" font-size="9" fill="#333">Circled numbers follow the bullet order of 7.4.</text>
</svg>
