<text x="204" y="33.38" font-family="'Source Sans 3'" font-size="9" fill="#000"><tspan font-weight="700">Initiative:</tspan><tspan font-weight="400"> Road Wardens 1d20 = 13, +0 INT, +1 SPI = </tspan><tspan font-weight="700">14</tspan><tspan font-weight="400">. Black Briar Raiders</tspan></text>
<text x="204" y="44.18" font-family="'Source Sans 3'" font-size="9" fill="#000"><tspan font-weight="400">1d20 = 10, +0, +0 = </tspan><tspan font-weight="700">10</tspan><tspan font-weight="400">. The Road Wardens win and choose to act first. All Heroes</tspan></text>
<text x="204" y="54.98" font-weight="400" font-family="'Source Sans 3'" font-size="9" fill="#000">refresh to 3 AP.</text>
<text x="200" y="73.9" font-weight="700" font-family="'Source Sans 3'" font-size="9" fill="#000">Party Phase (activations alternate, Road Wardens first)</text>
<rect x="200" y="78.9" width="304" height="27.2" fill="#fff" stroke="#000" stroke-width="0.8" rx="2"/>
<text x="204" y="89.9" font-weight="700" font-family="'Source Sans 3'" font-size="9" fill="#000">1 Edric</text>
<text x="250" y="88.9" font-weight="400" font-family="'Source Sans 3'" font-size="9" fill="#000">Move, Move, Interact: picks up the Dispatch Satchel.</text>
<text x="250" y="99.5" font-weight="400" font-family="'Source Sans 3'" font-size="9" fill="#000">With 0 AP left he cannot take Reactions this round.</text>
