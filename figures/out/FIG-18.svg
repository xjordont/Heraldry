<line x1="490" y1="119.1" x2="495" y2="114.1" stroke="#000" stroke-width="0.9" stroke-linecap="butt"/>
<rect x="200" y="147.9" width="304" height="27.2" fill="#fff" stroke="#000" stroke-width="0.8" rx="2"/>
<text x="204" y="158.9" font-weight="700" font-family="'Source Sans 3'" font-size="9" fill="#000">3 Mara</text>
<text x="250" y="157.9" font-weight="400" font-family="'Source Sans 3'" font-size="9" fill="#000">Move, Attack with Shortbow: 1d6 = 4, +3 DEX = 7. Dire</text>
<text x="250" y="168.5" font-weight="400" font-family="'Source Sans 3'" font-size="9" fill="#000">Wolf 3 has AV 1: 7 − 1 = 6 (15 → 9 HP). Keeps 1 AP.</text>
<rect x="464" y="151.9" width="9" height="9" fill="#fff" stroke="#000" stroke-width="1"/>
<line x1="466" y1="153.9" x2="471" y2="158.9" stroke="#000" stroke-width="0.9" stroke-linecap="butt"/>
<line x1="466" y1="158.9" x2="471" y2="153.9" stroke="#000" stroke-width="0.9" stroke-linecap="butt"/>
<rect x="476" y="151.9" width="9" height="9" fill="#fff" stroke="#000" stroke-width="1"/>
<line x1="478" y1="153.9" x2="483" y2="158.9" stroke="#000" stroke-width="0.9" stroke-linecap="butt"/>
<line x1="478" y1="158.9" x2="483" y2="153.9" stroke="#000" stroke-width="0.9" stroke-linecap="butt"/>
<rect x="488" y="151.9" width="9" height="9" fill="#000" stroke="#000" stroke-width="0.8"/>
<rect x="200" y="177.1" width="304" height="48.4" fill="#fff" stroke="#000" stroke-width="0.8" rx="2"/>
<text x="204" y="188.1" font-weight="700" font-family="'Source Sans 3'" font-size="9" fill="#000">4 Senna</text>
<text x="250" y="187.1" font-weight="400" font-family="'Source Sans 3'" font-size="9" fill="#000">Move, Attack with Shortbow: 1d6 = 5, +3 DEX = 8. Mara</text>
<text x="250" y="197.7" font-weight="400" font-family="'Source Sans 3'" font-size="9" fill="#000">declares Dodge [1 AP]: 1d20 = 11, +3 DEX = 14. A Check</text>
<text x="250" y="208.3" font-weight="400" font-family="'Source Sans 3'" font-size="9" fill="#000">of 12 or more succeeds: Mara takes 0 (her 3 AP are</text>
<text x="250" y="218.9" font-weight="400" font-family="'Source Sans 3'" font-size="9" fill="#000">spent). Senna keeps 1 AP.</text>
<rect x="464" y="181.1" width="9" height="9" fill="#fff" stroke="#000" stroke-width="1"/>
<line x1="466" y1="183.1" x2="471" y2="188.1" stroke="#000" stroke-width="0.9" stroke-linecap="butt"/>
<line x1="466" y1="188.1" x2="471" y2="183.1" stroke="#000" stroke-width="0.9" stroke-linecap="butt"/>
<rect x="476" y="181.1" width="9" height="9" fill="#fff" stroke="#000" stroke-width="1"/>
<line x1="478" y1="183.1" x2="483" y2="188.1" stroke="#000" stroke-width="0.9" stroke-linecap="butt"/>
<line x1="478" y1="188.1" x2="483" y2="183.1" stroke="#000" stroke-width="0.9" stroke-linecap="butt"/>
<rect x="488" y="181.1" width="9" height="9" fill="#000" stroke="#000" stroke-width="0.8"/>
<text x="200" y="238.5" font-weight="700" font-family="'Source Sans 3'" font-size="9" fill="#000">Monster Phase (Dire Wolves 1 to 4 in order; Edric carries the Satchel)</text>
<rect x="200" y="243.5" width="304" height="27.2" fill="#fff" stroke="#000" stroke-width="0.8" rx="2"/>
<text x="204" y="254.5" font-weight="700" font-family="'Source Sans 3'" font-size="9" fill="#000">Wolf 1</text>
<text x="258" y="253.5" font-weight="400" font-family="'Source Sans 3'" font-size="9" fill="#000">Moves into Engagement with Edric and Bites: 1d8 = 5, +1 = 6. AD</text>
<text x="258" y="264.1" font-weight="400" font-family="'Source Sans 3'" font-size="9" fill="#000">d8 = 3: Edric takes 3 (11 → 8 HP). STR Check 9 + 3 = 12 succeeds.</text>
<rect x="200" y="272.7" width="304" height="27.2" fill="#fff" stroke="#000" stroke-width="0.8" rx="2"/>
<text x="204" y="283.7" font-weight="700" font-family="'Source Sans 3'" font-size="9" fill="#000">Wolf 2</text>
<text x="258" y="282.7" font-weight="400" font-family="'Source Sans 3'" font-size="9" fill="#000">Pack Tactics (Advantage): 4 and 7, keep 7, +1 = 8. AD d8 = 5:</text>
<text x="258" y="293.3" font-weight="400" font-family="'Source Sans 3'" font-size="9" fill="#000">Edric takes 3 (8 → 5 HP). STR Check 6 + 3 = 9 fails: Edric is Prone.</text>
<rect x="200" y="301.9" width="304" height="27.2" fill="#fff" stroke="#000" stroke-width="0.8" rx="2"/>
<text x="204" y="312.9" font-weight="700" font-family="'Source Sans 3'" font-size="9" fill="#000">Wolves 3, 4</text>
<text x="258" y="311.9" font-weight="400" font-family="'Source Sans 3'" font-size="9" fill="#000">No open space from which to engage Edric: they end as close as</text>
<text x="258" y="322.5" font-weight="400" font-family="'Source Sans 3'" font-size="9" fill="#000">possible and do not attack.</text>
<rect x="200" y="333.1" width="304" height="28.1" fill="#f0f0f0" stroke="#000" stroke-width="0.7" rx="2.5"/>
<text x="204" y="344.48" font-family="'Source Sans 3'" font-size="9" fill="#000"><tspan font-weight="700">End of Round:</tspan><tspan font-weight="400"> Senna's 1 unspent AP is removed. Edric: 5 HP, Prone, carrying</tspan></text>
<text x="204" y="355.28" font-weight="400" font-family="'Source Sans 3'" font-size="9" fill="#000">the Satchel, Engaged by Varek and Dire Wolves 1 and 2.</text>
<text x="200" y="373.2" font-weight="700" font-family="'Source Sans 3'" font-size="9" fill="#000">AP squares:</text>
<rect x="256" y="364.7" width="9" height="9" fill="#000" stroke="#000" stroke-width="0.8"/>
<text x="268" y="373.2" font-weight="400" font-family="'Source Sans 3'" font-size="9" fill="#000">unspent after activation</text>
<rect x="370" y="364.7" width="9" height="9" fill="#fff" stroke="#000" stroke-width="1"/>
<line x1="372" y1="366.7" x2="377" y2="371.7" stroke="#000" stroke-width="0.9" stroke-linecap="butt"/>
<line x1="372" y1="371.7" x2="377" y2="366.7" stroke="#000" stroke-width="0.9" stroke-linecap="butt"/>
<text x="382" y="373.2" font-weight="400" font-family="'Source Sans 3'" font-size="9" fill="#000">spent</text>
