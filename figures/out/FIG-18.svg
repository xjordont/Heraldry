<line x1="490" y1="89.9" x2="495" y2="84.9" stroke="#000" stroke-width="0.9" stroke-linecap="butt"/>
<rect x="200" y="108.1" width="304" height="37.8" fill="#fff" stroke="#000" stroke-width="0.8" rx="2"/>
<text x="204" y="119.1" font-weight="700" font-family="'Source Sans 3'" font-size="9" fill="#000">2 Varek</text>
<text x="250" y="118.1" font-weight="400" font-family="'Source Sans 3'" font-size="9" fill="#000">Move, Move (Engaged with Edric), Attack with Battleaxe:</text>
<text x="250" y="128.7" font-weight="400" font-family="'Source Sans 3'" font-size="9" fill="#000">1d8 = 6, +3 STR = 9. Edric's Brigandine AD d8 = 4, so</text>
<text x="250" y="139.3" font-weight="400" font-family="'Source Sans 3'" font-size="9" fill="#000">Edric takes 9 − 4 = 5 (16 → 11 HP).</text>
