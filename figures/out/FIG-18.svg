<text x="4" y="213.4" font-weight="400" font-family="'Source Sans 3'" font-size="9" fill="#000">enlarged. Positions are those of the A.11 table. The</text>
<text x="4" y="223.8" font-weight="400" font-family="'Source Sans 3'" font-size="9" fill="#000">terrain of A.2 is not drawn.</text>
