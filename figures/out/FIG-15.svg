<svg xmlns="http://www.w3.org/2000/svg" width="504pt" height="328pt" viewBox="0 0 504 328">
<title>The Chasm Crossing: ledges and objective placement</title>
<desc>Show where the Survey Map, ledges, Chasm and Cartographer's Stone sit relative to the shared deployment edge, and how Jump applies to ledge gaps.</desc>
<defs>
<pattern id="p-cover" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="5" height="5" fill="#fff"/><path d="M0 0.5H5M0.5 0V5" stroke="#444" stroke-width="0.7" fill="none"/></pattern>
<pattern id="p-diff" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="4" height="4" fill="#fff"/><circle cx="1" cy="1" r="0.75" fill="#222"/><circle cx="3" cy="3" r="0.75" fill="#222"/></pattern>
<pattern id="p-imp" width="2.4" height="2.4" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="2.4" height="2.4" fill="#fff"/><path d="M0.4 0V2.4" stroke="#000" stroke-width="0.95" fill="none"/></pattern>
<pattern id="p-mon" width="3.2" height="3.2" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)"><rect width="3.2" height="3.2" fill="#fff"/><path d="M0.5 0V3.2" stroke="#000" stroke-width="1" fill="none"/></pattern>
<pattern id="p-aoe" width="4" height="4" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)"><rect width="4" height="4" fill="#fff"/><path d="M0.5 0V4" stroke="#777" stroke-width="1.4" fill="none"/></pattern>
</defs>
<rect x="0" y="0" width="13" height="13" fill="#000"/>
<text x="6.5" y="10.4" font-weight="700" font-family="'Source Sans 3'" font-size="9" fill="#fff" text-anchor="middle">A</text>
<text x="18" y="10.4" font-weight="700" font-family="'Source Sans 3'" font-size="9.5" fill="#000">The Chasm Crossing</text>
<rect x="4" y="26" width="154.8" height="154.8" fill="#fff" stroke="#000" stroke-width="1.1"/>
<rect x="4" y="26" width="154.8" height="34.4" fill="#f0f0f0" stroke="#000" stroke-width="0.9" stroke-dasharray="3.5 2"/>
<rect x="4" y="86.2" width="154.8" height="34.4" fill="url(#p-imp)" stroke="#000" stroke-width="0.9"/>
<rect x="77.9" y="86.5" width="7" height="5" fill="#fff" stroke="#000" stroke-width="1.3"/>
<rect x="77.9" y="96.1" width="7" height="5" fill="#fff" stroke="#000" stroke-width="1.3" stroke-dasharray="2.5 1.8"/>
<rect x="77.9" y="105.7" width="7" height="5" fill="#fff" stroke="#000" stroke-width="1.3"/>
<rect x="77.9" y="115.3" width="7" height="5" fill="#fff" stroke="#000" stroke-width="1.3"/>
<rect x="90.6" y="95.58" width="61.89" height="10.89" fill="#fff"/>
<text x="92.4" y="103.5" font-weight="700" font-family="'Source Sans 3'" font-size="9" fill="#000">Path of Ledges</text>
<rect x="7.2" y="98.88" width="62.89" height="10.89" fill="#fff"/>
<text x="9" y="106.8" font-weight="700" font-family="'Source Sans 3'" font-size="9" fill="#000">Chasm 8" wide</text>
<circle cx="25.5" cy="38.9" r="3.8" fill="#000" stroke="#000" stroke-width="0.75"/>
<circle cx="44.85" cy="38.9" r="3.8" fill="#000" stroke="#000" stroke-width="0.75"/>
<circle cx="109.35" cy="38.9" r="3.8" fill="#fff" stroke="#000" stroke-width="1.4"/>
<circle cx="109.35" cy="38.9" r="1.6" fill="#000"/>
<circle cx="128.7" cy="38.9" r="3.8" fill="#fff" stroke="#000" stroke-width="1.4"/>
<circle cx="128.7" cy="38.9" r="1.6" fill="#000"/>
<polygon points="81.4,68.3 86.4,73.3 81.4,78.3 76.4,73.3" fill="#fff" stroke="#000" stroke-width="1.2" stroke-linejoin="round"/>
<line x1="78.9" y1="73.3" x2="83.9" y2="73.3" stroke="#000" stroke-width="1" stroke-linecap="butt"/>
<line x1="81.4" y1="70.8" x2="81.4" y2="75.8" stroke="#000" stroke-width="1" stroke-linecap="butt"/>
<polygon points="81.4,128.5 86.4,133.5 81.4,138.5 76.4,133.5" fill="#fff" stroke="#000" stroke-width="1.2" stroke-linejoin="round"/>
<line x1="78.9" y1="133.5" x2="83.9" y2="133.5" stroke="#000" stroke-width="1" stroke-linecap="butt"/>
<line x1="81.4" y1="131" x2="81.4" y2="136" stroke="#000" stroke-width="1" stroke-linecap="butt"/>
<rect x="88.6" y="68.78" width="49.91" height="10.89" fill="#fff"/>
<text x="90.4" y="76.7" font-weight="700" font-family="'Source Sans 3'" font-size="9" fill="#000">Survey Map</text>
<rect x="88.6" y="124.58" width="63.96" height="10.89" fill="#fff"/>
<text x="90.4" y="132.5" font-weight="700" font-family="'Source Sans 3'" font-size="9" fill="#000">Cartographer's</text>
<rect x="88.6" y="134.98" width="26.86" height="10.89" fill="#fff"/>
<text x="90.4" y="142.9" font-weight="700" font-family="'Source Sans 3'" font-size="9" fill="#000">Stone</text>
<line x1="67.4" y1="73.3" x2="67.4" y2="86.2" stroke="#000" stroke-width="0.8" stroke-linecap="butt"/>
<polygon points="67.4,73.3 69,76.9 65.8,76.9" fill="#000"/>
<line x1="70.2" y1="73.3" x2="64.6" y2="73.3" stroke="#000" stroke-width="0.8" stroke-linecap="butt"/>
<polygon points="67.4,86.2 65.8,82.6 69,82.6" fill="#000"/>
<line x1="64.6" y1="86.2" x2="70.2" y2="86.2" stroke="#000" stroke-width="0.8" stroke-linecap="butt"/>
<rect x="52.01" y="75.03" width="13.19" height="10.89" fill="#fff"/>
<text x="53.81" y="82.95" font-weight="700" font-family="'Source Sans 3'" font-size="9" fill="#000">3"</text>
<line x1="67.4" y1="120.6" x2="67.4" y2="133.5" stroke="#000" stroke-width="0.8" stroke-linecap="butt"/>
<polygon points="67.4,120.6 69,124.2 65.8,124.2" fill="#000"/>
<line x1="70.2" y1="120.6" x2="64.6" y2="120.6" stroke="#000" stroke-width="0.8" stroke-linecap="butt"/>
<polygon points="67.4,133.5 65.8,129.9 69,129.9" fill="#000"/>
<line x1="64.6" y1="133.5" x2="70.2" y2="133.5" stroke="#000" stroke-width="0.8" stroke-linecap="butt"/>
<rect x="52.01" y="122.33" width="13.19" height="10.89" fill="#fff"/>
<text x="53.81" y="130.25" font-weight="700" font-family="'Source Sans 3'" font-size="9" fill="#000">3"</text>
<rect x="116.95" y="51.17" width="39.65" height="10.89" fill="#fff"/>
<text x="118.75" y="59.09" font-weight="600" font-family="'Source Sans 3'" font-size="9" fill="#000">start side</text>
<rect x="104.06" y="151.38" width="52.54" height="10.89" fill="#fff"/>
<text x="105.86" y="159.3" font-weight="600" font-family="'Source Sans 3'" font-size="9" fill="#000">delivery side</text>
<text x="158.8" y="192.8" font-weight="600" font-family="'Source Sans 3'" font-size="9" fill="#333" text-anchor="end">Schematic — not to scale</text>
<rect x="180.8" y="0" width="13" height="13" fill="#000"/>
<text x="187.3" y="10.4" font-weight="700" font-family="'Source Sans 3'" font-size="9" fill="#fff" text-anchor="middle">B</text>
<text x="198.8" y="10.4" font-weight="700" font-family="'Source Sans 3'" font-size="9.5" fill="#000">Reading the placement</text>
<circle cx="187.4" cy="29" r="6.6" fill="#000" stroke="#000" stroke-width="0.5"/>
<text x="187.4" y="32.3" font-weight="700" font-family="'Source Sans 3'" font-size="9" fill="#fff" text-anchor="middle">1</text>
<text x="200" y="30" font-family="'Source Sans 3'" font-size="9" fill="#000"><tspan font-weight="700">Deployment:</tspan><tspan font-weight="400"> both parties use the start-side short edge, within 8" of it; no Hero</tspan></text>
<text x="200" y="40.5" font-weight="400" font-family="'Source Sans 3'" font-size="9" fill="#000">within 6" of an opposing Hero.</text>
<circle cx="187.4" cy="55" r="6.6" fill="#000" stroke="#000" stroke-width="0.5"/>
<text x="187.4" y="58.3" font-weight="700" font-family="'Source Sans 3'" font-size="9" fill="#fff" text-anchor="middle">2</text>
<text x="200" y="56" font-family="'Source Sans 3'" font-size="9" fill="#000"><tspan font-weight="700">Survey Map:</tspan><tspan font-weight="400"> a carried objective that starts on the start side, 3" from the first</tspan></text>
<text x="200" y="66.5" font-weight="400" font-family="'Source Sans 3'" font-size="9" fill="#000">ledge. Its carrier's Speed is reduced by 1" while carrying it.</text>
<circle cx="187.4" cy="81" r="6.6" fill="#000" stroke="#000" stroke-width="0.5"/>
<text x="187.4" y="84.3" font-weight="700" font-family="'Source Sans 3'" font-size="9" fill="#fff" text-anchor="middle">3</text>
<text x="200" y="82" font-family="'Source Sans 3'" font-size="9" fill="#000"><tspan font-weight="700">Path of Ledges:</tspan><tspan font-weight="400"> 3–4 narrow (1" wide) platform markers bridging the Chasm, with</tspan></text>
<text x="200" y="92.5" font-weight="400" font-family="'Source Sans 3'" font-size="9" fill="#000">1–2" gaps that require a Jump. 1–2 ledges are marked Crumbling: a Hero ending</text>
<text x="200" y="103" font-weight="400" font-family="'Source Sans 3'" font-size="9" fill="#000">an activation on one makes a DEX Check and falls on a failure.</text>
<circle cx="187.4" cy="117.5" r="6.6" fill="#000" stroke="#000" stroke-width="0.5"/>
<text x="187.4" y="120.8" font-weight="700" font-family="'Source Sans 3'" font-size="9" fill="#fff" text-anchor="middle">4</text>
<text x="200" y="118.5" font-family="'Source Sans 3'" font-size="9" fill="#000"><tspan font-weight="700">Cartographer's Stone:</tspan><tspan font-weight="400"> a 1" marker on the delivery side, 3" from the last ledge.</tspan></text>
<text x="200" y="129" font-weight="400" font-family="'Source Sans 3'" font-size="9" fill="#000">The first party to place the Survey Map adjacent to it wins immediately.</text>
<circle cx="187.4" cy="143.5" r="6.6" fill="#000" stroke="#000" stroke-width="0.5"/>
<text x="187.4" y="146.8" font-weight="700" font-family="'Source Sans 3'" font-size="9" fill="#fff" text-anchor="middle">5</text>
<text x="200" y="144.5" font-family="'Source Sans 3'" font-size="9" fill="#000"><tspan font-weight="700">Jumping the Gaps (4.4.9):</tspan><tspan font-weight="400"> each 1" jumped costs 2" of movement; declare a</tspan></text>
<text x="200" y="155" font-weight="400" font-family="'Source Sans 3'" font-size="9" fill="#000">landing point, then make a DEX Check. A failed Jump into the Chasm causes a</text>
<text x="200" y="165.5" font-weight="400" font-family="'Source Sans 3'" font-size="9" fill="#000">Chasm Fall (panel C).</text>
<text x="180.8" y="185" font-weight="700" font-family="'Source Sans 3'" font-size="9" fill="#000">Key</text>
<circle cx="212.68" cy="185" r="6" fill="#000" stroke="#000" stroke-width="0.75"/>
<text x="229.68" y="188" font-weight="400" font-family="'Source Sans 3'" font-size="9" fill="#000">Party A</text>
<circle cx="275.36" cy="185" r="6" fill="#fff" stroke="#000" stroke-width="1.4"/>
<circle cx="275.36" cy="185" r="1.68" fill="#000"/>
<text x="292.36" y="188" font-weight="400" font-family="'Source Sans 3'" font-size="9" fill="#000">Party B</text>
<rect x="330.45" y="179.5" width="17" height="11" fill="#f0f0f0" stroke="#000" stroke-width="0.8" stroke-dasharray="3 2"/>
<text x="355.45" y="188" font-weight="400" font-family="'Source Sans 3'" font-size="9" fill="#000">deployment zone</text>
<rect x="433.06" y="179.5" width="16" height="11" fill="url(#p-imp)" stroke="#000" stroke-width="0.8"/>
<text x="457.06" y="188" font-weight="400" font-family="'Source Sans 3'" font-size="9" fill="#000">Chasm</text>
<polygon points="189.8,194 195.8,200 189.8,206 183.8,200" fill="#fff" stroke="#000" stroke-width="1.2" stroke-linejoin="round"/>
<line x1="186.8" y1="200" x2="192.8" y2="200" stroke="#000" stroke-width="1" stroke-linecap="butt"/>
<line x1="189.8" y1="197" x2="189.8" y2="203" stroke="#000" stroke-width="1" stroke-linecap="butt"/>
<text x="206.8" y="203" font-weight="400" font-family="'Source Sans 3'" font-size="9" fill="#000">objective</text>
<rect x="254.37" y="194" width="12" height="12" fill="#fff" stroke="#000" stroke-width="0.6"/>
<text x="277.37" y="203" font-weight="400" font-family="'Source Sans 3'" font-size="9" fill="#000">ledge (dashed = Crumbling)</text>
<rect x="0" y="213" width="13" height="13" fill="#000"/>
<text x="6.5" y="223.4" font-weight="700" font-family="'Source Sans 3'" font-size="9" fill="#fff" text-anchor="middle">C</text>
<text x="18" y="223.4" font-weight="700" font-family="'Source Sans 3'" font-size="9.5" fill="#000">Chasm Fall (Undermarches 2 Special Rules)</text>
<circle cx="6.6" cy="240" r="6.6" fill="#000" stroke="#000" stroke-width="0.5"/>
<text x="6.6" y="243.3" font-weight="700" font-family="'Source Sans 3'" font-size="9" fill="#fff" text-anchor="middle">6</text>
<text x="19.2" y="241" font-family="'Source Sans 3'" font-size="9" fill="#000"><tspan font-weight="700">Chasm Fall:</tspan><tspan font-weight="400"> a combatant Pushed off a Ledge into the Chasm, or that fails a Crumbling Ledge Check and falls, is immediately</tspan></text>
<text x="19.2" y="251.5" font-weight="400" font-family="'Source Sans 3'" font-size="9" fill="#000">removed from play. A Hero is Defeated and makes a normal Injuries Roll. A non-Hero is resolved as though reduced to 0 HP. This</text>
<text x="19.2" y="262" font-weight="400" font-family="'Source Sans 3'" font-size="9" fill="#000">replaces the normal Falling rule. Any carried items, including the Survey Map, fall into the Chasm and are lost.</text>
<circle cx="6.6" cy="275.5" r="6.6" fill="#000" stroke="#000" stroke-width="0.5"/>
<text x="6.6" y="278.8" font-weight="700" font-family="'Source Sans 3'" font-size="9" fill="#fff" text-anchor="middle">7</text>
<text x="19.2" y="276.5" font-family="'Source Sans 3'" font-size="9" fill="#000"><tspan font-weight="700">Hero or Hireling with a Fly or Climb Speed</tspan><tspan font-weight="400"> that would fall may immediately spend 1 unspent AP, including AP reserved for</tspan></text>
<text x="19.2" y="287" font-weight="400" font-family="'Source Sans 3'" font-size="9" fill="#000">Reactions, to catch themselves. Place them Prone in the nearest legal space on a Ledge, and end their current movement. If they</text>
<text x="19.2" y="297.5" font-weight="400" font-family="'Source Sans 3'" font-size="9" fill="#000">cannot spend the AP, resolve the Chasm Fall normally.</text>
<circle cx="6.6" cy="311" r="6.6" fill="#000" stroke="#000" stroke-width="0.5"/>
<text x="6.6" y="314.3" font-weight="700" font-family="'Source Sans 3'" font-size="9" fill="#fff" text-anchor="middle">8</text>
<text x="19.2" y="312" font-family="'Source Sans 3'" font-size="9" fill="#000"><tspan font-weight="700">Monster with a Fly or Climb Speed</tspan><tspan font-weight="400"> that would fall is placed Prone in the nearest legal space on a Ledge, and their activation</tspan></text>
<text x="19.2" y="322.5" font-weight="400" font-family="'Source Sans 3'" font-size="9" fill="#000">ends.</text>
</svg>
