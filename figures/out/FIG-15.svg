<svg xmlns="http://www.w3.org/2000/svg" width="504pt" height="266.5pt" viewBox="0 0 504 266.5">
<title>The Chasm Crossing: ledges and objective placement</title>
<desc>Show where the Survey Map, ledges, Chasm and Cartographer's Stone sit relative to the shared deployment edge, and how Jump applies to ledge gaps.</desc>
<defs>
<pattern id="p-cover" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="5" height="5" fill="#fff"/><path d="M0 0.5H5M0.5 0V5" stroke="#444" stroke-width="0.7" fill="none"/></pattern>
<pattern id="p-diff" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="4" height="4" fill="#fff"/><circle cx="1" cy="1" r="0.75" fill="#222"/><circle cx="3" cy="3" r="0.75" fill="#222"/></pattern>
<pattern id="p-imp" width="2.4" height="2.4" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="2.4" height="2.4" fill="#fff"/><path d="M0.4 0V2.4" stroke="#000" stroke-width="0.95" fill="none"/></pattern>
<pattern id="p-mon" width="3.2" height="3.2" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)"><rect width="3.2" height="3.2" fill="#fff"/><path d="M0.5 0V3.2" stroke="#000" stroke-width="1" fill="none"/></pattern>
<pattern id="p-aoe" width="4" height="4" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)"><rect width="4" height="4" fill="#fff"/><path d="M0.5 0V4" stroke="#777" stroke-width="1.4" fill="none"/></pattern>
</defs>
<rect x="0" y="0" width="13" height="13" fill="#000"/>
<text x="6.5" y="10.4" font-weight="700" font-family="'Source Sans 3'" font-size="9" fill="#fff" text-anchor="middle">A</text>
<text x="18" y="10.4" font-weight="700" font-family="'Source Sans 3'" font-size="9.5" fill="#000">The Chasm Crossing (10.4, Undermarches 2)</text>
<rect x="4" y="26" width="194.4" height="194.4" fill="#fff" stroke="#000" stroke-width="1.1"/>
<rect x="4" y="26" width="194.4" height="43.2" fill="#f0f0f0" stroke="#000" stroke-width="0.9" stroke-dasharray="3.5 2"/>
<rect x="4" y="101.6" width="194.4" height="43.2" fill="url(#p-imp)" stroke="#000" stroke-width="0.9"/>
<rect x="96.7" y="101.6" width="9" height="7" fill="#fff" stroke="#000" stroke-width="1.3"/>
<rect x="96.7" y="113.6" width="9" height="7" fill="#fff" stroke="#000" stroke-width="1.3" stroke-dasharray="2.5 1.8"/>
<rect x="96.7" y="125.6" width="9" height="7" fill="#fff" stroke="#000" stroke-width="1.3"/>
<rect x="96.7" y="137.6" width="9" height="7" fill="#fff" stroke="#000" stroke-width="1.3"/>
<rect x="116.25" y="114.68" width="61.89" height="10.89" fill="#fff"/>
<text x="118.05" y="122.6" font-weight="700" font-family="'Source Sans 3'" font-size="9" fill="#000">Path of Ledges</text>
<circle cx="36.4" cy="42.2" r="4.5" fill="#000" stroke="#000" stroke-width="0.75"/>
<circle cx="63.4" cy="42.2" r="4.5" fill="#000" stroke="#000" stroke-width="0.75"/>
<circle cx="117.4" cy="42.2" r="4.5" fill="#fff" stroke="#000" stroke-width="1.4"/>
<circle cx="117.4" cy="42.2" r="1.6" fill="#000"/>
<circle cx="144.4" cy="42.2" r="4.5" fill="#fff" stroke="#000" stroke-width="1.4"/>
<circle cx="144.4" cy="42.2" r="1.6" fill="#000"/>
<polygon points="101.2,79.8 106.8,85.4 101.2,91 95.6,85.4" fill="#fff" stroke="#000" stroke-width="1.2" stroke-linejoin="round"/>
<line x1="98.4" y1="85.4" x2="104" y2="85.4" stroke="#000" stroke-width="1" stroke-linecap="butt"/>
<line x1="101.2" y1="82.6" x2="101.2" y2="88.2" stroke="#000" stroke-width="1" stroke-linecap="butt"/>
<polygon points="101.2,155.4 106.8,161 101.2,166.6 95.6,161" fill="#fff" stroke="#000" stroke-width="1.2" stroke-linejoin="round"/>
<line x1="98.4" y1="161" x2="104" y2="161" stroke="#000" stroke-width="1" stroke-linecap="butt"/>
<line x1="101.2" y1="158.2" x2="101.2" y2="163.8" stroke="#000" stroke-width="1" stroke-linecap="butt"/>
<rect x="112.24" y="80.88" width="49.91" height="10.89" fill="#fff"/>
<text x="114.04" y="88.8" font-weight="700" font-family="'Source Sans 3'" font-size="9" fill="#000">Survey Map</text>
<rect x="108.69" y="156.48" width="89.02" height="10.89" fill="#fff"/>
<text x="110.49" y="164.4" font-weight="700" font-family="'Source Sans 3'" font-size="9" fill="#000">Cartographer's Stone</text>
<line x1="83.2" y1="85.4" x2="83.2" y2="101.6" stroke="#000" stroke-width="0.8" stroke-linecap="butt"/>
<line x1="80.7" y1="85.4" x2="85.7" y2="85.4" stroke="#000" stroke-width="0.8" stroke-linecap="butt"/>
<line x1="80.7" y1="101.6" x2="85.7" y2="101.6" stroke="#000" stroke-width="0.8" stroke-linecap="butt"/>
<rect x="76.61" y="88.78" width="13.19" height="10.89" fill="#fff"/>
<text x="78.41" y="96.7" font-weight="700" font-family="'Source Sans 3'" font-size="9" fill="#000">3"</text>
<line x1="83.2" y1="141.02" x2="83.2" y2="161" stroke="#000" stroke-width="0.8" stroke-linecap="butt"/>
<line x1="80.7" y1="141.02" x2="85.7" y2="141.02" stroke="#000" stroke-width="0.8" stroke-linecap="butt"/>
<line x1="80.7" y1="161" x2="85.7" y2="161" stroke="#000" stroke-width="0.8" stroke-linecap="butt"/>
<rect x="76.61" y="146.29" width="13.19" height="10.89" fill="#fff"/>
<text x="78.41" y="154.21" font-weight="700" font-family="'Source Sans 3'" font-size="9" fill="#000">3"</text>
<rect x="12.55" y="118.68" width="62.89" height="10.89" fill="#fff"/>
<text x="14.35" y="126.6" font-weight="700" font-family="'Source Sans 3'" font-size="9" fill="#000">Chasm 8" wide</text>
<rect x="144.57" y="52.1" width="39.65" height="10.89" fill="#fff"/>
<text x="146.37" y="60.02" font-weight="600" font-family="'Source Sans 3'" font-size="9" fill="#000">start side</text>
<rect x="132.13" y="185.48" width="52.54" height="10.89" fill="#fff"/>
<text x="133.93" y="193.4" font-weight="600" font-family="'Source Sans 3'" font-size="9" fill="#000">delivery side</text>
<text x="198.4" y="232.4" font-weight="600" font-family="'Source Sans 3'" font-size="9" fill="#333" text-anchor="end">Schematic — not to scale</text>
<rect x="220.4" y="0" width="13" height="13" fill="#000"/>
<text x="226.9" y="10.4" font-weight="700" font-family="'Source Sans 3'" font-size="9" fill="#fff" text-anchor="middle">B</text>
<text x="238.4" y="10.4" font-weight="700" font-family="'Source Sans 3'" font-size="9.5" fill="#000">Reading the placement</text>
<circle cx="227" cy="29" r="6.6" fill="#000" stroke="#000" stroke-width="0.5"/>
<text x="227" y="32.3" font-weight="700" font-family="'Source Sans 3'" font-size="9" fill="#fff" text-anchor="middle">1</text>
<text x="239.6" y="30" font-family="'Source Sans 3'" font-size="9" fill="#000"><tspan font-weight="700">Deployment:</tspan><tspan font-weight="400"> both parties use the start-side short edge, within 8" of it;</tspan></text>
<text x="239.6" y="40.5" font-weight="400" font-family="'Source Sans 3'" font-size="9" fill="#000">no Hero within 6" of an opposing Hero.</text>
<circle cx="227" cy="55" r="6.6" fill="#000" stroke="#000" stroke-width="0.5"/>
<text x="227" y="58.3" font-weight="700" font-family="'Source Sans 3'" font-size="9" fill="#fff" text-anchor="middle">2</text>
<text x="239.6" y="56" font-family="'Source Sans 3'" font-size="9" fill="#000"><tspan font-weight="700">Survey Map:</tspan><tspan font-weight="400"> a carried objective that starts on the start side, 3" from</tspan></text>
<text x="239.6" y="66.5" font-weight="400" font-family="'Source Sans 3'" font-size="9" fill="#000">the first ledge. Its carrier's Speed is reduced by 1" while carrying it.</text>
<circle cx="227" cy="81" r="6.6" fill="#000" stroke="#000" stroke-width="0.5"/>
<text x="227" y="84.3" font-weight="700" font-family="'Source Sans 3'" font-size="9" fill="#fff" text-anchor="middle">3</text>
<text x="239.6" y="82" font-family="'Source Sans 3'" font-size="9" fill="#000"><tspan font-weight="700">Path of Ledges:</tspan><tspan font-weight="400"> 3–4 narrow (1" wide) platform markers bridging the</tspan></text>
<text x="239.6" y="92.5" font-weight="400" font-family="'Source Sans 3'" font-size="9" fill="#000">Chasm, with 1–2" gaps that require a Jump. 1–2 ledges are marked</text>
<text x="239.6" y="103" font-weight="400" font-family="'Source Sans 3'" font-size="9" fill="#000">Crumbling: a Hero ending an activation on one makes a DEX Check</text>
<text x="239.6" y="113.5" font-weight="400" font-family="'Source Sans 3'" font-size="9" fill="#000">and falls on a failure.</text>
<circle cx="227" cy="128" r="6.6" fill="#000" stroke="#000" stroke-width="0.5"/>
<text x="227" y="131.3" font-weight="700" font-family="'Source Sans 3'" font-size="9" fill="#fff" text-anchor="middle">4</text>
<text x="239.6" y="129" font-family="'Source Sans 3'" font-size="9" fill="#000"><tspan font-weight="700">Cartographer's Stone:</tspan><tspan font-weight="400"> a 1" marker on the delivery side, 3" from the</tspan></text>
<text x="239.6" y="139.5" font-weight="400" font-family="'Source Sans 3'" font-size="9" fill="#000">last ledge. The first party to place the Survey Map adjacent to it wins</text>
<text x="239.6" y="150" font-weight="400" font-family="'Source Sans 3'" font-size="9" fill="#000">immediately.</text>
<circle cx="227" cy="164.5" r="6.6" fill="#000" stroke="#000" stroke-width="0.5"/>
<text x="227" y="167.8" font-weight="700" font-family="'Source Sans 3'" font-size="9" fill="#fff" text-anchor="middle">5</text>
<text x="239.6" y="165.5" font-family="'Source Sans 3'" font-size="9" fill="#000"><tspan font-weight="700">Jumping the Gaps (4.4.9):</tspan><tspan font-weight="400"> each 1" jumped costs 2" of movement;</tspan></text>
<text x="239.6" y="176" font-weight="400" font-family="'Source Sans 3'" font-size="9" fill="#000">declare a landing point, then make a DEX Check. A failed Jump into</text>
<text x="239.6" y="186.5" font-weight="400" font-family="'Source Sans 3'" font-size="9" fill="#000">the Chasm causes a Chasm Fall: the combatant is immediately</text>
<text x="239.6" y="197" font-weight="400" font-family="'Source Sans 3'" font-size="9" fill="#000">removed from play (a Hero is Defeated and makes a normal Injuries</text>
<text x="239.6" y="207.5" font-weight="400" font-family="'Source Sans 3'" font-size="9" fill="#000">Roll), any carried items including the Survey Map are lost, and this</text>
<text x="239.6" y="218" font-weight="400" font-family="'Source Sans 3'" font-size="9" fill="#000">replaces the normal Falling rule.</text>
<text x="220.4" y="237.5" font-weight="700" font-family="'Source Sans 3'" font-size="9" fill="#000">Key</text>
<circle cx="252.28" cy="237.5" r="6" fill="#000" stroke="#000" stroke-width="0.75"/>
<text x="269.28" y="240.5" font-weight="400" font-family="'Source Sans 3'" font-size="9" fill="#000">Party A</text>
<circle cx="314.96" cy="237.5" r="6" fill="#fff" stroke="#000" stroke-width="1.4"/>
<circle cx="314.96" cy="237.5" r="1.68" fill="#000"/>
<text x="331.96" y="240.5" font-weight="400" font-family="'Source Sans 3'" font-size="9" fill="#000">Party B</text>
<rect x="370.05" y="232" width="17" height="11" fill="#f0f0f0" stroke="#000" stroke-width="0.8" stroke-dasharray="3 2"/>
<text x="395.05" y="240.5" font-weight="400" font-family="'Source Sans 3'" font-size="9" fill="#000">deployment zone</text>
<rect x="222.4" y="247" width="16" height="11" fill="url(#p-imp)" stroke="#000" stroke-width="0.8"/>
<text x="246.4" y="255.5" font-weight="400" font-family="'Source Sans 3'" font-size="9" fill="#000">Chasm</text>
<polygon points="291.2,246.5 297.2,252.5 291.2,258.5 285.2,252.5" fill="#fff" stroke="#000" stroke-width="1.2" stroke-linejoin="round"/>
<line x1="288.2" y1="252.5" x2="294.2" y2="252.5" stroke="#000" stroke-width="1" stroke-linecap="butt"/>
<line x1="291.2" y1="249.5" x2="291.2" y2="255.5" stroke="#000" stroke-width="1" stroke-linecap="butt"/>
<text x="308.2" y="255.5" font-weight="400" font-family="'Source Sans 3'" font-size="9" fill="#000">objective</text>
<rect x="355.77" y="246.5" width="12" height="12" fill="#fff" stroke="#000" stroke-width="0.6"/>
<text x="378.77" y="255.5" font-weight="400" font-family="'Source Sans 3'" font-size="9" fill="#000">ledge (dashed = Crumbling)</text>
</svg>
