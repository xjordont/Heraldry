<polygon points="160.46,88.25 158.14,91.44 156.54,88.66" fill="#000"/>
<line x1="161.86" y1="90.67" x2="159.06" y2="85.83" stroke="#000" stroke-width="0.8" stroke-linecap="butt"/>
<rect x="144.84" y="90.53" width="13.19" height="10.89" fill="#fff"/>
<text x="146.64" y="98.45" font-weight="700" font-family="'Source Sans 3'" font-size="9" fill="#000">4"</text>
<polygon points="131.86,108.25 128.84,113.49 122.79,113.49 119.77,108.25 122.79,103.01 128.84,103.01" fill="url(#p-mon)" stroke="#000" stroke-width="1" stroke-linejoin="round"/>
<circle cx="127" cy="68" r="6" fill="#000" stroke="#000" stroke-width="0.5"/>
<text x="127" y="71.3" font-weight="700" font-family="'Source Sans 3'" font-size="9" fill="#fff" text-anchor="middle">1</text>
<circle cx="53" cy="127.2" r="6" fill="#000" stroke="#000" stroke-width="0.5"/>
<text x="53" y="130.5" font-weight="700" font-family="'Source Sans 3'" font-size="9" fill="#fff" text-anchor="middle">2</text>
<circle cx="83" cy="90.1" r="6" fill="#000" stroke="#000" stroke-width="0.5"/>
<text x="83" y="93.4" font-weight="700" font-family="'Source Sans 3'" font-size="9" fill="#fff" text-anchor="middle">3</text>
<circle cx="137.82" cy="116.25" r="6" fill="#000" stroke="#000" stroke-width="0.5"/>
<text x="137.82" y="119.55" font-weight="700" font-family="'Source Sans 3'" font-size="9" fill="#fff" text-anchor="middle">6</text>
<line x1="91" y1="100.1" x2="60" y2="136.2" stroke="#000" stroke-width="1.1" stroke-linecap="butt" stroke-dasharray="4.5 2.8"/>
<circle cx="91" cy="100.1" r="1.9" fill="#000"/>
<circle cx="60" cy="136.2" r="1.9" fill="#000"/>
<rect x="27.55" y="206.08" width="148.91" height="10.89" fill="#fff"/>
<text x="29.35" y="214" font-weight="600" font-family="'Source Sans 3'" font-size="9" fill="#000">Central Clearing: about 12–15" across</text>
<text x="4" y="233" font-weight="600" font-family="'Source Sans 3'" font-size="9" fill="#333">Detail of the centre of the battlefield (10 pt per</text>
<text x="4" y="243.4" font-weight="600" font-family="'Source Sans 3'" font-size="9" fill="#333">inch; Clearing drawn 13.5" across; positions</text>
<text x="4" y="253.8" font-weight="600" font-family="'Source Sans 3'" font-size="9" fill="#333">schematic).</text>
<rect x="222" y="0" width="13" height="13" fill="#000"/>
<text x="228.5" y="10.4" font-weight="700" font-family="'Source Sans 3'" font-size="9" fill="#fff" text-anchor="middle">B</text>
<text x="240" y="10.4" font-weight="700" font-family="'Source Sans 3'" font-size="9.5" fill="#000">Two parties, one Monster (PvPvE)</text>
<circle cx="228.6" cy="29" r="6.6" fill="#000" stroke="#000" stroke-width="0.5"/>
<text x="228.6" y="32.3" font-weight="700" font-family="'Source Sans 3'" font-size="9" fill="#fff" text-anchor="middle">1</text>
<text x="241.2" y="30" font-family="'Source Sans 3'" font-size="9" fill="#000"><tspan font-weight="700">Activate a Stone (10.4):</tspan><tspan font-weight="400"> a Hero adjacent to a Standing Stone uses</tspan></text>
<text x="241.2" y="40.5" font-weight="400" font-family="'Source Sans 3'" font-size="9" fill="#000">Interact [2 AP] and makes a SPI Check. A stone is claimed by only one</text>
<text x="241.2" y="51" font-weight="400" font-family="'Source Sans 3'" font-size="9" fill="#000">party. Here a Party A Hero Interacts with a Stone first.</text>
<circle cx="228.6" cy="65.5" r="6.6" fill="#000" stroke="#000" stroke-width="0.5"/>
<text x="228.6" y="68.8" font-weight="700" font-family="'Source Sans 3'" font-size="9" fill="#fff" text-anchor="middle">2</text>
<text x="241.2" y="66.5" font-family="'Source Sans 3'" font-size="9" fill="#000"><tspan font-weight="700">Rival attempt:</tspan><tspan font-weight="400"> a Party B Hero later attempts to activate another</tspan></text>
<text x="241.2" y="77" font-weight="400" font-family="'Source Sans 3'" font-size="9" fill="#000">Stone.</text>
<circle cx="228.6" cy="91.5" r="6.6" fill="#000" stroke="#000" stroke-width="0.5"/>
<text x="228.6" y="94.8" font-weight="700" font-family="'Source Sans 3'" font-size="9" fill="#fff" text-anchor="middle">3</text>
<text x="241.2" y="92.5" font-family="'Source Sans 3'" font-size="9" fill="#000"><tspan font-weight="700">Antlered Warden:</tspan><tspan font-weight="400"> not placed at setup. When a Hero first Interacts</tspan></text>
<text x="241.2" y="103" font-weight="400" font-family="'Source Sans 3'" font-size="9" fill="#000">with a Standing Stone, it is placed adjacent to that Stone (here, the</text>
<text x="241.2" y="113.5" font-weight="400" font-family="'Source Sans 3'" font-size="9" fill="#000">Party A Hero’s Stone) and is Awake when placed.</text>
<circle cx="228.6" cy="128" r="6.6" fill="#000" stroke="#000" stroke-width="0.5"/>
<text x="228.6" y="131.3" font-weight="700" font-family="'Source Sans 3'" font-size="9" fill="#fff" text-anchor="middle">4</text>
<text x="241.2" y="129" font-family="'Source Sans 3'" font-size="9" fill="#000"><tspan font-weight="700">Monster Phase:</tspan><tspan font-weight="400"> the Warden's Target Priority is the valid Hero who</tspan></text>
<text x="241.2" y="139.5" font-weight="400" font-family="'Source Sans 3'" font-size="9" fill="#000">most recently activated or attempted to activate a Standing Stone,</text>
<text x="241.2" y="150" font-weight="400" font-family="'Source Sans 3'" font-size="9" fill="#000">here the Party B Hero. If no listed target is valid, the normal Monster</text>
<text x="241.2" y="160.5" font-weight="400" font-family="'Source Sans 3'" font-size="9" fill="#000">target priorities apply (9.5 E).</text>
<circle cx="228.6" cy="175" r="6.6" fill="#000" stroke="#000" stroke-width="0.5"/>
<text x="228.6" y="178.3" font-weight="700" font-family="'Source Sans 3'" font-size="9" fill="#fff" text-anchor="middle">5</text>
<text x="241.2" y="176" font-family="'Source Sans 3'" font-size="9" fill="#000"><tspan font-weight="700">AI Step 1, Entangling Roots:</tspan><tspan font-weight="400"> if the Primary Target is within 8" and not</tspan></text>
<text x="241.2" y="186.5" font-weight="400" font-family="'Source Sans 3'" font-size="9" fill="#000">Immobilized, it must pass a DEX Check or become Immobilized. The</text>
<text x="241.2" y="197" font-weight="400" font-family="'Source Sans 3'" font-size="9" fill="#000">activation then ends.</text>
<circle cx="228.6" cy="211.5" r="6.6" fill="#000" stroke="#000" stroke-width="0.5"/>
<text x="228.6" y="214.8" font-weight="700" font-family="'Source Sans 3'" font-size="9" fill="#fff" text-anchor="middle">6</text>
<text x="241.2" y="212.5" font-family="'Source Sans 3'" font-size="9" fill="#000"><tspan font-weight="700">Random Monster Group 2:</tspan><tspan font-weight="400"> placed inside the Central Clearing, 4"</tspan></text>
<text x="241.2" y="223" font-weight="400" font-family="'Source Sans 3'" font-size="9" fill="#000">from its edge, Resting. Groups 1 and 3 (near a Stone and a Treasure</text>
<text x="241.2" y="233.5" font-weight="400" font-family="'Source Sans 3'" font-size="9" fill="#000">Chest) are not drawn.</text>
<text x="222" y="253" font-weight="700" font-family="'Source Sans 3'" font-size="9" fill="#000">Key</text>
<circle cx="253.88" cy="253" r="6" fill="#000" stroke="#000" stroke-width="0.75"/>
<text x="270.88" y="256" font-weight="400" font-family="'Source Sans 3'" font-size="9" fill="#000">Party A Hero</text>
<circle cx="336.69" cy="253" r="6" fill="#fff" stroke="#000" stroke-width="1.4"/>
<circle cx="336.69" cy="253" r="1.68" fill="#000"/>
<text x="353.69" y="256" font-weight="400" font-family="'Source Sans 3'" font-size="9" fill="#000">Party B Hero</text>
<rect x="413.92" y="247" width="12" height="12" fill="url(#p-mon)" stroke="#000" stroke-width="1.4"/>
<text x="436.92" y="256" font-weight="400" font-family="'Source Sans 3'" font-size="9" fill="#000">Antlered Warden</text>
<polygon points="237.48,268 234.24,273.61 227.76,273.61 224.52,268 227.76,262.39 234.24,262.39" fill="url(#p-mon)" stroke="#000" stroke-width="1" stroke-linejoin="round"/>
<text x="248" y="271" font-weight="400" font-family="'Source Sans 3'" font-size="9" fill="#000">Monster Group 2</text>
<polygon points="329.26,262 335.26,268 329.26,274 323.26,268" fill="#fff" stroke="#000" stroke-width="1.2" stroke-linejoin="round"/>
<line x1="326.26" y1="268" x2="332.26" y2="268" stroke="#000" stroke-width="1" stroke-linecap="butt"/>
<line x1="329.26" y1="265" x2="329.26" y2="271" stroke="#000" stroke-width="1" stroke-linecap="butt"/>
<text x="346.26" y="271" font-weight="400" font-family="'Source Sans 3'" font-size="9" fill="#000">Standing Stone</text>
<line x1="415.15" y1="268" x2="433.15" y2="268" stroke="#000" stroke-width="1.1" stroke-linecap="butt" stroke-dasharray="4.5 2.8"/>
<circle cx="415.15" cy="268" r="1.9" fill="#000"/>
<circle cx="433.15" cy="268" r="1.9" fill="#000"/>
<text x="440.15" y="271" font-weight="400" font-family="'Source Sans 3'" font-size="9" fill="#000">Warden's target</text>
</svg>
